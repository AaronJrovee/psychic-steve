<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychic Steve</title>
    <!-- Tailwind for overlay styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js for 2D Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Inter', sans-serif;
            user-select: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #87CEEB; /* Sky blue */
            box-shadow: 0 0 35px rgba(0,0,0,0.7);
            max-width: 100%;
            max-height: 100%;
            cursor: crosshair;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 24, 39, 0.88);
            color: white;
            padding: 2.75rem 3.75rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            border: 2px solid #a855f7;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.5);
            display: none;
        }
        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 29, 0.65);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
        }
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(168, 85, 247, 0.65), 0 0 55px rgba(192, 38, 211, 0.4);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 0 45px rgba(168, 85, 247, 0.95), 0 0 85px rgba(192, 38, 211, 0.65);
            }
        }
        .play-btn {
            background: linear-gradient(135deg, #9333ea, #c026d3);
            color: white;
            border: 3px solid rgba(243, 232, 255, 0.9);
            padding: 1.2rem 4.5rem;
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            border-radius: 9999px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.2s ease, filter 0.2s ease;
            animation: pulseGlow 2.2s infinite ease-in-out;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }
        .play-btn:hover {
            transform: scale(1.12) !important;
            filter: brightness(1.2);
            animation-play-state: paused;
            box-shadow: 0 0 60px rgba(216, 180, 254, 1), 0 0 95px rgba(192, 38, 211, 0.9);
        }
        .play-btn:active {
            transform: scale(1.02) !important;
        }
        .restart-btn {
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 0.85rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .restart-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1440" height="960"></canvas>
    
    <div id="ui-layer">
        <!-- Title Screen -->
        <div id="title-screen">
            <h1 class="text-7xl font-extrabold tracking-wider text-purple-400 drop-shadow-[0_0_30px_rgba(160,32,240,0.9)] mb-3">PSYCHIC STEVE</h1>
            <p class="text-xl text-purple-200 mb-2 font-medium">A / D or Arrows to Move • W or Up to Jump • S to Duck</p>
            <p class="text-sm text-purple-300 mb-6 tracking-wide">HOLD Left Mouse or use Touch Controls to channel psychic waves & fling targets • Release to throw</p>
            <button class="play-btn" onclick="startGame()">PLAY</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-box" class="message-box">
            <h1 class="text-4xl font-extrabold text-red-500 mb-2 drop-shadow-md">YOU DIED</h1>
            <p id="wave-reached" class="text-xl mb-4 text-purple-200"></p>
            <button class="restart-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>
</div>

<script>
    // --- SYNTHESIZED SOUND EFFECTS & INTENSE MUSIC (Web Audio API) ---
    const SoundFX = {
        ctx: null,
        bgmInterval: null,
        bgmStep: 0,
        isBgmPlaying: false,
        noiseBuf: null, // Pre-allocated reusable noise buffer to eliminate GC pauses

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            // Pre-bake reusable noise buffer once
            if (this.ctx && !this.noiseBuf) {
                const sampleRate = this.ctx.sampleRate;
                const length = Math.floor(sampleRate * 0.15); // 150ms buffer
                this.noiseBuf = this.ctx.createBuffer(1, length, sampleRate);
                const data = this.noiseBuf.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-4 * (i / length));
                }
            }
        },

        startMusic() {
            if (!this.ctx || this.isBgmPlaying) return;
            this.isBgmPlaying = true;
            this.bgmStep = 0;

            // 138 BPM driving groove: 16th notes every ~108.7ms
            const stepDuration = 60 / 138 / 4; 

            // 64-Step Extended Memorable Battle Theme (4 distinct musical sections / chord phases)
            // Chords: Dm (0-15) -> Bb (16-31) -> Gm (32-47) -> A / C (48-63)
            const bassline64 = [
                // Section 1: Dm (Steps 0-15) - Driving bounce
                73.42, 73.42, 146.83, 73.42,  82.41, 73.42, 146.83, 73.42,
                73.42, 73.42, 146.83, 73.42,  87.31, 73.42, 110.00, 73.42,

                // Section 2: Bb Maj (Steps 16-31) - Ascending lift
                58.27, 58.27, 116.54, 58.27,  65.41, 58.27, 116.54, 58.27,
                58.27, 58.27, 116.54, 58.27,  77.78, 58.27, 116.54, 65.41,

                // Section 3: Gm (Steps 32-47) - Gritty momentum
                49.00, 49.00, 98.00,  49.00,  58.27, 49.00, 98.00,  49.00,
                49.00, 49.00, 98.00,  49.00,  65.41, 49.00, 87.31, 110.00,

                // Section 4: A Maj / Turnaround (Steps 48-63) - Climactic tension
                55.00, 55.00, 110.00, 55.00,  69.30, 55.00, 110.00, 55.00,
                55.00, 55.00, 110.00, 73.42,  82.41, 87.31, 110.00, 130.81
            ];

            // Catchy, melodic lead synth hook with syncopation, call-and-response, and variations
            const leadNotes64 = [
                // Melody Hook A (0-15): The iconic motif
                293.66, 0, 293.66, 349.23, 0, 440.00, 0, 392.00,
                349.23, 0, 293.66, 0,      261.63, 0, 293.66, 0,

                // Melody Lift B (16-31): High energetic counter-melody
                466.16, 0, 466.16, 523.25, 0, 587.33, 0, 523.25,
                466.16, 0, 440.00, 0,      392.00, 0, 440.00, 0,

                // Melody Variation C (32-47): Rapid syncopated arpeggio run
                392.00, 0, 349.23, 392.00, 0, 440.00, 0, 466.16,
                523.25, 0, 466.16, 440.00, 0, 392.00, 349.23, 0,

                // Melody Climax D (48-63): Tension rise resolving into the loop turnaround
                440.00, 0, 440.00, 523.25, 0, 554.37, 0, 587.33,
                659.25, 0, 587.33, 554.37, 0, 440.00, 523.25, 0
            ];

            // Harmonic Pad Chord roots (Hz) providing rich atmosphere behind the lead
            const chordPadProgression = [
                220.00, // Dm root 
                174.61, // Bb root
                196.00, // G root
                220.00  // A root
            ];

            this.bgmInterval = setInterval(() => {
                if (!this.ctx || !this.isBgmPlaying) return;
                const now = this.ctx.currentTime;
                const step = this.bgmStep % 64;
                const bar = Math.floor(step / 16);

                // 1. Kick Drum (Heavy on beats 0, 4, 8, 12 + occasional 14 fill)
                const isKick = (step % 4 === 0) || (step % 16 === 14 && bar % 2 === 1);
                if (isKick) {
                    const kickOsc = this.ctx.createOscillator();
                    const kickGain = this.ctx.createGain();
                    kickOsc.type = 'sine';
                    kickOsc.frequency.setValueAtTime(145, now);
                    kickOsc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                    kickGain.gain.setValueAtTime(0.16, now);
                    kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    kickOsc.connect(kickGain);
                    kickGain.connect(this.ctx.destination);
                    kickOsc.start(now);
                    kickOsc.stop(now + 0.15);
                }

                // 2. Gritty Snare / Hi-Hat Percussion (Uses pre-allocated noise buffer)
                if (this.noiseBuf) {
                    const hatNoise = this.ctx.createBufferSource();
                    hatNoise.buffer = this.noiseBuf;

                    const isSnare = (step % 8 === 4);
                    const hatFilter = this.ctx.createBiquadFilter();
                    hatFilter.type = isSnare ? 'bandpass' : 'highpass';
                    hatFilter.frequency.setValueAtTime(isSnare ? 1600 : 7500, now);

                    const hatGain = this.ctx.createGain();
                    const hatVol = isSnare ? 0.09 : (step % 2 === 0 ? 0.035 : 0.015);
                    hatGain.gain.setValueAtTime(hatVol, now);
                    hatGain.gain.exponentialRampToValueAtTime(0.001, now + (isSnare ? 0.08 : 0.04));

                    hatNoise.connect(hatFilter);
                    hatFilter.connect(hatGain);
                    hatGain.connect(this.ctx.destination);
                    hatNoise.start(now);
                }

                // 3. Rolling Bassline Synth
                const bassFreq = bassline64[step];
                if (bassFreq) {
                    const bassOsc = this.ctx.createOscillator();
                    const bassGain = this.ctx.createGain();
                    const bassFilter = this.ctx.createBiquadFilter();

                    bassOsc.type = 'sawtooth';
                    bassOsc.frequency.setValueAtTime(bassFreq, now);

                    bassFilter.type = 'lowpass';
                    bassFilter.frequency.setValueAtTime(320, now);
                    bassFilter.frequency.exponentialRampToValueAtTime(100, now + 0.10);

                    bassGain.gain.setValueAtTime(0.08, now);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

                    bassOsc.connect(bassFilter);
                    bassFilter.connect(bassGain);
                    bassGain.connect(this.ctx.destination);

                    bassOsc.start(now);
                    bassOsc.stop(now + 0.11);
                }

                // 4. Harmonic Background Pad (played every 8 steps to sustain atmosphere)
                if (step % 8 === 0) {
                    const padFreq = chordPadProgression[bar];
                    const padOsc = this.ctx.createOscillator();
                    const padGain = this.ctx.createGain();
                    const padFilter = this.ctx.createBiquadFilter();

                    padOsc.type = 'triangle';
                    padOsc.frequency.setValueAtTime(padFreq, now);

                    padFilter.type = 'lowpass';
                    padFilter.frequency.setValueAtTime(450, now);

                    padGain.gain.setValueAtTime(0.03, now);
                    padGain.gain.linearRampToValueAtTime(0.02, now + 0.35);
                    padGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                    padOsc.connect(padFilter);
                    padFilter.connect(padGain);
                    padGain.connect(this.ctx.destination);

                    padOsc.start(now);
                    padOsc.stop(now + 0.7);
                }

                // 5. Catchy Lead Melody Synth (Square/Saw pulse with vibrato bite)
                const leadFreq = leadNotes64[step];
                if (leadFreq > 0) {
                    const leadOsc = this.ctx.createOscillator();
                    const leadGain = this.ctx.createGain();
                    const leadFilter = this.ctx.createBiquadFilter();

                    leadOsc.type = 'square';
                    leadOsc.frequency.setValueAtTime(leadFreq, now);

                    leadFilter.type = 'lowpass';
                    leadFilter.frequency.setValueAtTime(2200, now);
                    leadFilter.frequency.exponentialRampToValueAtTime(750, now + 0.14);

                    leadGain.gain.setValueAtTime(0.04, now);
                    leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                    leadOsc.connect(leadFilter);
                    leadFilter.connect(leadGain);
                    leadGain.connect(this.ctx.destination);

                    leadOsc.start(now);
                    leadOsc.stop(now + 0.15);
                }

                this.bgmStep++;
            }, stepDuration * 1000);
        },

        stopMusic() {
            if (this.bgmInterval) {
                clearInterval(this.bgmInterval);
                this.bgmInterval = null;
            }
            this.isBgmPlaying = false;
        },

        playJump() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(380, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        },

        playHeal() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            // Cheerful ascending sparkle chime
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                gain.gain.setValueAtTime(0.18, now + idx * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + idx * 0.05);
                osc.stop(now + idx * 0.05 + 0.22);
            });
        },

        playExplosion(intensity = 1.0) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const dur = 0.45 * intensity;
            const bufSize = this.ctx.sampleRate * dur;
            const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * (i / bufSize));
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + dur);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.4 * intensity, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(now);
        },

        playPlayerHurt() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            
            // Heavy sub drop layer
            const subOsc = this.ctx.createOscillator();
            const subGain = this.ctx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(130, now);
            subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.22);
            subGain.gain.setValueAtTime(0.55, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            subOsc.connect(subGain);
            subGain.connect(this.ctx.destination);
            subOsc.start(now);
            subOsc.stop(now + 0.24);

            // Punchy low saw crack
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 0.16);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
        },

        playHit() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            // Deep punchy bass transient impact
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(28, now + 0.13);

            gain.gain.setValueAtTime(0.48, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

            // Punchy low distortion crunch
            const crunch = this.ctx.createOscillator();
            const crunchGain = this.ctx.createGain();
            crunch.type = 'sawtooth';
            crunch.frequency.setValueAtTime(75, now);
            crunch.frequency.exponentialRampToValueAtTime(20, now + 0.08);

            crunchGain.gain.setValueAtTime(0.35, now);
            crunchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

            osc.connect(gain);
            gain.connect(this.ctx.destination);

            crunch.connect(crunchGain);
            crunchGain.connect(this.ctx.destination);

            osc.start(now);
            crunch.start(now);
            osc.stop(now + 0.14);
            crunch.stop(now + 0.09);
        },

        playThrow() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, now);
            osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
        },

        playWaveStart() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            
            // Dark, ominous low war-horn drone (minor second / tritone tension)
            const lowFreqs = [58.27, 82.41, 116.54]; // Bb1, E2, Bb2
            lowFreqs.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.92, now + 0.7);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(320, now);
                filter.frequency.exponentialRampToValueAtTime(90, now + 0.7);

                gain.gain.setValueAtTime(0.32 / (idx + 1), now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.75);
            });

            // Distant metallic impact hit
            const impactOsc = this.ctx.createOscillator();
            const impactGain = this.ctx.createGain();
            impactOsc.type = 'triangle';
            impactOsc.frequency.setValueAtTime(95, now);
            impactOsc.frequency.exponentialRampToValueAtTime(24, now + 0.45);
            impactGain.gain.setValueAtTime(0.45, now);
            impactGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            impactOsc.connect(impactGain);
            impactGain.connect(this.ctx.destination);
            impactOsc.start(now);
            impactOsc.stop(now + 0.5);
        },

        startPsychicHum() {
            // Disabled per user request
        },

        stopPsychicHum() {
            // Disabled per user request
        }
    };

    // --- MATTER.JS ALIASES ---
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Body = Matter.Body,
          Composite = Matter.Composite,
          Events = Matter.Events,
          Vector = Matter.Vector,
          Query = Matter.Query;

    // --- GLOBALS & CONFIG ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const engine = Engine.create();
    engine.gravity.y = 2.0;

    let isLooping = true;
    let gameStarted = false;
    let playerDeathFade = 0;
    let wave = 1;
    let waveTimer = 0;
    let waveBannerTimer = 0;
    const WAVE_BANNER_DURATION = 150;
    let entities = [];
    let particles = [];
    let shakeAmount = 0;
    let livingEnemiesCount = 0; // Cached live enemy count to avoid per-frame array allocations

    // Strict Mouse State
    const mouse = { x: 0, y: 0, isDown: false };
    
    // Key Tracking
    const keys = { w: false, a: false, s: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowDown: false, ArrowRight: false };

    // --- ON-SCREEN TOUCH & JOYSTICK CONTROLS CONFIG ---
    const isMobileDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia('(pointer: coarse)').matches;

    // Movement D-pad buttons (Bottom-Left) - Spread out bottom 3 buttons with extra spacing
    const onScreenButtons = [
        { id: 'up', key: 'w', x: 200, y: 680, r: 52, label: '▲', active: false },
        { id: 'left', key: 'a', x: 75, y: 815, r: 52, label: '◀', active: false },
        { id: 'down', key: 's', x: 200, y: 815, r: 52, label: '▼', active: false },
        { id: 'right', key: 'd', x: 325, y: 815, r: 52, label: '▶', active: false }
    ];

    // Psychic Joystick (Bottom-Right, active for mobile/touch) - Enlarged base and handle
    const psychicJoystick = {
        baseX: 1260,
        baseY: 790,
        baseRadius: 110,
        stickX: 1260,
        stickY: 790,
        handleRadius: 52,
        touchId: null,
        active: false,
        angle: 0,
        distanceRatio: 0 // 0 to 1 scaling psychic reach up to 450px
    };

    // Active touch bindings
    const activeTouches = new Map();

    function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    // --- HELPER CLASSES ---

    class Particle {
        constructor(x, y, color, speed, size, life) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * speed;
            this.vy = (Math.random() - 0.5) * speed;
            this.color = color;
            this.size = size;
            this.life = life;
            this.maxLife = life;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function createExplosion(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color, 16, Math.random() * 5 + 2, 25 + Math.random() * 25));
        }
    }

    // --- BASE ENTITY ---

    class Entity {
        constructor(body, hp, type, weight = 1.0) {
            this.body = body;
            this.hp = hp;
            this.maxHp = hp;
            this.type = type;
            this.weight = weight;
            this.body.entity = this; 
            this.markedForDeletion = false;
            this.isDying = false;
            this.canBeGrabbed = true;
            this.isEntering = false;
            Composite.add(engine.world, this.body);
            entities.push(this);
        }

        takeDamage(amount, sourceBody = null) {
            if (this.hp <= 0 || this.isDying) return;
            this.hp -= amount;

            if (this.type === 'slime' || this.type === 'zombie' || this.type === 'golem') {
                SoundFX.playHit();
                shakeAmount = Math.max(shakeAmount, Math.min(18, 6 + amount * 0.35));

                // Satisfying knockback applied whenever mobs take damage from collisions, walls, or bombs
                if (sourceBody) {
                    const sourcePos = sourceBody.position || sourceBody;
                    let dx = this.body.position.x - sourcePos.x;
                    let dy = this.body.position.y - sourcePos.y;
                    const len = Math.hypot(dx, dy) || 1;
                    
                    // Knock them up and away from the damage source
                    const nx = dx / len;
                    const impulseX = nx * (7 + Math.min(amount * 0.4, 12));
                    const impulseY = -Math.max(6, Math.min(16, 5 + amount * 0.5));
                    
                    Matter.Body.setVelocity(this.body, {
                        x: impulseX,
                        y: impulseY
                    });
                }
            }

            if (this.hp <= 0) {
                this.hp = 0;
                this.die(sourceBody);
            }
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            this.isDying = true;
            this.markedForDeletion = true;
            
            shakeAmount = 16;
            
            let expColor = '#ffffff';
            if (this.type === 'slime') expColor = '#32cd32';
            else if (this.type === 'zombie') expColor = '#2E8B57';
            else if (this.type === 'golem') expColor = '#708090';
            else if (this.type === 'box') expColor = '#8B4513';
            else if (this.type === 'player') expColor = '#ff2222';
            else if (this.type === 'bomb') expColor = '#FF4500';
            
            createExplosion(this.body.position.x, this.body.position.y, expColor, 40);
        }

        update() {}
        draw(ctx) {}

        drawHpBar(ctx, yOffset) {
            if (this.hp >= this.maxHp || this.hp <= 0 || this.isDying) return;
            const width = 60;
            const height = 8;
            const x = this.body.position.x - width / 2;
            const y = this.body.position.y - yOffset;
            
            ctx.fillStyle = 'red';
            ctx.fillRect(x, y, width, height);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, width * (this.hp / this.maxHp), height);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, y, width, height);
        }
    }

    // --- PLAYER ENTITY ---

    class Player extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 45, 120, { 
                inertia: Infinity, 
                friction: 0.1,
                restitution: 0,
                density: 0.002
            });
            super(body, 100, 'player');
            this.animTimer = 0;
            this.isDucking = false;
            this.canJump = false;
            this.grabbedEntity = null;
            this.invulnerableTimer = 0;
            this.grabTimer = 0;
            this.maxGrabDuration = 120; // Base 2 seconds at 60 FPS
        }

        takeDamage(amount, sourceBody = null) {
            if (this.invulnerableTimer > 0 && amount < 1000) return;
            
            // Ducking provides defensive bracing: cuts incoming damage by 50%
            let finalAmount = amount;
            if (this.isDucking && amount < 1000) {
                finalAmount = Math.max(1, Math.round(amount * 0.5));
            }

            super.takeDamage(finalAmount, sourceBody);
            if (!this.isDying) {
                SoundFX.playPlayerHurt();
                this.invulnerableTimer = 55;
                // Add screen shake proportional to damage taken
                shakeAmount = Math.max(shakeAmount, Math.min(28, 12 + finalAmount * 0.5));
            }
        }

        releaseGrip(impartBoost = false) {
            if (this.grabbedEntity && !this.grabbedEntity.markedForDeletion) {
                const b = this.grabbedEntity.body;
                if (impartBoost) {
                    Body.setVelocity(b, { x: b.velocity.x * 1.5, y: b.velocity.y * 1.5 });
                    SoundFX.playThrow();
                }
            }
            this.grabbedEntity = null;
            this.grabTimer = 0;
            SoundFX.stopPsychicHum();
        }

        update() {
            if (this.invulnerableTimer > 0) {
                this.invulnerableTimer--;
            }

            if (this.isDying) return;

            // Heal over time: gradually recover 1 HP every ~1.5 seconds (90 ticks) up to 100 max HP
            this.healTimer = (this.healTimer || 0) + 1;
            if (this.healTimer >= 90) {
                this.healTimer = 0;
                if (this.hp < this.maxHp) {
                    this.hp = Math.min(this.maxHp, this.hp + 1);
                }
            }

            const moveSpeed = 8;
            const jumpVelocityY = -18; 
            
            let vx = this.body.velocity.x;
            let vy = this.body.velocity.y;

            this.isDucking = keys.s || keys.ArrowDown;

            if (keys.a || keys.ArrowLeft) {
                vx = -moveSpeed;
                this.animTimer += 0.2;
            } else if (keys.d || keys.ArrowRight) {
                vx = moveSpeed;
                this.animTimer += 0.2;
            } else {
                vx *= 0.5; 
                this.animTimer = 0;
            }

            if (this.isDucking) vx *= 0.3; 

            if ((keys.w || keys.ArrowUp) && this.canJump) {
                vy = jumpVelocityY;
                this.canJump = false;
                SoundFX.playJump();
            }

            // Accelerated natural downward fall gravity
            if (!this.canJump && vy > 0) {
                vy += 0.65;
            }

            // Fast fall acceleration when ducking in mid-air
            if (this.isDucking && !this.canJump) {
                vy += 1.2;
            }

            // ONLY slow fall when the mouse is physically held down
            if (mouse.isDown && vy > 1.8) {
                vy = 1.8;
            }

            // Clamp maximum upward velocity against anomalous physics impulses
            if (vy < -22) {
                vy = -22;
            }

            Body.setVelocity(this.body, { x: vx, y: vy });

            // Keep Steve strictly inside the visible screen boundaries
            const minX = 25;
            const maxX = 1415;
            let currentX = this.body.position.x;
            let currentY = this.body.position.y;
            let clamped = false;

            if (currentX < minX) {
                currentX = minX;
                if (this.body.velocity.x < 0) Body.setVelocity(this.body, { x: 0, y: this.body.velocity.y });
                clamped = true;
            } else if (currentX > maxX) {
                currentX = maxX;
                if (this.body.velocity.x > 0) Body.setVelocity(this.body, { x: 0, y: this.body.velocity.y });
                clamped = true;
            }

            // Floor safeguard against falling below the ground
            if (currentY > 840) {
                currentY = 840;
                if (this.body.velocity.y > 0) Body.setVelocity(this.body, { x: this.body.velocity.x, y: 0 });
                this.canJump = true;
                clamped = true;
            }

            if (clamped) {
                Body.setPosition(this.body, { x: currentX, y: currentY });
            }

            // Psychic interaction logic while holding mouse
            const maxGrabRadius = 450;
            if (mouse.isDown) {
                if (!this.grabbedEntity) {
                    const bodiesUnderCursor = Query.point(
                        entities.map(e => e.body),
                        { x: mouse.x, y: mouse.y }
                    );

                    for (let b of bodiesUnderCursor) {
                        if (b.entity && b.entity !== this && !b.entity.isDying && b.entity.canBeGrabbed !== false) {
                            const dist = Vector.magnitude(Vector.sub(b.position, this.body.position));
                            if (dist <= maxGrabRadius) {
                                this.grabbedEntity = b.entity;
                                this.grabbedEntity.body.isThrown = true;
                                this.grabbedEntity.isEntering = false;
                                // Grab duration is inversely proportional to weight (heavier = harder to hold)
                                const w = this.grabbedEntity.weight || 1.0;
                                this.grabTimer = Math.max(30, Math.round(this.maxGrabDuration / Math.sqrt(w)));
                                break;
                            }
                        }
                    }
                }

                if (this.grabbedEntity) {
                    if (this.grabbedEntity.isDying || this.grabbedEntity.markedForDeletion) {
                        this.grabbedEntity = null;
                        this.grabTimer = 0;
                    } else {
                        const b = this.grabbedEntity.body;
                        const distFromSteve = Vector.magnitude(Vector.sub(b.position, this.body.position));

                        // Auto-throw if target is outside psychic radius
                        if (distFromSteve > maxGrabRadius) {
                            this.releaseGrip(true);
                            return;
                        }

                        // Decrement grab duration timer (2 second limit)
                        this.grabTimer--;
                        if (this.grabTimer <= 0) {
                            // Drop and prevent re-grab until it lands on the ground
                            this.grabbedEntity.canBeGrabbed = false;
                            this.releaseGrip(false);
                            return;
                        }

                        const target = { x: mouse.x, y: mouse.y };
                        const mouseDistFromSteve = Vector.magnitude(Vector.sub(target, this.body.position));

                        if (mouseDistFromSteve > maxGrabRadius) {
                            const angle = Math.atan2(target.y - this.body.position.y, target.x - this.body.position.x);
                            target.x = this.body.position.x + Math.cos(angle) * maxGrabRadius;
                            target.y = this.body.position.y + Math.sin(angle) * maxGrabRadius;
                        }

                        const force = Vector.sub(target, b.position);
                        const weightFactor = Math.max(0.4, 1.4 / Math.sqrt(this.grabbedEntity.weight || 1));
                        Body.setVelocity(b, {
                            x: Math.max(-25, Math.min(25, force.x * 0.28 * weightFactor)),
                            y: Math.max(-25, Math.min(25, force.y * 0.28 * weightFactor))
                        });
                        b.isThrown = true;
                    }
                }
            } else if (this.grabbedEntity) {
                this.releaseGrip(true);
            }
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            this.isDying = true;
            this.markedForDeletion = true;
            
            shakeAmount = 30;
            SoundFX.stopMusic();
            SoundFX.playExplosion(1.4);
            createExplosion(this.body.position.x, this.body.position.y, '#ff2222', 45);
            createExplosion(this.body.position.x, this.body.position.y, '#ffa500', 35);
            createExplosion(this.body.position.x, this.body.position.y, '#111111', 25);
            createExplosion(this.body.position.x, this.body.position.y, '#a020f0', 20);

            this.releaseGrip(false);
        }

        draw(ctx) {
            if (this.markedForDeletion) return;
            
            // Invulnerability flashing
            if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 4) % 2 === 0) {
                this.drawHpBarUI();
                return;
            }

            const pos = this.body.position;
            const maxGrabRadius = 450;

            // ONLY render psychic beams, reticle, and tendrils when mouse is physically held down
            if (mouse.isDown) {
                ctx.save();

                let targetX, targetY;
                let isConnected = false;

                if (this.grabbedEntity && !this.grabbedEntity.markedForDeletion) {
                    targetX = this.grabbedEntity.body.position.x;
                    targetY = this.grabbedEntity.body.position.y;
                    isConnected = true;
                } else {
                    const dx = mouse.x - pos.x;
                    const dy = mouse.y - pos.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > maxGrabRadius) {
                        const angle = Math.atan2(dy, dx);
                        targetX = pos.x + Math.cos(angle) * maxGrabRadius;
                        targetY = pos.y + Math.sin(angle) * maxGrabRadius;
                    } else {
                        targetX = mouse.x;
                        targetY = mouse.y;
                    }
                }

                ctx.shadowColor = '#d946ef';
                ctx.shadowBlur = isConnected ? 24 : 14;

                const beamCount = isConnected ? 4 : 3;
                for (let w = 0; w < beamCount; w++) {
                    ctx.strokeStyle = w === 0 ? 'rgba(255, 255, 255, 0.9)' : (isConnected ? '#a020f0' : 'rgba(160, 32, 240, 0.7)');
                    ctx.lineWidth = w === 0 ? 2.5 : (isConnected ? 4 : 3);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y - 15);

                    const jitter = isConnected ? 60 : 35;
                    const cp1x = pos.x + (targetX - pos.x) / 3 + (Math.random() - 0.5) * jitter;
                    const cp1y = (pos.y - 15) + (targetY - (pos.y - 15)) / 3 + (Math.random() - 0.5) * jitter;
                    const cp2x = pos.x + 2 * (targetX - pos.x) / 3 + (Math.random() - 0.5) * jitter;
                    const cp2y = (pos.y - 15) + 2 * (targetY - (pos.y - 15)) / 3 + (Math.random() - 0.5) * jitter;

                    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, targetX, targetY);
                    ctx.stroke();
                }

                if (isConnected) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2.5;
                    ctx.strokeRect(targetX - 32, targetY - 32, 64, 64);

                    const pulse = (Date.now() % 1000) / 1000 * 20;
                    ctx.strokeStyle = 'rgba(217, 70, 239, 0.65)';
                    ctx.strokeRect(targetX - 32 - pulse, targetY - 32 - pulse, 64 + pulse * 2, 64 + pulse * 2);
                } else {
                    ctx.fillStyle = '#a020f0';
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 6 + Math.sin(Date.now() / 80) * 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 14, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // Draw Stick Figure
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            const duckOffset = this.isDucking ? 30 : 0;
            
            // Head
            ctx.beginPath();
            ctx.arc(0, -45 + duckOffset, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.stroke();

            // Eyes (2 eyes tracking mouse or direction)
            let eyeLookX = 0;
            let eyeLookY = 0;
            if (mouse.isDown) {
                const angle = Math.atan2(mouse.y - pos.y, mouse.x - pos.x);
                eyeLookX = Math.cos(angle) * 3;
                eyeLookY = Math.sin(angle) * 3;
            } else if (Math.abs(this.body.velocity.x) > 0.5) {
                eyeLookX = (this.body.velocity.x > 0 ? 1 : -1) * 3;
            }

            // Eye whites & pupils
            ctx.fillStyle = '#000000';
            // Left eye
            ctx.beginPath();
            ctx.arc(-6 + eyeLookX, -46 + duckOffset + eyeLookY, 2.8, 0, Math.PI * 2);
            ctx.fill();
            // Right eye
            ctx.beginPath();
            ctx.arc(6 + eyeLookX, -46 + duckOffset + eyeLookY, 2.8, 0, Math.PI * 2);
            ctx.fill();

            // Torso
            ctx.beginPath();
            ctx.moveTo(0, -27 + duckOffset);
            ctx.lineTo(0, 22);
            ctx.stroke();

            let armSwing = Math.sin(this.animTimer) * 22;
            let legSwing = Math.cos(this.animTimer) * 22;
            
            if (this.isDucking) {
                armSwing = 0;
                legSwing = 0;
            }

            // Arms: only point towards cursor when psychic power is physically held
            ctx.beginPath();
            ctx.moveTo(0, -15 + duckOffset); 
            if (mouse.isDown) {
                const angle = Math.atan2(mouse.y - pos.y, mouse.x - pos.x);
                ctx.lineTo(Math.cos(angle) * 37, Math.sin(angle) * 37);
            } else {
                ctx.lineTo(-22 + armSwing, 7 + duckOffset);
                ctx.moveTo(0, -15 + duckOffset);
                ctx.lineTo(22 - armSwing, 7 + duckOffset);
            }
            ctx.stroke();

            // Legs
            ctx.beginPath();
            ctx.moveTo(0, 22); 
            if (this.isDucking) {
                ctx.lineTo(-22, 45);
                ctx.moveTo(0, 22);
                ctx.lineTo(22, 45);
            } else if (!this.canJump) { 
                ctx.lineTo(-15, 45);
                ctx.lineTo(-7, 60);
                ctx.moveTo(0, 22);
                ctx.lineTo(22, 37);
            } else {
                ctx.lineTo(-15 + legSwing, 60);
                ctx.moveTo(0, 22);
                ctx.lineTo(15 - legSwing, 60);
            }
            ctx.stroke();

            ctx.restore();

            this.drawHpBarUI();
        }

        drawHpBarUI() {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(20, 20, 304, 34);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(22, 22, 300 * (this.hp / this.maxHp), 30);
            ctx.fillStyle = 'white';
            ctx.font = '24px Inter';
            ctx.fillText(`HP: ${Math.ceil(this.hp)}`, 30, 46);
        }
    }

    // --- MOBS & ITEMS ---

    class Slime extends Entity {
        constructor(x, y, tier = 0) {
            // tier: 0 = normal (20 HP), 1 = medium (50 HP), 2 = large (100 HP), 3 = Boss (200 HP)
            const configs = [
                { r: 25, hp: 20, weight: 0.8 },
                { r: 40, hp: 50, weight: 1.4 },
                { r: 60, hp: 100, weight: 2.4 },
                { r: 90, hp: 200, weight: 3.6 }
            ];
            const cfg = configs[tier] || configs[0];
            const body = Bodies.circle(x, y, cfg.r, {
                restitution: 0.75, 
                friction: 0.1,
                density: 0.001 * cfg.weight
            });
            super(body, cfg.hp, 'slime', cfg.weight);
            this.tier = tier;
            this.radius = cfg.r;
            this.moveTimer = 0;
            this.dir = Math.random() > 0.5 ? 1 : -1;
            this.isBoss = tier === 3;
            this.enteringTimer = 0;
            this.hasSplit = false;
        }

        update() {
            const pos = this.body.position;

            // Mark entering complete once they reach visible arena bounds
            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 60 && pos.x <= 1380) {
                    this.isEntering = false;
                } else if (this.enteringTimer > 300) {
                    // Failsafe: if stuck off-screen for >5 seconds, force into arena or purge
                    if (pos.x < 60) Matter.Body.setPosition(this.body, { x: 80, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1380) Matter.Body.setPosition(this.body, { x: 1360, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                }
            }

            // Universal out-of-bounds check (falls into void or launched way out of map)
            if (pos.y > 1000 || pos.y < -400 || (!this.isEntering && (pos.x < -150 || pos.x > 1590))) {
                this.die();
                return;
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.5 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;

            // If slime is off the canvas viewport, force direction toward center of the screen
            if (pos.x < 60) this.dir = 1;
            else if (pos.x > 1380) this.dir = -1;

            this.moveTimer++;
            if (this.moveTimer > 60 && pos.x >= 60 && pos.x <= 1380) {
                this.dir = Math.random() > 0.5 ? 1 : -1;
                this.moveTimer = 0;
            }
            
            if (Math.random() < 0.03) {
                Body.applyForce(this.body, this.body.position, { x: 0, y: -0.06 * this.weight });
            }
            
            const speed = Math.max(1.8, 3.2 - this.tier * 0.4);
            Body.setVelocity(this.body, { x: this.dir * speed, y: this.body.velocity.y });
        }

        die() {
            if (!this.isDying) this.explode();
        }

        explode() {
            if (this.isDying || this.hasSplit) return;
            this.hasSplit = true;
            const pos = this.body.position;
            SoundFX.playExplosion(0.6 + this.tier * 0.3);
            createExplosion(pos.x, pos.y, '#32cd32', 30 + this.tier * 15);

            // Boss Splitting Logic
            if (this.tier > 0) {
                const nextTier = this.tier - 1;
                for (let i = 0; i < 2; i++) {
                    const offset = (i === 0 ? -1 : 1) * (this.radius * 0.5);
                    const spawnX = Math.max(80, Math.min(1360, pos.x + offset));
                    const child = new Slime(spawnX, Math.min(pos.y - 10, 800), nextTier);
                    child.isEntering = false;
                    Matter.Body.setVelocity(child.body, {
                        x: (i === 0 ? -4 : 4),
                        y: -8
                    });
                }
            }

            super.die();
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.fillStyle = this.isBoss ? 'rgba(74, 222, 128, 0.95)' : 'rgba(50, 205, 50, 0.85)'; 
            ctx.beginPath();
            const wobble = Math.sin(Date.now() / 100) * (2 + this.tier * 1.5);
            ctx.ellipse(0, 0, this.radius + wobble, this.radius * 0.8 - wobble, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = this.isBoss ? '#15803d' : '#228B22';
            ctx.lineWidth = 3 + this.tier;
            ctx.stroke();

            // Eyes
            const eyeSize = Math.max(3, 3 + this.tier * 2.5);
            const eyeSpacing = Math.max(8, 8 + this.tier * 6);
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(-eyeSpacing, -5, eyeSize, 0, Math.PI * 2);
            ctx.arc(eyeSpacing, -5, eyeSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-eyeSpacing - 3, -7, Math.max(2, eyeSize * 0.5), 0, Math.PI * 2);
            ctx.fill();

            // Boss Crown
            if (this.isBoss) {
                ctx.fillStyle = '#facc15';
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.beginPath();
                const cy = -this.radius * 0.85;
                ctx.moveTo(-25, cy);
                ctx.lineTo(-32, cy - 25);
                ctx.lineTo(-12, cy - 12);
                ctx.lineTo(0, cy - 30);
                ctx.lineTo(12, cy - 12);
                ctx.lineTo(32, cy - 25);
                ctx.lineTo(25, cy);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
            this.drawHpBar(ctx, this.radius + 15);
        }
    }

    class Zombie extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 40, 112, {
                inertia: Infinity,
                restitution: 0.5, 
                friction: 0.1,
                density: 0.002
            });
            super(body, 50, 'zombie', 1.5);
            this.animTimer = 0;
            this.facing = 1;
            this.enteringTimer = 0;
        }

        update() {
            const pos = this.body.position;

            // Mark entering complete once they reach visible arena bounds
            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 60 && pos.x <= 1380) {
                    this.isEntering = false;
                } else if (this.enteringTimer > 300) {
                    // Failsafe: if stuck off-screen for >5 seconds, force into arena or purge
                    if (pos.x < 60) Matter.Body.setPosition(this.body, { x: 80, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1380) Matter.Body.setPosition(this.body, { x: 1360, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                }
            }

            // Universal out-of-bounds check (falls into void or launched way out of map)
            if (pos.y > 1000 || pos.y < -400 || (!this.isEntering && (pos.x < -150 || pos.x > 1590))) {
                this.die();
                return;
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.5 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;

            if (!player || player.isDying) return;

            // March directly toward player or arena center
            const px = player.body.position.x;
            const dir = px > pos.x ? 1 : -1;
            this.facing = dir;
            
            Body.setVelocity(this.body, { x: dir * 2.2, y: this.body.velocity.y });
            this.animTimer += 0.1;
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.strokeStyle = '#2E8B57'; 
            ctx.fillStyle = '#8FBC8F';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Use persistent facing direction to prevent flickering from micro-jitter
            if (Math.abs(this.body.velocity.x) > 0.3) {
                this.facing = this.body.velocity.x > 0 ? 1 : -1;
            }
            const eyeDir = this.facing;

            ctx.beginPath();
            ctx.arc(15 * eyeDir, -37, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'red';
            ctx.fillRect(eyeDir * 18, -42, 4, 4);
            ctx.fillRect(eyeDir * 9, -42, 4, 4);

            ctx.beginPath();
            ctx.moveTo(15 * eyeDir, -19);
            ctx.lineTo(0, 22);
            ctx.stroke();

            let armSwing = Math.sin(this.animTimer) * 15;
            ctx.beginPath();
            ctx.moveTo(7 * eyeDir, -7);
            ctx.lineTo(22 * eyeDir + armSwing, 15);
            ctx.stroke();

            let legSwing = Math.sin(this.animTimer * 0.5) * 15; 
            ctx.beginPath();
            ctx.moveTo(0, 22);
            ctx.lineTo(-15 + legSwing, 52);
            ctx.moveTo(0, 22);
            ctx.lineTo(15 - legSwing, 55);
            ctx.stroke();

            ctx.restore();
            this.drawHpBar(ctx, 65);
        }
    }

    class Golem extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 75, 110, {
                inertia: Infinity,
                restitution: 0.2,
                friction: 0.3,
                density: 0.005
            });
            super(body, 120, 'golem', 3.2); // Heavy mass and 120 HP
            this.animTimer = 0;
            this.facing = 1;
            this.enteringTimer = 0;
            this.heldMob = null;
            this.throwCooldown = 150; // Ticks between throws
            this.windupTimer = 0;
            this.searchTimer = 0;
        }

        update() {
            const pos = this.body.position;

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 70 && pos.x <= 1370) {
                    this.isEntering = false;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 70) Matter.Body.setPosition(this.body, { x: 90, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1370) Matter.Body.setPosition(this.body, { x: 1350, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                }
            }

            if (pos.y > 1000 || pos.y < -400 || (!this.isEntering && (pos.x < -180 || pos.x > 1620))) {
                if (this.heldMob) this.heldMob = null;
                this.die();
                return;
            }

            const isAirborne = Math.abs(this.body.velocity.y) > 1.8 || (player && player.grabbedEntity === this);
            if (isAirborne) {
                if (this.heldMob) {
                    this.heldMob = null;
                    this.windupTimer = 0;
                }
                return;
            }

            if (!player || player.isDying) return;

            const px = player.body.position.x;
            const dir = px > pos.x ? 1 : -1;
            this.facing = dir;

            if (this.throwCooldown > 0) this.throwCooldown--;

            // If carrying a mob, position it overhead and aim at player
            if (this.heldMob) {
                if (this.heldMob.isDying || this.heldMob.markedForDeletion || (player && player.grabbedEntity === this.heldMob)) {
                    this.heldMob = null;
                    this.windupTimer = 0;
                } else {
                    Body.setPosition(this.heldMob.body, {
                        x: pos.x + this.facing * 15,
                        y: pos.y - 75
                    });
                    Body.setVelocity(this.heldMob.body, { x: 0, y: 0 });

                    this.windupTimer++;
                    // Wind up and throw!
                    if (this.windupTimer >= 50) {
                        const targetPos = player.body.position;
                        const throwAngle = Math.atan2(targetPos.y - (pos.y - 75), targetPos.x - pos.x);
                        const throwSpeed = 24;

                        Body.setVelocity(this.heldMob.body, {
                            x: Math.cos(throwAngle) * throwSpeed,
                            y: Math.sin(throwAngle) * throwSpeed - 4
                        });
                        this.heldMob.body.isThrown = true;
                        this.heldMob = null;
                        this.windupTimer = 0;
                        this.throwCooldown = 180; // Reset cooldown
                        SoundFX.playThrow();
                        shakeAmount = Math.max(shakeAmount, 10);
                    }
                }
            } else if (this.throwCooldown <= 0 && !this.isEntering) {
                // Throttle search to every 10 frames instead of every frame
                this.searchTimer = (this.searchTimer || 0) + 1;
                if (this.searchTimer % 10 === 0) {
                    for (let i = 0; i < entities.length; i++) {
                        const e = entities[i];
                        if (e !== this && 
                            !e.isDying && 
                            !e.markedForDeletion && 
                            (e.type === 'slime' || e.type === 'zombie' || e.type === 'box') &&
                            (!player || player.grabbedEntity !== e) &&
                            Math.hypot(e.body.position.x - pos.x, e.body.position.y - pos.y) < 130) {
                            this.heldMob = e;
                            this.windupTimer = 0;
                            break;
                        }
                    }
                }
            }

            // March toward Steve
            const speed = this.heldMob ? 1.0 : 1.6;
            Body.setVelocity(this.body, { x: dir * speed, y: this.body.velocity.y });
            this.animTimer += 0.08;
        }

        die(sourceBody = null) {
            if (this.heldMob) {
                this.heldMob = null;
            }
            super.die(sourceBody);
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);

            const dir = this.facing;
            const walkCycle = Math.sin(this.animTimer);

            // Golem colors
            const rockDark = '#475569';
            const rockMid = '#64748b';
            const rockHighlight = '#94a3b8';

            // Tiny stubby legs
            ctx.fillStyle = rockDark;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;

            // Left leg
            ctx.beginPath();
            ctx.roundRect(-24 + walkCycle * 6, 38, 18, 20, [4, 4, 8, 8]);
            ctx.fill();
            ctx.stroke();

            // Right leg
            ctx.beginPath();
            ctx.roundRect(8 - walkCycle * 6, 38, 18, 20, [4, 4, 8, 8]);
            ctx.fill();
            ctx.stroke();

            // Massive muscular torso
            ctx.fillStyle = rockMid;
            ctx.beginPath();
            ctx.moveTo(-36, 38);
            ctx.lineTo(-44, -15);
            ctx.lineTo(-32, -35);
            ctx.lineTo(32, -35);
            ctx.lineTo(44, -15);
            ctx.lineTo(36, 38);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Rock cracks & chest details
            ctx.strokeStyle = rockHighlight;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-15, -10);
            ctx.lineTo(0, -18);
            ctx.lineTo(12, -8);
            ctx.lineTo(8, 12);
            ctx.stroke();

            // Broad head sunken into shoulders
            ctx.fillStyle = rockDark;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-20 + dir * 5, -48, 38, 26, [8, 8, 4, 4]);
            ctx.fill();
            ctx.stroke();

            // Glowing amber/red eye slits
            ctx.fillStyle = '#f59e0b';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 10;
            ctx.fillRect(-10 + dir * 10, -41, 6, 4);
            ctx.fillRect(2 + dir * 10, -41, 6, 4);
            ctx.shadowBlur = 0;

            // Huge beefy muscular arms
            ctx.fillStyle = rockMid;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;

            if (this.heldMob) {
                // Arms hoisted straight overhead holding the victim
                ctx.beginPath();
                ctx.roundRect(-42, -65, 20, 48, 8);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.roundRect(22, -65, 20, 48, 8);
                ctx.fill();
                ctx.stroke();

                // Windup glowing tremor indicator
                if (this.windupTimer > 25) {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
                    ctx.beginPath();
                    ctx.arc(dir * 15, -75, 40 + Math.sin(Date.now() / 50) * 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                // Heavy resting/swinging beefy arms
                const armOffset = walkCycle * 10;

                // Back arm
                ctx.beginPath();
                ctx.roundRect(-46, -18 - armOffset, 20, 52, 10);
                ctx.fill();
                ctx.stroke();

                // Boulder fist
                ctx.fillStyle = rockDark;
                ctx.beginPath();
                ctx.arc(-36, 36 - armOffset, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                // Front arm
                ctx.fillStyle = rockMid;
                ctx.beginPath();
                ctx.roundRect(26, -18 + armOffset, 20, 52, 10);
                ctx.fill();
                ctx.stroke();

                // Front fist
                ctx.fillStyle = rockDark;
                ctx.beginPath();
                ctx.arc(36, 36 + armOffset, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
            this.drawHpBar(ctx, 65);
        }
    }

    class Box extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 60, 60, { density: 0.005 });
            super(body, 3, 'box', 2.0); 
        }
        
        die() {
            if (this.isDying) return;
            super.die();
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this.body.angle);
            
            ctx.fillStyle = '#D2B48C';
            ctx.fillRect(-30, -30, 60, 60);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 4;
            ctx.strokeRect(-30, -30, 60, 60);
            
            ctx.beginPath();
            ctx.moveTo(-30, -30);
            ctx.lineTo(30, 30);
            ctx.moveTo(30, -30);
            ctx.lineTo(-30, 30);
            ctx.stroke();

            ctx.restore();
        }
    }

    class Bomb extends Entity {
        constructor(x, y) {
            const body = Bodies.circle(x, y, 30, { density: 0.005, restitution: 0.5 });
            super(body, 1, 'bomb', 1.2);
            this.timer = 600; // 10 seconds at 60 FPS
        }

        takeDamage(amount, sourceBody = null) {
            // Only take fatal damage/detonate from external direct sources if it was thrusted or time is up
            if (this.isDying) return;
            if (this.body.isThrown || amount >= 1000) {
                this.explode();
            }
        }

        update() {
            this.timer--;
            if (this.timer <= 0) {
                this.explode();
            }
        }

        explode() {
            if (this.isDying) return;
            const pos = this.body.position;
            createExplosion(pos.x, pos.y, '#FF4500', 60);
            createExplosion(pos.x, pos.y, '#FFD700', 40);
            SoundFX.playExplosion(1.5);
            shakeAmount = 25; 

            const radius = 250;
            entities.forEach(e => {
                if (e !== this && !e.isDying) {
                    const dist = Vector.magnitude(Vector.sub(e.body.position, pos));
                    if (dist < radius) {
                        e.takeDamage(50, this.body);
                        const force = Vector.mult(Vector.normalise(Vector.sub(e.body.position, pos)), 0.2);
                        Body.applyForce(e.body, e.body.position, force);
                    }
                }
            });

            this.die();
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            this.isDying = true;
            this.markedForDeletion = true;
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this.body.angle);
            
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-12, -12, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#A9A9A9';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.quadraticCurveTo(15, -45, 30, -37);
            ctx.stroke();

            if (this.timer % 10 < 5) {
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.arc(30, -37, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class HealingHeart extends Entity {
        constructor(x, y) {
            const body = Bodies.circle(x, y, 22, {
                restitution: 0.4,
                frictionAir: 0.04,
                density: 0.001
            });
            super(body, 999999, 'heart', 0.5);
            this.canBeGrabbed = false; // Cannot be manipulated psychically
            this.rotAngle = 0;
            this.floatTimer = Math.random() * 100;
        }

        takeDamage(amount, sourceBody = null) {
            // Indestructible: immune to bomb blasts, flying crates, and collisions
            return;
        }

        update() {
            this.rotAngle += 0.05; // Spin around y-axis
            this.floatTimer += 0.04;
            // Gentle floating bob
            Body.applyForce(this.body, this.body.position, {
                x: 0,
                y: -0.0006 + Math.sin(this.floatTimer) * 0.0003
            });

            // Safeguard against falling below world floor
            const pos = this.body.position;
            if (pos.y > 900) {
                Body.setPosition(this.body, { x: pos.x, y: 880 });
                Body.setVelocity(this.body, { x: 0, y: 0 });
            }
        }

        collect(playerEntity) {
            if (this.markedForDeletion || this.isDying) return;
            this.markedForDeletion = true;
            this.isDying = true;
            
            // Restore 25 HP up to maximum
            playerEntity.hp = Math.min(playerEntity.maxHp, playerEntity.hp + 25);
            SoundFX.playHeal();
            
            // Heart pickup sparkle burst
            const pos = this.body.position;
            for (let i = 0; i < 28; i++) {
                particles.push(new Particle(pos.x, pos.y, '#f43f5e', 8, Math.random() * 4 + 2, 35));
                particles.push(new Particle(pos.x, pos.y, '#fda4af', 6, Math.random() * 3 + 1, 30));
            }
        }

        draw(ctx) {
            if (this.markedForDeletion) return;
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);

            // 3D Y-axis spinning transformation
            const scaleX = Math.cos(this.rotAngle);
            ctx.scale(scaleX, 1);

            // Pure red aura glow
            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 18;

            // Rounded, smooth heart path without a sharp point at the bottom
            ctx.beginPath();
            ctx.moveTo(0, 4);
            ctx.bezierCurveTo(0, -8, -23, -20, -23, 0);
            ctx.bezierCurveTo(-23, 14, -12, 21, 0, 24); // rounded bottom cup
            ctx.bezierCurveTo(12, 21, 23, 14, 23, 0);
            ctx.bezierCurveTo(23, -20, 0, -8, 0, 4);
            ctx.closePath();

            // Pure red fill
            ctx.fillStyle = '#ff0000';
            ctx.fill();

            // Clean bright red border
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ff3333';
            ctx.stroke();

            // Specular shine highlight
            if (Math.abs(scaleX) > 0.3) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(-8, -2, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    // --- GAME INITIALIZATION & MANAGEMENT ---

    let player;

    function initGame() {
        Composite.clear(engine.world);
        Engine.clear(engine);
        entities = [];
        particles = [];
        wave = 1;
        playerDeathFade = 0;
        mouse.isDown = false;
        document.getElementById('game-over-box').style.display = 'none';

        // Static Ground and Platforms
        // Panels 1 and 3 (the side elevated platforms) are extended all the way outward past the screen edges
        const ground = Bodies.rectangle(720, 930, 1440, 60, { isStatic: true, render: { fillStyle: '#32CD32' } });
        const plat1 = Bodies.rectangle(90, 650, 660, 30, { isStatic: true }); // Extended left panel (-240 to 420)
        const plat2 = Bodies.rectangle(720, 450, 400, 30, { isStatic: true }); // Center elevated platform
        const plat3 = Bodies.rectangle(1350, 650, 660, 30, { isStatic: true }); // Extended right panel (1020 to 1680)
        
        ground.isGround = true;
        plat1.isGround = true;
        plat2.isGround = true;
        plat3.isGround = true;

        // Static Boundaries
        const wallLeft = Bodies.rectangle(-260, 200, 100, 2400, { isStatic: true });
        const wallRight = Bodies.rectangle(1700, 200, 100, 2400, { isStatic: true });
        const ceiling = Bodies.rectangle(720, -200, 2400, 50, { isStatic: true });

        const localStaticBodies = [ground, plat1, plat2, plat3, wallLeft, wallRight, ceiling];
        Composite.add(engine.world, localStaticBodies);

        // Player instance
        player = new Player(720, 300);

        if (gameStarted) {
            spawnWave();
        }
    }

    // Structured 10-wave configuration
    const WAVE_CONFIGS = {
        1: { zombies: 3, slimes: 0, boxes: 1, bombs: 0 },
        2: { zombies: 3, slimes: 3, boxes: 1, bombs: 0 },
        3: { zombies: 5, slimes: 3, boxes: 2, bombs: 0 },
        4: { zombies: 0, slimes: 10, boxes: 1, bombs: 1 },
        5: { zombies: 10, slimes: 5, boxes: 3, bombs: 0 },
        6: { zombies: 10, slimes: 10, boxes: 2, bombs: 2 },
        7: { zombies: 12, slimes: 12, boxes: 3, bombs: 2 },
        8: { zombies: 12, slimes: 12, boxes: 2, bombs: 2 },
        9: { golem: 1, zombies: 10, slimes: 0, boxes: 1, bombs: 2 },
        10: { boss: true, zombies: 0, slimes: 0, boxes: 2, bombs: 2 }
    };

    function startGame() {
        SoundFX.init();
        SoundFX.startMusic();
        document.getElementById('title-screen').style.display = 'none';
        gameStarted = true;
        initGame();
    }

    function resetGame() {
        SoundFX.init();
        SoundFX.startMusic();
        document.getElementById('game-over-box').style.display = 'none';
        gameStarted = true;
        initGame();
    }

    function spawnWave() {
        waveTimer = 0;
        waveBannerTimer = WAVE_BANNER_DURATION;
        SoundFX.playWaveStart();

        // Structured configuration or fallback for undefined waves past Wave 10:
        // Exactly 24 total random mobs (random distribution of zombies and slimes)
        let config = WAVE_CONFIGS[wave];
        if (!config) {
            const randomZombies = Math.floor(Math.random() * 25); // 0 to 24 zombies
            const randomSlimes = 24 - randomZombies;             // remaining to reach 24
            config = {
                zombies: randomZombies,
                slimes: randomSlimes,
                boxes: 2,
                bombs: 2
            };
        }

        const spawnHeights = [
            { y: 840 }, // Ground level
            { y: 600 }, // Side platform level
            { y: 400 }  // Mid platform level
        ];

        // Boss spawn for Wave 10
        if (config.boss) {
            const boss = new Slime(720, 200, 3);
            boss.isEntering = false;
        }

        // Spawn Golem (e.g. Wave 9)
        for (let i = 0; i < (config.golem || 0); i++) {
            const fromLeft = Math.random() < 0.5;
            const x = fromLeft ? -50 : 1490;
            const golem = new Golem(x, 830);
            golem.isEntering = true;
            const dir = fromLeft ? 1 : -1;
            golem.dir = dir;
            golem.facing = dir;
            Matter.Body.setVelocity(golem.body, { x: dir * 1.5, y: -1 });
        }

        // Spawn Zombies
        for (let i = 0; i < (config.zombies || 0); i++) {
            const loc = spawnHeights[Math.floor(Math.random() * spawnHeights.length)];
            const fromLeft = Math.random() < 0.5;
            const x = fromLeft ? -45 : 1485;
            const mob = new Zombie(x, loc.y);
            mob.isEntering = true;
            const dir = fromLeft ? 1 : -1;
            mob.dir = dir;
            mob.facing = dir;
            Matter.Body.setVelocity(mob.body, { x: dir * 2.5, y: -1 });
        }

        // Spawn Slimes
        for (let i = 0; i < (config.slimes || 0); i++) {
            const loc = spawnHeights[Math.floor(Math.random() * spawnHeights.length)];
            const fromLeft = Math.random() < 0.5;
            const x = fromLeft ? -45 : 1485;
            const mob = new Slime(x, loc.y, 0);
            mob.isEntering = true;
            const dir = fromLeft ? 1 : -1;
            mob.dir = dir;
            Matter.Body.setVelocity(mob.body, { x: dir * 4, y: -1 });
        }

        // Spawn Boxes
        for (let i = 0; i < (config.boxes || 0); i++) {
            const x = 200 + Math.random() * 1040;
            new Box(x, -80 - i * 60);
        }

        // Spawn Bombs
        for (let i = 0; i < (config.bombs || 0); i++) {
            const x = 250 + Math.random() * 940;
            new Bomb(x, -120 - i * 80);
        }
    }

    // --- INPUT HANDLING ---

    window.addEventListener('keydown', e => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = true;
    });
    window.addEventListener('keyup', e => {
        if (keys.hasOwnProperty(e.key)) keys[e.key] = false;
    });
    
    function updateMousePos(e) {
        const rect = canvas.getBoundingClientRect();
        const scaleX = canvas.width / rect.width;
        const scaleY = canvas.height / rect.height;
        mouse.x = (e.clientX - rect.left) * scaleX;
        mouse.y = (e.clientY - rect.top) * scaleY;
    }

    canvas.addEventListener('mousemove', updateMousePos);

    canvas.addEventListener('mousedown', (e) => {
        if (e.button === 0) { // Left click
            SoundFX.init();
            updateMousePos(e);
            mouse.isDown = true;
            SoundFX.startPsychicHum();
        }
    });

    // Window-level mouseup/blur ensures releasing outside the canvas cleanly stops psychic power
    window.addEventListener('mouseup', (e) => {
        if (e.button === 0) {
            mouse.isDown = false;
            SoundFX.stopPsychicHum();
            if (player) {
                player.releaseGrip(true);
            }
        }
    });

    window.addEventListener('blur', () => {
        mouse.isDown = false;
        SoundFX.stopPsychicHum();
        if (player) {
            player.releaseGrip(true);
        }
    });

    // --- UNIFIED TOUCH & ON-SCREEN CONTROLS HANDLERS ---

    function handleTouchStart(e) {
        e.preventDefault();
        SoundFX.init();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const pos = getCanvasCoords(touch.clientX, touch.clientY);

            // 1. Check Movement D-Pad buttons
            let hitDpad = false;
            for (let btn of onScreenButtons) {
                const dist = Math.hypot(pos.x - btn.x, pos.y - btn.y);
                if (dist <= btn.r + 15) {
                    btn.active = true;
                    keys[btn.key] = true;
                    activeTouches.set(touch.identifier, { type: 'button', id: btn.id, key: btn.key });
                    hitDpad = true;
                    break;
                }
            }
            if (hitDpad) continue;

            // 2. Check Psychic Joystick (Mobile only)
            if (isMobileDevice) {
                const distJoy = Math.hypot(pos.x - psychicJoystick.baseX, pos.y - psychicJoystick.baseY);
                if (distJoy <= psychicJoystick.baseRadius + 40 && psychicJoystick.touchId === null) {
                    psychicJoystick.touchId = touch.identifier;
                    psychicJoystick.active = true;
                    updatePsychicJoystick(pos.x, pos.y);
                    activeTouches.set(touch.identifier, { type: 'joystick' });
                    SoundFX.startPsychicHum();
                    continue;
                }
            }

            // 3. Fallback direct psychic targeting on desktop/hybrid
            if (!isMobileDevice && activePsychicTouchId === null) {
                activePsychicTouchId = touch.identifier;
                mouse.x = pos.x;
                mouse.y = pos.y;
                mouse.isDown = true;
                SoundFX.startPsychicHum();
