<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychic Steve</title>
    <!-- Tailwind for overlay styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js for 2D Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        canvas {
            background-color: #87CEEB; /* Sky blue */
            box-shadow: 0 0 35px rgba(0,0,0,0.7);
            max-width: 100%;
            max-height: 100%;
            cursor: crosshair;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
        }
        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 24, 39, 0.88);
            color: white;
            padding: 2.75rem 3.75rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            border: 2px solid #a855f7;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.5);
            display: none;
        }
        #title-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 15, 29, 0.65);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
        }
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(168, 85, 247, 0.65), 0 0 55px rgba(192, 38, 211, 0.4);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 0 45px rgba(168, 85, 247, 0.95), 0 0 85px rgba(192, 38, 211, 0.65);
            }
        }
        .play-btn {
            background: linear-gradient(135deg, #9333ea, #c026d3);
            color: white;
            border: 3px solid rgba(243, 232, 255, 0.9);
            padding: 1.2rem 4.5rem;
            font-size: 2.3rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            border-radius: 9999px;
            cursor: pointer;
            margin-top: 1.5rem;
            transition: transform 0.2s ease, filter 0.2s ease;
            animation: pulseGlow 2.2s infinite ease-in-out;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }
        .play-btn:hover {
            transform: scale(1.12) !important;
            filter: brightness(1.2);
            animation-play-state: paused;
            box-shadow: 0 0 60px rgba(216, 180, 254, 1), 0 0 95px rgba(192, 38, 211, 0.9);
        }
        .play-btn:active {
            transform: scale(1.02) !important;
        }
        .restart-btn {
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 0.85rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .restart-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="1440" height="960"></canvas>
    
    <div id="ui-layer">
        <!-- Title Screen -->
        <div id="title-screen">
            <h1 class="text-7xl font-extrabold tracking-wider text-purple-400 drop-shadow-[0_0_30px_rgba(160,32,240,0.9)] mb-3">PSYCHIC STEVE</h1>
            <p class="text-xl text-purple-200 mb-2 font-medium">A / D or Arrows to Move • W or Up to Jump</p>
            <p class="text-sm text-purple-300 mb-6 tracking-wide">HOLD Left Mouse or use Touch Controls to channel psychic waves & fling targets • Release to throw</p>
            <button class="play-btn" onclick="startGame()">PLAY</button>
        </div>

        <!-- Game Over Screen -->
        <div id="game-over-box" class="message-box">
            <h1 class="text-4xl font-extrabold text-red-500 mb-2 drop-shadow-md">YOU DIED</h1>
            <p id="wave-reached" class="text-xl mb-4 text-purple-200"></p>
            <button class="restart-btn" onclick="resetGame()">Play Again</button>
        </div>
    </div>
</div>

<script>
    // --- SYNTHESIZED SOUND EFFECTS & INTENSE MUSIC (Web Audio API) ---
    const SoundFX = {
        ctx: null,
        bgmInterval: null,
        bgmStep: 0,
        isBgmPlaying: false,
        noiseBuf: null,

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            if (this.ctx && !this.noiseBuf) {
                const sampleRate = this.ctx.sampleRate;
                const length = Math.floor(sampleRate * 0.15);
                this.noiseBuf = this.ctx.createBuffer(1, length, sampleRate);
                const data = this.noiseBuf.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-4 * (i / length));
                }
            }
        },

        startMusic() {
            if (!this.ctx || this.isBgmPlaying) return;
            this.isBgmPlaying = true;
            this.bgmStep = 0;

            const stepDuration = 60 / 138 / 4; 

            const bassline64 = [
                73.42, 73.42, 146.83, 73.42,  82.41, 73.42, 146.83, 73.42,
                73.42, 73.42, 146.83, 73.42,  87.31, 73.42, 110.00, 73.42,
                58.27, 58.27, 116.54, 58.27,  65.41, 58.27, 116.54, 58.27,
                58.27, 58.27, 116.54, 58.27,  77.78, 58.27, 116.54, 65.41,
                49.00, 49.00, 98.00,  49.00,  58.27, 49.00, 98.00,  49.00,
                49.00, 49.00, 98.00,  49.00,  65.41, 49.00, 87.31, 110.00,
                55.00, 55.00, 110.00, 55.00,  69.30, 55.00, 110.00, 55.00,
                55.00, 55.00, 110.00, 73.42,  82.41, 87.31, 110.00, 130.81
            ];

            const leadNotes64 = [
                293.66, 0, 293.66, 349.23, 0, 440.00, 0, 392.00,
                349.23, 0, 293.66, 0,      261.63, 0, 293.66, 0,
                466.16, 0, 466.16, 523.25, 0, 587.33, 0, 523.25,
                466.16, 0, 440.00, 0,      392.00, 0, 440.00, 0,
                392.00, 0, 349.23, 392.00, 0, 440.00, 0, 466.16,
                523.25, 0, 466.16, 440.00, 0, 392.00, 349.23, 0,
                440.00, 0, 440.00, 523.25, 0, 554.37, 0, 587.33,
                659.25, 0, 587.33, 554.37, 0, 440.00, 523.25, 0
            ];

            const chordPadProgression = [220.00, 174.61, 196.00, 220.00];

            this.bgmInterval = setInterval(() => {
                if (!this.ctx || !this.isBgmPlaying) return;
                const now = this.ctx.currentTime;
                const step = this.bgmStep % 64;
                const bar = Math.floor(step / 16);

                const isKick = (step % 4 === 0) || (step % 16 === 14 && bar % 2 === 1);
                if (isKick) {
                    const kickOsc = this.ctx.createOscillator();
                    const kickGain = this.ctx.createGain();
                    kickOsc.type = 'sine';
                    kickOsc.frequency.setValueAtTime(145, now);
                    kickOsc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                    kickGain.gain.setValueAtTime(0.16, now);
                    kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    kickOsc.connect(kickGain);
                    kickGain.connect(this.ctx.destination);
                    kickOsc.start(now);
                    kickOsc.stop(now + 0.15);
                }

                if (this.noiseBuf) {
                    const hatNoise = this.ctx.createBufferSource();
                    hatNoise.buffer = this.noiseBuf;

                    const isSnare = (step % 8 === 4);
                    const hatFilter = this.ctx.createBiquadFilter();
                    hatFilter.type = isSnare ? 'bandpass' : 'highpass';
                    hatFilter.frequency.setValueAtTime(isSnare ? 1600 : 7500, now);

                    const hatGain = this.ctx.createGain();
                    const hatVol = isSnare ? 0.09 : (step % 2 === 0 ? 0.035 : 0.015);
                    hatGain.gain.setValueAtTime(hatVol, now);
                    hatGain.gain.exponentialRampToValueAtTime(0.001, now + (isSnare ? 0.08 : 0.04));

                    hatNoise.connect(hatFilter);
                    hatFilter.connect(hatGain);
                    hatGain.connect(this.ctx.destination);
                    hatNoise.start(now);
                }

                const bassFreq = bassline64[step];
                if (bassFreq) {
                    const bassOsc = this.ctx.createOscillator();
                    const bassGain = this.ctx.createGain();
                    const bassFilter = this.ctx.createBiquadFilter();

                    bassOsc.type = 'sawtooth';
                    bassOsc.frequency.setValueAtTime(bassFreq, now);

                    bassFilter.type = 'lowpass';
                    bassFilter.frequency.setValueAtTime(320, now);
                    bassFilter.frequency.exponentialRampToValueAtTime(100, now + 0.10);

                    bassGain.gain.setValueAtTime(0.08, now);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

                    bassOsc.connect(bassFilter);
                    bassFilter.connect(bassGain);
                    bassGain.connect(this.ctx.destination);

                    bassOsc.start(now);
                    bassOsc.stop(now + 0.11);
                }

                if (step % 8 === 0) {
                    const padFreq = chordPadProgression[bar];
                    const padOsc = this.ctx.createOscillator();
                    const padGain = this.ctx.createGain();
                    const padFilter = this.ctx.createBiquadFilter();

                    padOsc.type = 'triangle';
                    padOsc.frequency.setValueAtTime(padFreq, now);

                    padFilter.type = 'lowpass';
                    padFilter.frequency.setValueAtTime(450, now);

                    padGain.gain.setValueAtTime(0.03, now);
                    padGain.gain.linearRampToValueAtTime(0.02, now + 0.35);
                    padGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                    padOsc.connect(padFilter);
                    padFilter.connect(padGain);
                    padGain.connect(this.ctx.destination);

                    padOsc.start(now);
                    padOsc.stop(now + 0.7);
                }

                const leadFreq = leadNotes64[step];
                if (leadFreq > 0) {
                    const leadOsc = this.ctx.createOscillator();
                    const leadGain = this.ctx.createGain();
                    const leadFilter = this.ctx.createBiquadFilter();

                    leadOsc.type = 'square';
                    leadOsc.frequency.setValueAtTime(leadFreq, now);

                    leadFilter.type = 'lowpass';
                    leadFilter.frequency.setValueAtTime(2200, now);
                    leadFilter.frequency.exponentialRampToValueAtTime(750, now + 0.14);

                    leadGain.gain.setValueAtTime(0.04, now);
                    leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                    leadOsc.connect(leadFilter);
                    leadFilter.connect(leadGain);
                    leadGain.connect(this.ctx.destination);

                    leadOsc.start(now);
                    leadOsc.stop(now + 0.15);
                }

                this.bgmStep++;
            }, stepDuration * 1000);
        },

        stopMusic() {
            if (this.bgmInterval) {
                clearInterval(this.bgmInterval);
                this.bgmInterval = null;
            }
            this.isBgmPlaying = false;
        },

        playJump() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(380, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        },

        playHeal() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                gain.gain.setValueAtTime(0.18, now + idx * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + idx * 0.05);
                osc.stop(now + idx * 0.05 + 0.22);
            });
        },

        playChomp() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.14);
            gain.gain.setValueAtTime(0.42, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        },

        playExplosion(intensity = 1.0) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const dur = 0.45 * intensity;
            const bufSize = this.ctx.sampleRate * dur;
            const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * (i / bufSize));
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + dur);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.4 * intensity, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(now);
        },

        playPlayerHurt() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            
            const subOsc = this.ctx.createOscillator();
            const subGain = this.ctx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(130, now);
            subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.22);
            subGain.gain.setValueAtTime(0.55, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            subOsc.connect(subGain);
            subGain.connect(this.ctx.destination);
            subOsc.start(now);
            subOsc.stop(now + 0.24);

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 0.16);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
        },

        playHit() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(28, now + 0.13);
            gain.gain.setValueAtTime(0.48, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

            const crunch = this.ctx.createOscillator();
            const crunchGain = this.ctx.createGain();
            crunch.type = 'sawtooth';
            crunch.frequency.setValueAtTime(75, now);
            crunch.frequency.exponentialRampToValueAtTime(20, now + 0.08);
            crunchGain.gain.setValueAtTime(0.35, now);
            crunchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            crunch.connect(crunchGain);
            crunchGain.connect(this.ctx.destination);

            osc.start(now);
            crunch.start(now);
            osc.stop(now + 0.14);
            crunch.stop(now + 0.09);
        },

        playThrow() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, now);
            osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
        },

        playWaveStart() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            
            const lowFreqs = [58.27, 82.41, 116.54];
            lowFreqs.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.92, now + 0.7);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(320, now);
                filter.frequency.exponentialRampToValueAtTime(90, now + 0.7);

                gain.gain.setValueAtTime(0.32 / (idx + 1), now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.75);
            });

            const impactOsc = this.ctx.createOscillator();
            const impactGain = this.ctx.createGain();
            impactOsc.type = 'triangle';
            impactOsc.frequency.setValueAtTime(95, now);
            impactOsc.frequency.exponentialRampToValueAtTime(24, now + 0.45);
            impactGain.gain.setValueAtTime(0.45, now);
            impactGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            impactOsc.connect(impactGain);
            impactGain.connect(this.ctx.destination);
            impactOsc.start(now);
            impactOsc.stop(now + 0.5);
        },

        startPsychicHum() {},
        stopPsychicHum() {}
    };

    // --- MATTER.JS ALIASES ---
    const Engine = Matter.Engine,
          Render = Matter.Render,
          Runner = Matter.Runner,
          Bodies = Matter.Bodies,
          Body = Matter.Body,
          Composite = Matter.Composite,
          Events = Matter.Events,
          Vector = Matter.Vector,
          Query = Matter.Query;

    // --- GLOBALS & CONFIG ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    
    const engine = Engine.create();
    engine.gravity.y = 2.0;

    let isLooping = true;
    let gameStarted = false;
    let playerDeathFade = 0;
    let wave = 1;
    let waveTimer = 0;
    let waveBannerTimer = 0;
    const WAVE_BANNER_DURATION = 150;
    let entities = [];
    let particles = [];
    let shakeAmount = 0;
    let livingEnemiesCount = 0;

    // Strict Mouse State
    const mouse = { x: 0, y: 0, isDown: false };
    
    // Key Tracking
    const keys = { w: false, a: false, d: false, ArrowUp: false, ArrowLeft: false, ArrowRight: false };

    // --- DUAL-ZONE FLOATING VIRTUAL STICKS CONFIG ---
    let isMobileDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0) || window.matchMedia('(pointer: coarse)').matches;

    // Movement Floating Stick (Left Screen Half)
    const moveStick = {
        touchId: null,
        active: false,
        baseX: 200,
        baseY: 780,
        stickX: 200,
        stickY: 780,
        baseRadius: 105,
        handleRadius: 52,
        deadzone: 16
    };

    // Psychic Floating Stick (Right Screen Half)
    const psychicStick = {
        touchId: null,
        active: false,
        baseX: 1240,
        baseY: 780,
        stickX: 1240,
        stickY: 780,
        baseRadius: 120,
        handleRadius: 56,
        angle: 0,
        distanceRatio: 0
    };

    function getCanvasCoords(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        return {
            x: (clientX - rect.left) * (canvas.width / rect.width),
            y: (clientY - rect.top) * (canvas.height / rect.height)
        };
    }

    // --- HELPER CLASSES ---

    class Particle {
        constructor(x, y, color, speed, size, life) {
            this.x = x;
            this.y = y;
            this.vx = (Math.random() - 0.5) * speed;
            this.vy = (Math.random() - 0.5) * speed;
            this.color = color;
            this.size = size;
            this.life = life;
            this.maxLife = life;
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            this.life--;
        }
        draw(ctx) {
            ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
            ctx.fillStyle = this.color;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.fill();
            ctx.globalAlpha = 1.0;
        }
    }

    function createExplosion(x, y, color, count) {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color, 16, Math.random() * 5 + 2, 25 + Math.random() * 25));
        }
    }

    // --- BASE ENTITY ---

    class Entity {
        constructor(body, hp, type, weight = 1.0) {
            this.body = body;
            this.hp = hp;
            this.maxHp = hp;
            this.type = type;
            this.weight = weight;
            this.body.entity = this; 
            this.markedForDeletion = false;
            this.isDying = false;
            this.canBeGrabbed = true;
            this.isEntering = false;
            this.spawnGraceTimer = 0;
            Composite.add(engine.world, this.body);
            entities.push(this);
        }

        takeDamage(amount, sourceBody = null) {
            if (this.hp <= 0 || this.isDying) return;
            this.spawnGraceTimer = 0;
            this.isEntering = false;
            this.hp -= amount;

            if (this.type === 'slime' || this.type === 'zombie' || this.type === 'golem' || this.type === 'maw') {
                SoundFX.playHit();
                shakeAmount = Math.max(shakeAmount, Math.min(18, 6 + amount * 0.35));

                if (sourceBody) {
                    const sourcePos = sourceBody.position || sourceBody;
                    let dx = this.body.position.x - sourcePos.x;
                    let dy = this.body.position.y - sourcePos.y;
                    const len = Math.hypot(dx, dy) || 1;
                    
                    const nx = dx / len;
                    const impulseX = nx * (7 + Math.min(amount * 0.4, 12));
                    const impulseY = -Math.max(6, Math.min(16, 5 + amount * 0.5));
                    
                    Matter.Body.setVelocity(this.body, {
                        x: impulseX,
                        y: impulseY
                    });
                }
            }

            if (this.hp <= 0) {
                this.hp = 0;
                this.die(sourceBody);
            }
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            this.isDying = true;
            this.markedForDeletion = true;
            
            shakeAmount = 16;
            
            let expColor = '#ffffff';
            if (this.type === 'slime') expColor = '#32cd32';
            else if (this.type === 'zombie') expColor = '#2E8B57';
            else if (this.type === 'golem') expColor = '#708090';
            else if (this.type === 'maw') expColor = '#6b21a8';
            else if (this.type === 'box') expColor = '#8B4513';
            else if (this.type === 'player') expColor = '#ff2222';
            else if (this.type === 'bomb') expColor = '#FF4500';
            
            createExplosion(this.body.position.x, this.body.position.y, expColor, 40);
        }

        update() {}
        draw(ctx) {}

        drawHpBar(ctx, yOffset) {
            if (this.hp >= this.maxHp || this.hp <= 0 || this.isDying) return;
            const width = 60;
            const height = 8;
            const x = this.body.position.x - width / 2;
            const y = this.body.position.y - yOffset;
            
            ctx.fillStyle = 'red';
            ctx.fillRect(x, y, width, height);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, width * (this.hp / this.maxHp), height);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, y, width, height);
        }
    }

    // --- PLAYER ENTITY ---

    class Player extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 45, 120, { 
                inertia: Infinity, 
                friction: 0.1,
                restitution: 0,
                density: 0.002
            });
            super(body, 100, 'player');
            this.animTimer = 0;
            this.canJump = false;
            this.grabbedEntity = null;
            this.invulnerableTimer = 0;
            this.grabTimer = 0;
            this.maxGrabDuration = 120;
        }

        takeDamage(amount, sourceBody = null) {
            if (this.invulnerableTimer > 0 && amount < 1000) return;
            
            super.takeDamage(amount, sourceBody);
            if (!this.isDying) {
                SoundFX.playPlayerHurt();
                this.invulnerableTimer = 55;
                shakeAmount = Math.max(shakeAmount, Math.min(28, 12 + amount * 0.5));
            }
        }

        releaseGrip(impartBoost = false) {
            if (this.grabbedEntity && !this.grabbedEntity.markedForDeletion) {
                const b = this.grabbedEntity.body;
                if (impartBoost) {
                    Body.setVelocity(b, { x: b.velocity.x * 1.5, y: b.velocity.y * 1.5 });
                    SoundFX.playThrow();
                }
            }
            this.grabbedEntity = null;
            this.grabTimer = 0;
            SoundFX.stopPsychicHum();
        }

        update() {
            if (this.invulnerableTimer > 0) {
                this.invulnerableTimer--;
            }

            if (this.isDying) return;

            // Heal over time: gradually recover 1 HP every ~1.5 seconds (90 ticks) up to 100 max HP
            this.healTimer = (this.healTimer || 0) + 1;
            if (this.healTimer >= 90) {
                this.healTimer = 0;
                if (this.hp < this.maxHp) {
                    this.hp = Math.min(this.maxHp, this.hp + 1);
                }
            }

            const moveSpeed = 8;
            const jumpVelocityY = -23; 
            
            let vx = this.body.velocity.x;
            let vy = this.body.velocity.y;

            if (keys.a || keys.ArrowLeft) {
                vx = -moveSpeed;
                this.animTimer += 0.2;
            } else if (keys.d || keys.ArrowRight) {
                vx = moveSpeed;
                this.animTimer += 0.2;
            } else {
                vx *= 0.5; 
                this.animTimer = 0;
            }

            if ((keys.w || keys.ArrowUp) && this.canJump) {
                vy = jumpVelocityY;
                this.canJump = false;
                SoundFX.playJump();
            }

            // Accelerated natural downward fall gravity
            if (!this.canJump && vy > 0) {
                vy += 0.65;
            }

            // ONLY slow fall when the mouse is physically held down
            if (mouse.isDown && vy > 1.8) {
                vy = 1.8;
            }

            // Clamp maximum upward velocity
            if (vy < -26) {
                vy = -26;
            }

            Body.setVelocity(this.body, { x: vx, y: vy });

            // Keep Steve strictly inside the visible screen boundaries
            const minX = 25;
            const maxX = 1415;
            let currentX = this.body.position.x;
            let currentY = this.body.position.y;
            let clamped = false;

            if (currentX < minX) {
                currentX = minX;
                if (this.body.velocity.x < 0) Body.setVelocity(this.body, { x: 0, y: this.body.velocity.y });
                clamped = true;
            } else if (currentX > maxX) {
                currentX = maxX;
                if (this.body.velocity.x > 0) Body.setVelocity(this.body, { x: 0, y: this.body.velocity.y });
                clamped = true;
            }

            // Floor safeguard against falling below the ground
            if (currentY > 840) {
                currentY = 840;
                if (this.body.velocity.y > 0) Body.setVelocity(this.body, { x: this.body.velocity.x, y: 0 });
                this.canJump = true;
                clamped = true;
            }

            if (clamped) {
                Body.setPosition(this.body, { x: currentX, y: currentY });
            }

            // Psychic interaction logic with intelligent auto-locking
            const maxGrabRadius = 450;
            if (mouse.isDown) {
                if (!this.grabbedEntity) {
                    let bestCandidate = null;
                    let bestScore = -Infinity;

                    const aimVec = { x: mouse.x - this.body.position.x, y: mouse.y - this.body.position.y };
                    const aimDist = Math.hypot(aimVec.x, aimVec.y) || 1;
                    const aimNorm = { x: aimVec.x / aimDist, y: aimVec.y / aimDist };

                    for (let i = 0; i < entities.length; i++) {
                        const ent = entities[i];
                        if (ent === this || ent.isDying || ent.markedForDeletion || ent.canBeGrabbed === false) continue;

                        const b = ent.body;
                        const toEnt = { x: b.position.x - this.body.position.x, y: b.position.y - this.body.position.y };
                        const distToSteve = Math.hypot(toEnt.x, toEnt.y);

                        if (distToSteve > maxGrabRadius) continue;

                        // Dot product along Steve's aiming ray
                        const projAlongAim = toEnt.x * aimNorm.x + toEnt.y * aimNorm.y;

                        // Lateral perpendicular distance from Steve's psychic ray
                        const perpDist = Math.abs(toEnt.x * (-aimNorm.y) + toEnt.y * aimNorm.x);

                        // Distance directly from current mouse/reticle position
                        const distToCursor = Math.hypot(b.position.x - mouse.x, b.position.y - mouse.y);

                        // If user aims roughly in the direction (projAlongAim > 0), prioritize targets even if they overshoot
                        let score = 0;
                        if (projAlongAim > 10 && perpDist < 140) {
                            score = 1000 - perpDist * 3.5 - Math.abs(distToSteve - Math.min(aimDist, maxGrabRadius)) * 0.8;
                        } else if (distToCursor < 120) {
                            score = 800 - distToCursor * 3.5;
                        }

                        if (score > bestScore && score > 200) {
                            bestScore = score;
                            bestCandidate = ent;
                        }
                    }

                    if (bestCandidate) {
                        this.grabbedEntity = bestCandidate;
                        this.grabbedEntity.body.isThrown = true;
                        this.grabbedEntity.isEntering = false;
                        this.grabbedEntity.spawnGraceTimer = 0;
                        if (this.grabbedEntity.type === 'bomb') {
                            this.grabbedEntity.flungByPlayer = true;
                        }
                        const w = this.grabbedEntity.weight || 1.0;
                        this.grabTimer = Math.max(30, Math.round(this.maxGrabDuration / Math.sqrt(w)));
                    }
                }

                if (this.grabbedEntity) {
                    if (this.grabbedEntity.isDying || this.grabbedEntity.markedForDeletion) {
                        this.grabbedEntity = null;
                        this.grabTimer = 0;
                    } else {
                        const b = this.grabbedEntity.body;
                        const distFromSteve = Vector.magnitude(Vector.sub(b.position, this.body.position));

                        if (distFromSteve > maxGrabRadius) {
                            this.releaseGrip(true);
                            return;
                        }

                        this.grabTimer--;
                        if (this.grabTimer <= 0) {
                            this.grabbedEntity.canBeGrabbed = false;
                            this.releaseGrip(false);
                            return;
                        }

                        const target = { x: mouse.x, y: mouse.y };
                        const mouseDistFromSteve = Vector.magnitude(Vector.sub(target, this.body.position));

                        if (mouseDistFromSteve > maxGrabRadius) {
                            const angle = Math.atan2(target.y - this.body.position.y, target.x - this.body.position.x);
                            target.x = this.body.position.x + Math.cos(angle) * maxGrabRadius;
                            target.y = this.body.position.y + Math.sin(angle) * maxGrabRadius;
                        }

                        const force = Vector.sub(target, b.position);
                        const weightFactor = Math.max(0.25, 1.4 / Math.sqrt(this.grabbedEntity.weight || 1));
                        Body.setVelocity(b, {
                            x: Math.max(-25, Math.min(25, force.x * 0.28 * weightFactor)),
                            y: Math.max(-25, Math.min(25, force.y * 0.28 * weightFactor))
                        });
                        b.isThrown = true;
                    }
                }
            } else if (this.grabbedEntity) {
                this.releaseGrip(true);
            }
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            this.isDying = true;
            this.markedForDeletion = true;
            
            shakeAmount = 30;
            SoundFX.stopMusic();
            SoundFX.playExplosion(1.4);
            createExplosion(this.body.position.x, this.body.position.y, '#ff2222', 45);
            createExplosion(this.body.position.x, this.body.position.y, '#ffa500', 35);
            createExplosion(this.body.position.x, this.body.position.y, '#111111', 25);
            createExplosion(this.body.position.x, this.body.position.y, '#a020f0', 20);

            this.releaseGrip(false);
        }

        draw(ctx) {
            if (this.markedForDeletion) return;
            
            if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 4) % 2 === 0) {
                this.drawHpBarUI();
                return;
            }

            const pos = this.body.position;
            const maxGrabRadius = 450;

            if (mouse.isDown) {
                ctx.save();

                let targetX, targetY;
                let isConnected = false;

                if (this.grabbedEntity && !this.grabbedEntity.markedForDeletion) {
                    targetX = this.grabbedEntity.body.position.x;
                    targetY = this.grabbedEntity.body.position.y;
                    isConnected = true;
                } else {
                    const dx = mouse.x - pos.x;
                    const dy = mouse.y - pos.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > maxGrabRadius) {
                        const angle = Math.atan2(dy, dx);
                        targetX = pos.x + Math.cos(angle) * maxGrabRadius;
                        targetY = pos.y + Math.sin(angle) * maxGrabRadius;
                    } else {
                        targetX = mouse.x;
                        targetY = mouse.y;
                    }
                }

                ctx.shadowColor = '#d946ef';
                ctx.shadowBlur = isConnected ? 24 : 14;

                const beamCount = isConnected ? 4 : 3;
                for (let w = 0; w < beamCount; w++) {
                    ctx.strokeStyle = w === 0 ? 'rgba(255, 255, 255, 0.9)' : (isConnected ? '#a020f0' : 'rgba(160, 32, 240, 0.7)');
                    ctx.lineWidth = w === 0 ? 2.5 : (isConnected ? 4 : 3);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y - 15);

                    const jitter = isConnected ? 60 : 35;
                    const cp1x = pos.x + (targetX - pos.x) / 3 + (Math.random() - 0.5) * jitter;
                    const cp1y = (pos.y - 15) + (targetY - (pos.y - 15)) / 3 + (Math.random() - 0.5) * jitter;
                    const cp2x = pos.x + 2 * (targetX - pos.x) / 3 + (Math.random() - 0.5) * jitter;
                    const cp2y = (pos.y - 15) + 2 * (targetY - (pos.y - 15)) / 3 + (Math.random() - 0.5) * jitter;

                    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, targetX, targetY);
                    ctx.stroke();
                }

                if (isConnected) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2.5;
                    ctx.strokeRect(targetX - 32, targetY - 32, 64, 64);

                    const pulse = (Date.now() % 1000) / 1000 * 20;
                    ctx.strokeStyle = 'rgba(217, 70, 239, 0.65)';
                    ctx.strokeRect(targetX - 32 - pulse, targetY - 32 - pulse, 64 + pulse * 2, 64 + pulse * 2);

                    // Diamond auto-lock indicator
                    ctx.save();
                    ctx.translate(targetX, targetY);
                    ctx.rotate((Date.now() % 2400) / 2400 * Math.PI * 2);
                    ctx.strokeStyle = '#f0abfc';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-24, -24, 48, 48);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#a020f0';
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 6 + Math.sin(Date.now() / 80) * 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 14, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            // Draw Stick Figure
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Head
            ctx.beginPath();
            ctx.arc(0, -45, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.stroke();

            // Eyes (2 eyes tracking mouse or direction)
            let eyeLookX = 0;
            let eyeLookY = 0;
            if (mouse.isDown) {
                const angle = Math.atan2(mouse.y - pos.y, mouse.x - pos.x);
                eyeLookX = Math.cos(angle) * 3;
                eyeLookY = Math.sin(angle) * 3;
            } else if (Math.abs(this.body.velocity.x) > 0.5) {
                eyeLookX = (this.body.velocity.x > 0 ? 1 : -1) * 3;
            }

            // Pupils
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-6 + eyeLookX, -46 + eyeLookY, 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6 + eyeLookX, -46 + eyeLookY, 2.8, 0, Math.PI * 2);
            ctx.fill();

            // Torso
            ctx.beginPath();
            ctx.moveTo(0, -27);
            ctx.lineTo(0, 22);
            ctx.stroke();

            let armSwing = Math.sin(this.animTimer) * 22;
            let legSwing = Math.cos(this.animTimer) * 22;

            // Arms: only point towards cursor when psychic power is physically held
            ctx.beginPath();
            ctx.moveTo(0, -15); 
            if (mouse.isDown) {
                const angle = Math.atan2(mouse.y - pos.y, mouse.x - pos.x);
                ctx.lineTo(Math.cos(angle) * 37, Math.sin(angle) * 37);
            } else {
                ctx.lineTo(-22 + armSwing, 7);
                ctx.moveTo(0, -15);
                ctx.lineTo(22 - armSwing, 7);
            }
            ctx.stroke();

            // Legs
            ctx.beginPath();
            ctx.moveTo(0, 22); 
            if (!this.canJump) { 
                ctx.lineTo(-15, 45);
                ctx.lineTo(-7, 60);
                ctx.moveTo(0, 22);
                ctx.lineTo(22, 37);
            } else {
                ctx.lineTo(-15 + legSwing, 60);
                ctx.moveTo(0, 22);
                ctx.lineTo(15 - legSwing, 60);
            }
            ctx.stroke();

            ctx.restore();

            this.drawHpBarUI();
        }

        drawHpBarUI() {
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            ctx.fillRect(20, 20, 304, 34);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(22, 22, 300 * (this.hp / this.maxHp), 30);
            ctx.fillStyle = 'white';
            ctx.font = '24px Inter';
            ctx.fillText(`HP: ${Math.ceil(this.hp)}`, 30, 46);
        }
    }

    // --- MOBS & ITEMS ---

    class Slime extends Entity {
        constructor(x, y, tier = 0) {
            const configs = [
                { r: 25, hp: 20, weight: 0.8 },
                { r: 40, hp: 50, weight: 1.4 },
                { r: 60, hp: 100, weight: 2.4 },
                { r: 90, hp: 200, weight: 3.6 }
            ];
            const cfg = configs[tier] || configs[0];
            const body = Bodies.circle(x, y, cfg.r, {
                restitution: 0.75, 
                friction: 0.1,
                density: 0.001 * cfg.weight
            });
            super(body, cfg.hp, 'slime', cfg.weight);
            this.tier = tier;
            this.radius = cfg.r;
            this.moveTimer = 0;
            this.dir = Math.random() > 0.5 ? 1 : -1;
            this.isBoss = tier === 3;
            this.enteringTimer = 0;
            this.hasSplit = false;
        }

        update() {
            const pos = this.body.position;

            if (this.spawnGraceTimer > 0) {
                this.spawnGraceTimer--;
            }

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 60 && pos.x <= 1380) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 60) Matter.Body.setPosition(this.body, { x: 80, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1380) Matter.Body.setPosition(this.body, { x: 1360, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -150 || pos.x > 1590))) {
                    this.die();
                    return;
                }
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.5 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;

            if (pos.x < 60) this.dir = 1;
            else if (pos.x > 1380) this.dir = -1;

            this.moveTimer++;
            if (this.moveTimer > 60 && pos.x >= 60 && pos.x <= 1380) {
                this.dir = Math.random() > 0.5 ? 1 : -1;
                this.moveTimer = 0;
            }
            
            if (Math.random() < 0.03) {
                Body.applyForce(this.body, this.body.position, { x: 0, y: -0.06 * this.weight });
            }
            
            const speed = Math.max(1.8, 3.2 - this.tier * 0.4);
            Body.setVelocity(this.body, { x: this.dir * speed, y: this.body.velocity.y });
        }

        die() {
            if (!this.isDying) this.explode();
        }

        explode() {
            if (this.isDying || this.hasSplit) return;
            this.hasSplit = true;
            const pos = this.body.position;
            SoundFX.playExplosion(0.6 + this.tier * 0.3);
            createExplosion(pos.x, pos.y, '#32cd32', 30 + this.tier * 15);

            if (this.tier > 0) {
                const nextTier = this.tier - 1;
                for (let i = 0; i < 2; i++) {
                    const offset = (i === 0 ? -1 : 1) * (this.radius * 0.5);
                    const spawnX = Math.max(80, Math.min(1360, pos.x + offset));
                    const child = new Slime(spawnX, Math.min(pos.y - 10, 800), nextTier);
                    child.isEntering = false;
                    Matter.Body.setVelocity(child.body, {
                        x: (i === 0 ? -4 : 4),
                        y: -8
                    });
                }
            }

            super.die();
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.fillStyle = this.isBoss ? 'rgba(74, 222, 128, 0.95)' : 'rgba(50, 205, 50, 0.85)'; 
            ctx.beginPath();
            const wobble = Math.sin(Date.now() / 100) * (2 + this.tier * 1.5);
            ctx.ellipse(0, 0, this.radius + wobble, this.radius * 0.8 - wobble, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = this.isBoss ? '#15803d' : '#228B22';
            ctx.lineWidth = 3 + this.tier;
            ctx.stroke();

            const eyeSize = Math.max(3, 3 + this.tier * 2.5);
            const eyeSpacing = Math.max(8, 8 + this.tier * 6);
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(-eyeSpacing, -5, eyeSize, 0, Math.PI * 2);
            ctx.arc(eyeSpacing, -5, eyeSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-eyeSpacing - 3, -7, Math.max(2, eyeSize * 0.5), 0, Math.PI * 2);
            ctx.fill();

            if (this.isBoss) {
                ctx.fillStyle = '#facc15';
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.beginPath();
                const cy = -this.radius * 0.85;
                ctx.moveTo(-25, cy);
                ctx.lineTo(-32, cy - 25);
                ctx.lineTo(-12, cy - 12);
                ctx.lineTo(0, cy - 30);
                ctx.lineTo(12, cy - 12);
                ctx.lineTo(32, cy - 25);
                ctx.lineTo(25, cy);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
            this.drawHpBar(ctx, this.radius + 15);
        }
    }

    class Zombie extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 40, 112, {
                inertia: Infinity,
                restitution: 0.5, 
                friction: 0.1,
                density: 0.002
            });
            super(body, 50, 'zombie', 1.5);
            this.animTimer = 0;
            this.facing = 1;
            this.enteringTimer = 0;
        }

        update() {
            const pos = this.body.position;

            if (this.spawnGraceTimer > 0) {
                this.spawnGraceTimer--;
            }

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 60 && pos.x <= 1380) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 60) Matter.Body.setPosition(this.body, { x: 80, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1380) Matter.Body.setPosition(this.body, { x: 1360, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -150 || pos.x > 1590))) {
                    this.die();
                    return;
                }
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.5 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;

            if (!player || player.isDying) return;

            const px = player.body.position.x;
            const dir = px > pos.x ? 1 : -1;
            this.facing = dir;
            
            Body.setVelocity(this.body, { x: dir * 2.2, y: this.body.velocity.y });
            this.animTimer += 0.1;
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.strokeStyle = '#2E8B57'; 
            ctx.fillStyle = '#8FBC8F';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (Math.abs(this.body.velocity.x) > 0.3) {
                this.facing = this.body.velocity.x > 0 ? 1 : -1;
            }
            const eyeDir = this.facing;

            ctx.beginPath();
            ctx.arc(15 * eyeDir, -37, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'red';
            ctx.fillRect(eyeDir * 18, -42, 4, 4);
            ctx.fillRect(eyeDir * 9, -42, 4, 4);

            ctx.beginPath();
            ctx.moveTo(15 * eyeDir, -19);
            ctx.lineTo(0, 22);
            ctx.stroke();

            let armSwing = Math.sin(this.animTimer) * 15;
            ctx.beginPath();
            ctx.moveTo(7 * eyeDir, -7);
            ctx.lineTo(22 * eyeDir + armSwing, 15);
            ctx.stroke();

            let legSwing = Math.sin(this.animTimer * 0.5) * 15; 
            ctx.beginPath();
            ctx.moveTo(0, 22);
            ctx.lineTo(-15 + legSwing, 52);
            ctx.moveTo(0, 22);
            ctx.lineTo(15 - legSwing, 55);
            ctx.stroke();

            ctx.restore();
            this.drawHpBar(ctx, 65);
        }
    }

    class Golem extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 75, 110, {
                inertia: Infinity,
                restitution: 0.2,
                friction: 0.3,
                density: 0.005
            });
            super(body, 120, 'golem', 3.2);
            this.animTimer = 0;
            this.facing = 1;
            this.enteringTimer = 0;
            this.heldMob = null;
            this.throwCooldown = 150;
            this.windupTimer = 0;
            this.searchTimer = 0;
        }

        update() {
            const pos = this.body.position;

            if (this.spawnGraceTimer > 0) {
                this.spawnGraceTimer--;
            }

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 70 && pos.x <= 1370) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 70) Matter.Body.setPosition(this.body, { x: 90, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1370) Matter.Body.setPosition(this.body, { x: 1350, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -180 || pos.x > 1620))) {
                    if (this.heldMob) this.heldMob = null;
                    this.die();
                    return;
                }
            }

            const isAirborne = Math.abs(this.body.velocity.y) > 1.8 || (player && player.grabbedEntity === this);
            if (isAirborne) {
                if (this.heldMob) {
                    this.heldMob = null;
                    this.windupTimer = 0;
                }
                return;
            }

            if (!player || player.isDying) return;

            const px = player.body.position.x;
            const dir = px > pos.x ? 1 : -1;
            this.facing = dir;

            if (this.throwCooldown > 0) this.throwCooldown--;

            if (this.heldMob) {
                if (this.heldMob.isDying || this.heldMob.markedForDeletion || (player && player.grabbedEntity === this.heldMob)) {
                    this.heldMob = null;
                    this.windupTimer = 0;
                } else {
                    Body.setPosition(this.heldMob.body, {
                        x: pos.x + this.facing * 15,
                        y: pos.y - 75
                    });
                    Body.setVelocity(this.heldMob.body, { x: 0, y: 0 });

                    this.windupTimer++;
                    if (this.windupTimer >= 50) {
                        const targetPos = player.body.position;
                        const throwAngle = Math.atan2(targetPos.y - (pos.y - 75), targetPos.x - pos.x);
                        const throwSpeed = 24;

                        Body.setVelocity(this.heldMob.body, {
                            x: Math.cos(throwAngle) * throwSpeed,
                            y: Math.sin(throwAngle) * throwSpeed - 4
                        });
                        this.heldMob.body.isThrown = true;
                        this.heldMob = null;
                        this.windupTimer = 0;
                        this.throwCooldown = 180;
                        SoundFX.playThrow();
                        shakeAmount = Math.max(shakeAmount, 10);
                    }
                }
            } else if (this.throwCooldown <= 0 && !this.isEntering) {
                this.searchTimer = (this.searchTimer || 0) + 1;
                if (this.searchTimer % 10 === 0) {
                    for (let i = 0; i < entities.length; i++) {
                        const e = entities[i];
                        if (e !== this && 
                            !e.isDying && 
                            !e.markedForDeletion && 
                            (e.type === 'slime' || e.type === 'zombie' || e.type === 'box') &&
                            (!player || player.grabbedEntity !== e) &&
                            Math.hypot(e.body.position.x - pos.x, e.body.position.y - pos.y) < 130) {
                            this.heldMob = e;
                            this.windupTimer = 0;
                            break;
                        }
                    }
                }
            }

            const speed = this.heldMob ? 1.0 : 1.6;
            Body.setVelocity(this.body, { x: dir * speed, y: this.body.velocity.y });
            this.animTimer += 0.08;
        }

        die(sourceBody = null) {
            if (this.heldMob) {
                this.heldMob = null;
            }
            super.die(sourceBody);
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);

            const dir = this.facing;
            const walkCycle = Math.sin(this.animTimer);

            const rockDark = '#475569';
            const rockMid = '#64748b';
            const rockHighlight = '#94a3b8';

            ctx.fillStyle = rockDark;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;

            // Left leg
            ctx.beginPath();
            ctx.roundRect(-24 + walkCycle * 6, 38, 18, 20, [4, 4, 8, 8]);
            ctx.fill();
            ctx.stroke();

            // Right leg
            ctx.beginPath();
            ctx.roundRect(8 - walkCycle * 6, 38, 18, 20, [4, 4, 8, 8]);
            ctx.fill();
            ctx.stroke();

            // Torso
            ctx.fillStyle = rockMid;
            ctx.beginPath();
            ctx.moveTo(-36, 38);
            ctx.lineTo(-44, -15);
            ctx.lineTo(-32, -35);
            ctx.lineTo(32, -35);
            ctx.lineTo(44, -15);
            ctx.lineTo(36, 38);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Rock cracks
            ctx.strokeStyle = rockHighlight;
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            ctx.moveTo(-15, -10);
            ctx.lineTo(0, -18);
            ctx.lineTo(12, -8);
            ctx.lineTo(8, 12);
            ctx.stroke();

            // Head
            ctx.fillStyle = rockDark;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 3;
            ctx.beginPath();
            ctx.roundRect(-20 + dir * 5, -48, 38, 26, [8, 8, 4, 4]);
            ctx.fill();
            ctx.stroke();

            // Eyes
            ctx.fillStyle = '#f59e0b';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 10;
            ctx.fillRect(-10 + dir * 10, -41, 6, 4);
            ctx.fillRect(2 + dir * 10, -41, 6, 4);
            ctx.shadowBlur = 0;

            // Arms
            ctx.fillStyle = rockMid;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;

            if (this.heldMob) {
                ctx.beginPath();
                ctx.roundRect(-42, -65, 20, 48, 8);
                ctx.fill();
                ctx.stroke();

                ctx.beginPath();
                ctx.roundRect(22, -65, 20, 48, 8);
                ctx.fill();
                ctx.stroke();

                if (this.windupTimer > 25) {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.4)';
                    ctx.beginPath();
                    ctx.arc(dir * 15, -75, 40 + Math.sin(Date.now() / 50) * 8, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                const armOffset = walkCycle * 10;

                ctx.beginPath();
                ctx.roundRect(-46, -18 - armOffset, 20, 52, 10);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = rockDark;
                ctx.beginPath();
                ctx.arc(-36, 36 - armOffset, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = rockMid;
                ctx.beginPath();
                ctx.roundRect(26, -18 + armOffset, 20, 52, 10);
                ctx.fill();
                ctx.stroke();

                ctx.fillStyle = rockDark;
                ctx.beginPath();
                ctx.arc(36, 36 + armOffset, 14, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
            this.drawHpBar(ctx, 65);
        }
    }

    class Maw extends Entity {
        constructor(x, y) {
            const body = Bodies.circle(x, y, 42, {
                restitution: 0.35,
                friction: 0.05,
                density: 0.003
            });
            super(body, 80, 'maw', 2.0);
            this.radius = 42;
            this.jawTimer = Math.random() * Math.PI * 2;
            this.isOpen = false;
            this.facing = 1;
            this.enteringTimer = 0;
            this.chompCooldown = 0;
        }

        update() {
            const pos = this.body.position;

            if (this.spawnGraceTimer > 0) {
                this.spawnGraceTimer--;
            }

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 70 && pos.x <= 1370) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 70) Matter.Body.setPosition(this.body, { x: 90, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1370) Matter.Body.setPosition(this.body, { x: 1350, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -180 || pos.x > 1620))) {
                    this.die();
                    return;
                }
            }

            // Jaw animation cycle
            this.jawTimer += 0.09;
            const jawCycle = Math.sin(this.jawTimer);
            this.isOpen = jawCycle > 0.05;

            // When mouth is open it is featherweight (easy to lift).
            // When mouth is closed it becomes heavy and dense.
            this.weight = this.isOpen ? 0.85 : 3.8;

            if (this.chompCooldown > 0) {
                this.chompCooldown--;
            }

            // Devour items in path without damaging self (boxes, bombs)
            if (this.isOpen) {
                for (let i = 0; i < entities.length; i++) {
                    const e = entities[i];
                    if (e && !e.isDying && !e.markedForDeletion && (e.type === 'box' || e.type === 'bomb')) {
                        const distToItem = Math.hypot(e.body.position.x - pos.x, e.body.position.y - pos.y);
                        if (distToItem < this.radius + 32) {
                            e.markedForDeletion = true;
                            e.isDying = true;
                            SoundFX.playChomp();
                            shakeAmount = Math.max(shakeAmount, 8);
                            createExplosion(e.body.position.x, e.body.position.y, '#111827', 15);
                            createExplosion(pos.x, pos.y, '#9333ea', 12);
                            break;
                        }
                    }
                }
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.8 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;

            if (!player || player.isDying) return;

            const px = player.body.position.x;
            const py = player.body.position.y;
            this.facing = px > pos.x ? 1 : -1;

            // Chomping movement towards Steve with rhythmic forward leaps
            const chompImpulse = this.isOpen ? 3.6 : 1.4;
            const vy = (py < pos.y - 40 && Math.random() < 0.04) ? -7 : this.body.velocity.y;
            Body.setVelocity(this.body, { x: this.facing * chompImpulse, y: vy });
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);

            const dir = this.facing;
            const jawCycle = Math.max(0, Math.sin(this.jawTimer));
            const openAngle = jawCycle * 0.48;

            // Outer void glow aura
            ctx.fillStyle = 'rgba(76, 29, 149, 0.25)';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 8 + jawCycle * 4, 0, Math.PI * 2);
            ctx.fill();

            // Upper Jaw (Pitch-black body)
            ctx.save();
            ctx.rotate(-openAngle * dir);
            ctx.fillStyle = '#09090b';
            ctx.strokeStyle = '#3b0764';
            ctx.lineWidth = 3.5;

            ctx.beginPath();
            if (dir === 1) {
                ctx.arc(0, 0, this.radius, Math.PI, 0, false);
            } else {
                ctx.arc(0, 0, this.radius, 0, Math.PI, false);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Jagged Upper Teeth
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            const teethCount = 4;
            const step = (this.radius * 1.7) / teethCount;
            for (let i = 0; i < teethCount; i++) {
                const tx = -this.radius * 0.85 + i * step;
                ctx.moveTo(tx, 0);
                ctx.lineTo(tx + step * 0.5, 12);
                ctx.lineTo(tx + step, 0);
            }
            ctx.fill();

            // Glowing Slitted Eye on upper skull
            const eyeX = dir * 10;
            const eyeY = -18;
            ctx.fillStyle = '#eab308';
            ctx.beginPath();
            ctx.ellipse(eyeX, eyeY, 8, 4, (dir * 25 * Math.PI) / 180, 0, Math.PI * 2);
            ctx.fill();

            // Slitted pupil
            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(eyeX + dir * 1.5, eyeY, 6, 1.8, (dir * 25 * Math.PI) / 180, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Lower Jaw
            ctx.save();
            ctx.rotate(openAngle * dir);
            ctx.fillStyle = '#09090b';
            ctx.strokeStyle = '#3b0764';
            ctx.lineWidth = 3.5;

            ctx.beginPath();
            if (dir === 1) {
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            } else {
                ctx.arc(0, 0, this.radius, Math.PI, 0, false);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Jagged Lower Teeth
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            for (let i = 0; i < teethCount; i++) {
                const tx = -this.radius * 0.85 + i * step;
                ctx.moveTo(tx, 0);
                ctx.lineTo(tx + step * 0.5, -12);
                ctx.lineTo(tx + step, 0);
            }
            ctx.fill();
            ctx.restore();

            // Dark inner mouth void when open
            if (this.isOpen) {
                ctx.fillStyle = 'rgba(147, 51, 234, 0.4)';
                ctx.beginPath();
                ctx.arc(dir * 6, 0, 10 * jawCycle, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
            this.drawHpBar(ctx, 55);
        }
    }

    class SpikeBoss extends Entity {
        constructor(x, y) {
            // Main central boss body
            const body = Bodies.circle(x, y, 65, {
                inertia: Infinity,
                frictionAir: 0.08,
                density: 0.008
            });
            super(body, 250, 'spike_boss', 9.0);
            this.radius = 65;
            this.canBeGrabbed = false;
            this.isEntering = false;
            this.angle = 0;
            this.rotationSpeed = 0.038;
            this.chainLength = 175;
            this.hitCooldown = 0;
            this.hoverTimer = 0;

            // Swinging heavy satellite flail
            const flailX = x + Math.cos(this.angle) * this.chainLength;
            const flailY = y + Math.sin(this.angle) * this.chainLength;
            const flailBody = Bodies.circle(flailX, flailY, 32, {
                density: 0.008,
                restitution: 0.4,
                friction: 0.1
            });
            flailBody.isFlail = true;
            this.flailEntity = new Entity(flailBody, 99999, 'flail', 4.5);
            this.flailEntity.canBeGrabbed = true;
            this.flailEntity.bossParent = this;
        }

        takeDamage(amount, sourceBody = null) {
            // Central core is immune unless hit by its own flail
            if (sourceBody && sourceBody.isFlail) {
                if (this.hitCooldown <= 0) {
                    this.hitCooldown = 30;
                    this.hp -= amount;
                    SoundFX.playHit();
                    SoundFX.playExplosion(0.8);
                    shakeAmount = Math.max(shakeAmount, 22);
                    createExplosion(this.body.position.x, this.body.position.y, '#f59e0b', 25);
                    createExplosion(this.body.position.x, this.body.position.y, '#e11d48', 20);

                    if (this.hp <= 0) {
                        this.hp = 0;
                        this.die();
                    }
                }
            }
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            if (this.flailEntity && !this.flailEntity.isDying) {
                this.flailEntity.die();
            }
            SoundFX.playExplosion(2.0);
            shakeAmount = 35;
            super.die(sourceBody);
        }

        update() {
            if (this.isDying) return;

            const pos = this.body.position;
            if (this.hitCooldown > 0) this.hitCooldown--;

            // Hover and track player smoothly across upper arena
            this.hoverTimer += 0.03;
            let targetX = 720;
            let targetY = 330 + Math.sin(this.hoverTimer) * 60;
            if (player && !player.isDying) {
                targetX = Math.max(260, Math.min(1180, player.body.position.x));
            }

            const hoverDx = (targetX - pos.x) * 0.025;
            const hoverDy = (targetY - pos.y) * 0.025;
            Body.setVelocity(this.body, { x: hoverDx, y: hoverDy });

            // Swing satellite flail in continuous orbit around the boss
            this.angle += this.rotationSpeed;
            if (this.flailEntity && !this.flailEntity.isDying) {
                const fb = this.flailEntity.body;

                // Natural target orbit position
                const idealFlailX = pos.x + Math.cos(this.angle) * this.chainLength;
                const idealFlailY = pos.y + Math.sin(this.angle) * this.chainLength;

                // When not being held/dragged by psychic power, orbit tightly
                const isHeld = player && player.grabbedEntity === this.flailEntity;
                if (!isHeld) {
                    const toIdealX = idealFlailX - fb.position.x;
                    const toIdealY = idealFlailY - fb.position.y;
                    Body.setVelocity(fb, {
                        x: fb.velocity.x * 0.8 + toIdealX * 0.12,
                        y: fb.velocity.y * 0.8 + toIdealY * 0.12
                    });
                } else {
                    // Pull back towards tether radius if stretched too far
                    const distToBoss = Math.hypot(fb.position.x - pos.x, fb.position.y - pos.y);
                    if (distToBoss > this.chainLength * 1.6) {
                        const pullAngle = Math.atan2(pos.y - fb.position.y, pos.x - fb.position.x);
                        Body.applyForce(fb, fb.position, {
                            x: Math.cos(pullAngle) * 0.08,
                            y: Math.sin(pullAngle) * 0.08
                        });
                    }
                }

                // Check collision between heavy flail and central core
                const distToCore = Math.hypot(fb.position.x - pos.x, fb.position.y - pos.y);
                if (distToCore < this.radius + 32) {
                    const flailSpeed = Math.hypot(fb.velocity.x, fb.velocity.y);
                    if (flailSpeed > 3.5 || isHeld) {
                        this.takeDamage(35, fb);
                        // Bounce the flail outward after successful hit
                        const bounceAngle = Math.atan2(fb.position.y - pos.y, fb.position.x - pos.x);
                        Body.setVelocity(fb, {
                            x: Math.cos(bounceAngle) * 16,
                            y: Math.sin(bounceAngle) * 16
                        });
                    }
                }
            }

            // Spike contact with boxes and bombs destroys them without self-damage
            for (let i = 0; i < entities.length; i++) {
                const ent = entities[i];
                if (ent && !ent.isDying && !ent.markedForDeletion && (ent.type === 'box' || ent.type === 'bomb')) {
                    const d = Math.hypot(ent.body.position.x - pos.x, ent.body.position.y - pos.y);
                    if (d < this.radius + 30) {
                        ent.markedForDeletion = true;
                        ent.isDying = true;
                        SoundFX.playExplosion(0.7);
                        createExplosion(ent.body.position.x, ent.body.position.y, '#94a3b8', 20);
                    }
                }
            }
        }

        draw(ctx) {
            const pos = this.body.position;

            // Draw chain links to flail
            if (this.flailEntity && !this.flailEntity.isDying) {
                const fpos = this.flailEntity.body.position;
                const linkCount = 8;
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 5;
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.lineTo(fpos.x, fpos.y);
                ctx.stroke();

                for (let i = 1; i < linkCount; i++) {
                    const lx = pos.x + (fpos.x - pos.x) * (i / linkCount);
                    const ly = pos.y + (fpos.y - pos.y) * (i / linkCount);
                    ctx.fillStyle = '#64748b';
                    ctx.beginPath();
                    ctx.arc(lx, ly, 4.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                // Draw swinging faceless spike flail
                ctx.save();
                ctx.translate(fpos.x, fpos.y);
                const spikeCountFlail = 8;
                for (let i = 0; i < spikeCountFlail; i++) {
                    const ang = (i / spikeCountFlail) * Math.PI * 2 + this.angle * 2;
                    ctx.fillStyle = '#334155';
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(ang - 0.25) * 28, Math.sin(ang - 0.25) * 28);
                    ctx.lineTo(Math.cos(ang) * 48, Math.sin(ang) * 48);
                    ctx.lineTo(Math.cos(ang + 0.25) * 28, Math.sin(ang + 0.25) * 28);
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(0, 0, 32, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            // Draw Central Spike Core
            ctx.save();
            ctx.translate(pos.x, pos.y);

            // Spikes around central body
            const spikeCount = 12;
            for (let i = 0; i < spikeCount; i++) {
                const ang = (i / spikeCount) * Math.PI * 2 + this.angle;
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(Math.cos(ang - 0.2) * (this.radius - 2), Math.sin(ang - 0.2) * (this.radius - 2));
                ctx.lineTo(Math.cos(ang) * (this.radius + 32), Math.sin(ang) * (this.radius + 32));
                ctx.lineTo(Math.cos(ang + 0.2) * (this.radius - 2), Math.sin(ang + 0.2) * (this.radius - 2));
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            // Dark iron center sphere
            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Menacing Face on central sphere
            // Evil slitted glowing red eyes
            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 14;

            ctx.beginPath();
            ctx.moveTo(-32, -18);
            ctx.lineTo(-12, -10);
            ctx.lineTo(-28, -2);
            ctx.closePath();
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(32, -18);
            ctx.lineTo(12, -10);
            ctx.lineTo(28, -2);
            ctx.closePath();
            ctx.fill();

            // Pupil gleams
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-22, -12, 4, 4);
            ctx.fillRect(18, -12, 4, 4);
            ctx.shadowBlur = 0;

            // Jagged grinning mouth
            ctx.fillStyle = '#b91c1c';
            ctx.beginPath();
            ctx.arc(0, 16, 26, 0.1, Math.PI - 0.1);
            ctx.closePath();
            ctx.fill();

            // Sharp teeth
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            for (let t = -20; t <= 20; t += 10) {
                ctx.moveTo(t, 16);
                ctx.lineTo(t + 4, 25);
                ctx.lineTo(t + 8, 16);
            }
            ctx.fill();

            ctx.restore();
            this.drawHpBar(ctx, this.radius + 20);
        }
    }

    class Box extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 60, 60, { density: 0.005 });
            super(body, 3, 'box', 2.0); 
        }
        
        die() {
            if (this.isDying) return;
            super.die();
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
