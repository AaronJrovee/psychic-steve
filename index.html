            this.isOpen = false;
            this.facing = 1;
            this.enteringTimer = 0;
            this.chompCooldown = 0;
        }

        update() {
            const pos = this.body.position;

            if (this.spawnGraceTimer > 0) {
                this.spawnGraceTimer--;
            }

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 70 && pos.x <= 1370) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 70) Matter.Body.setPosition(this.body, { x: 90, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1370) Matter.Body.setPosition(this.body, { x: 1350, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -180 || pos.x > 1620))) {
                    this.die();
                    return;
                }
            }

            // Jaw animation cycle
            this.jawTimer += 0.09;
            const jawCycle = Math.sin(this.jawTimer);
            this.isOpen = jawCycle > 0.05;

            // When mouth is open it is featherweight (easy to lift).
            // When mouth is closed it becomes heavy and dense.
            this.weight = this.isOpen ? 0.85 : 3.8;

            if (this.chompCooldown > 0) {
                this.chompCooldown--;
            }

            // Devour items in path without damaging self (boxes, bombs)
            if (this.isOpen) {
                for (let i = 0; i < entities.length; i++) {
                    const e = entities[i];
                    if (e && !e.isDying && !e.markedForDeletion && (e.type === 'box' || e.type === 'bomb')) {
                        const distToItem = Math.hypot(e.body.position.x - pos.x, e.body.position.y - pos.y);
                        if (distToItem < this.radius + 32) {
                            e.markedForDeletion = true;
                            e.isDying = true;
                            SoundFX.playChomp();
                            shakeAmount = Math.max(shakeAmount, 8);
                            createExplosion(e.body.position.x, e.body.position.y, '#111827', 15);
                            createExplosion(pos.x, pos.y, '#9333ea', 12);
                            break;
                        }
                    }
                }
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.8 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;

            if (!player || player.isDying) return;

            const px = player.body.position.x;
            const py = player.body.position.y;
            this.facing = px > pos.x ? 1 : -1;

            const chompImpulse = this.isOpen ? 3.6 : 1.4;
            const vy = (py < pos.y - 40 && Math.random() < 0.04) ? -7 : this.body.velocity.y;
            Body.setVelocity(this.body, { x: this.facing * chompImpulse, y: vy });
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);

            const dir = this.facing;
            const jawCycle = Math.max(0, Math.sin(this.jawTimer));
            const openAngle = jawCycle * 0.48;

            ctx.fillStyle = 'rgba(76, 29, 149, 0.25)';
            ctx.beginPath();
            ctx.arc(0, 0, this.radius + 8 + jawCycle * 4, 0, Math.PI * 2);
            ctx.fill();

            // Upper Jaw
            ctx.save();
            ctx.rotate(-openAngle * dir);
            ctx.fillStyle = '#09090b';
            ctx.strokeStyle = '#3b0764';
            ctx.lineWidth = 3.5;

            ctx.beginPath();
            if (dir === 1) {
                ctx.arc(0, 0, this.radius, Math.PI, 0, false);
            } else {
                ctx.arc(0, 0, this.radius, 0, Math.PI, false);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Upper Teeth
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            const teethCount = 4;
            const step = (this.radius * 1.7) / teethCount;
            for (let i = 0; i < teethCount; i++) {
                const tx = -this.radius * 0.85 + i * step;
                ctx.moveTo(tx, 0);
                ctx.lineTo(tx + step * 0.5, 12);
                ctx.lineTo(tx + step, 0);
            }
            ctx.fill();

            // Slitted Eye
            const eyeX = dir * 10;
            const eyeY = -18;
            ctx.fillStyle = '#eab308';
            ctx.beginPath();
            ctx.ellipse(eyeX, eyeY, 8, 4, (dir * 25 * Math.PI) / 180, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.ellipse(eyeX + dir * 1.5, eyeY, 6, 1.8, (dir * 25 * Math.PI) / 180, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Lower Jaw
            ctx.save();
            ctx.rotate(openAngle * dir);
            ctx.fillStyle = '#09090b';
            ctx.strokeStyle = '#3b0764';
            ctx.lineWidth = 3.5;

            ctx.beginPath();
            if (dir === 1) {
                ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            } else {
                ctx.arc(0, 0, this.radius, Math.PI, 0, false);
            }
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Lower Teeth
            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            for (let i = 0; i < teethCount; i++) {
                const tx = -this.radius * 0.85 + i * step;
                ctx.moveTo(tx, 0);
                ctx.lineTo(tx + step * 0.5, -12);
                ctx.lineTo(tx + step, 0);
            }
            ctx.fill();
            ctx.restore();

            if (this.isOpen) {
                ctx.fillStyle = 'rgba(147, 51, 234, 0.4)';
                ctx.beginPath();
                ctx.arc(dir * 6, 0, 10 * jawCycle, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
            this.drawHpBar(ctx, 55);
        }
    }

    class Bone extends Entity {
        constructor(x, y, owner = null) {
            const body = Bodies.rectangle(x, y, 42, 14, {
                restitution: 0.4,
                friction: 0.15,
                density: 0.003
            });
            super(body, 1, 'bone', 0.9);
            this.owner = owner;
            this.ownerGraceTicks = 20;
            this.spinAngle = 0;
            this.canBeGrabbed = true;
            this.isBroken = false;
            this.durability = 3;
            this.lifespan = 600;
            this.isFadingOnGround = false;
            this.fadeAlpha = 1.0;
        }

        update() {
            if (this.isDying || this.markedForDeletion) return;

            if (this.ownerGraceTicks > 0) this.ownerGraceTicks--;

            const pos = this.body.position;
            if (pos.y > 1050 || pos.x < -200 || pos.x > 1640) {
                this.die();
                return;
            }

            const isHeld = player && player.grabbedEntity === this;
            if (isHeld) {
                this.ownerGraceTicks = 0;
                this.isFadingOnGround = false;
                this.fadeAlpha = 1.0;
            } else if (this.isFadingOnGround) {
                this.fadeAlpha -= 0.04;
                if (this.fadeAlpha <= 0) {
                    this.die();
                    return;
                }
            } else {
                this.lifespan--;
                if (this.lifespan <= 0) {
                    this.die();
                    return;
                }
            }

            if (Math.abs(this.body.velocity.x) > 0.8 || Math.abs(this.body.velocity.y) > 0.8) {
                this.spinAngle += 0.22;
                Body.setAngle(this.body, this.spinAngle);
            }
        }

        breakBone() {
            if (this.isBroken || this.isDying) return;
            this.durability--;
            if (this.durability <= 0) {
                this.isBroken = true;
                if (this.owner) this.owner.activeBone = null;
                SoundFX.playBoneClack();
                createExplosion(this.body.position.x, this.body.position.y, '#f8fafc', 3);
                this.die();
            } else {
                SoundFX.playBoneClack();
                createExplosion(this.body.position.x, this.body.position.y, '#f8fafc', 3);
            }
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this.body.angle);

            if (this.isFadingOnGround) {
                ctx.globalAlpha = Math.max(0, this.fadeAlpha);
            } else if (this.lifespan < 120 && Math.floor(this.lifespan / 10) % 2 === 0) {
                ctx.globalAlpha = 0.35;
            }

            ctx.fillStyle = '#ffffff';
            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 3.5;
            ctx.lineCap = 'round';

            ctx.beginPath();
            ctx.moveTo(-18, 0);
            ctx.quadraticCurveTo(0, -6, 18, 0);
            ctx.quadraticCurveTo(0, 4, -18, 0);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(-17, -3, 3.5, 0, Math.PI * 2);
            ctx.arc(-17, 3, 3.5, 0, Math.PI * 2);
            ctx.arc(17, -3, 3.5, 0, Math.PI * 2);
            ctx.arc(17, 3, 3.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.restore();
        }
    }

    class SkeletonCollapse {
        constructor(x, y, facing) {
            this.life = 75;
            this.maxLife = 75;
            this.bones = [
                { type: 'skull', x: x, y: y - 36, vx: (Math.random() - 0.5) * 5 + facing * 2, vy: -7 - Math.random() * 4, rot: 0, vRot: (Math.random() - 0.5) * 0.25 },
                { type: 'ribs', x: x, y: y - 10, vx: (Math.random() - 0.5) * 4, vy: -5 - Math.random() * 3, rot: 0, vRot: (Math.random() - 0.5) * 0.18 },
                { type: 'pelvis', x: x, y: y + 15, vx: (Math.random() - 0.5) * 3, vy: -3 - Math.random() * 3, rot: 0, vRot: (Math.random() - 0.5) * 0.15 },
                { type: 'limb', w: 22, x: x - 12, y: y - 8, vx: -3 - Math.random() * 3, vy: -6 - Math.random() * 4, rot: 0, vRot: -0.2 },
                { type: 'limb', w: 22, x: x + 12, y: y - 8, vx: 3 + Math.random() * 3, vy: -6 - Math.random() * 4, rot: 0, vRot: 0.2 },
                { type: 'limb', w: 26, x: x - 8, y: y + 35, vx: -2 - Math.random() * 2, vy: -4 - Math.random() * 3, rot: 0, vRot: -0.15 },
                { type: 'limb', w: 26, x: x + 8, y: y + 35, vx: 2 + Math.random() * 2, vy: -4 - Math.random() * 3, rot: 0, vRot: 0.15 }
            ];
        }

        update() {
            this.life--;
            for (let i = 0; i < this.bones.length; i++) {
                const b = this.bones[i];
                b.vy += 0.45;
                b.x += b.vx;
                b.y += b.vy;
                b.rot += b.vRot;

                if (b.y > 880) {
                    b.y = 880;
                    b.vy *= -0.35;
                    b.vx *= 0.75;
                    b.vRot *= 0.6;
                }
            }
        }

        draw(ctx) {
            const alpha = Math.max(0, this.life / this.maxLife);
            ctx.save();
            ctx.globalAlpha = alpha;

            for (let i = 0; i < this.bones.length; i++) {
                const b = this.bones[i];
                ctx.save();
                ctx.translate(b.x, b.y);
                ctx.rotate(b.rot);

                ctx.fillStyle = '#ffffff';
                ctx.strokeStyle = '#0f172a';
                ctx.lineWidth = 3.5;
                ctx.lineCap = 'round';

                if (b.type === 'skull') {
                    ctx.beginPath();
                    ctx.arc(0, 0, 14, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();

                    ctx.fillStyle = '#0f172a';
                    ctx.beginPath();
                    ctx.arc(-5, -2, 3.5, 0, Math.PI * 2);
                    ctx.arc(5, -2, 3.5, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.fillStyle = '#ffffff';
                    ctx.beginPath();
                    ctx.roundRect(-7, 8, 14, 6, 2);
                    ctx.fill();
                    ctx.stroke();
                } else if (b.type === 'ribs') {
                    ctx.beginPath();
                    ctx.roundRect(-12, -10, 24, 20, 6);
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.moveTo(-10, -4);
                    ctx.lineTo(10, -4);
                    ctx.moveTo(-10, 2);
                    ctx.lineTo(10, 2);
                    ctx.stroke();
                } else if (b.type === 'pelvis') {
                    ctx.beginPath();
                    ctx.roundRect(-12, -4, 24, 10, 4);
                    ctx.fill();
                    ctx.stroke();
                } else {
                    ctx.beginPath();
                    ctx.roundRect(-b.w / 2, -3, b.w, 6, 3);
                    ctx.fill();
                    ctx.stroke();

                    ctx.beginPath();
                    ctx.arc(-b.w / 2, -4, 4, 0, Math.PI * 2);
                    ctx.arc(-b.w / 2, 4, 4, 0, Math.PI * 2);
                    ctx.arc(b.w / 2, -4, 4, 0, Math.PI * 2);
                    ctx.arc(b.w / 2, 4, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.stroke();
                }

                ctx.restore();
            }

            ctx.restore();
        }
    }

    class Skeleton extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 42, 110, {
                inertia: Infinity, restitution: 0.2, friction: 0.15, density: 0.002
            });
            super(body, 60, 'skeleton', 1.3);
            this.animTimer = 0;
            this.facing = 1;
            this.enteringTimer = 0;
            this.hasBone = true;
            this.throwCooldown = 45;
            this.activeBone = null;
            this.strafeTimer = Math.floor(Math.random() * 60);
            this.strafeDir = Math.random() > 0.5 ? 1 : -1;
            this.hopCooldown = 0;
        }

        update() {
            const pos = this.body.position;

            if (this.spawnGraceTimer > 0) this.spawnGraceTimer--;

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 60 && pos.x <= 1380) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 60) Matter.Body.setPosition(this.body, { x: 80, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1380) Matter.Body.setPosition(this.body, { x: 1360, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -150 || pos.x > 1590))) {
                    this.die();
                    return;
                }
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.5 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;

            if (!player || player.isDying) return;

            const px = player.body.position.x;
            const distToSteve = Math.abs(px - pos.x);
            this.facing = px > pos.x ? 1 : -1;

            if (this.throwCooldown > 0) {
                this.throwCooldown--;
                if (this.throwCooldown <= 30 && !this.hasBone) {
                    this.hasBone = true;
                }
            }

            if (this.hopCooldown > 0) this.hopCooldown--;

            let vx = 0;
            const preferredMinRange = 280;
            const preferredMaxRange = 560;

            this.strafeTimer++;
            if (this.strafeTimer > 90) {
                this.strafeTimer = 0;
                this.strafeDir = Math.random() > 0.4 ? this.facing : -this.facing;
            }

            if (distToSteve < preferredMinRange) {
                vx = -this.facing * 1.85;
                if (distToSteve < 170 && this.hopCooldown <= 0 && Math.random() < 0.08) {
                    Body.setVelocity(this.body, { x: -this.facing * 4.2, y: -10 });
                    this.hopCooldown = 100;
                    return;
                }
            } else if (distToSteve > preferredMaxRange) {
                vx = this.facing * 1.95;
            } else {
                vx = this.strafeDir * 1.25;
            }

            if (pos.x < 100) vx = Math.max(vx, 1.4);
            if (pos.x > 1340) vx = Math.min(vx, -1.4);

            if (this.hasBone && this.throwCooldown <= 0 && !this.isEntering) {
                this.throwBone();
            }

            Body.setVelocity(this.body, { x: vx, y: this.body.velocity.y });
            this.animTimer += Math.abs(vx) > 0.1 ? 0.12 : 0;
        }

        throwBone() {
            if (!this.hasBone || !player || player.isDying) return;
            this.hasBone = false;
            this.throwCooldown = 95;

            const pos = this.body.position;
            const spawnX = pos.x + this.facing * 24;
            const spawnY = pos.y - 18;

            const bone = new Bone(spawnX, spawnY, this);
            this.activeBone = bone;

            const targetX = player.body.position.x;
            const targetY = player.body.position.y - 10;
            const dx = targetX - spawnX;
            const dy = targetY - spawnY;
            const dist = Math.hypot(dx, dy) || 1;
            const throwSpeed = 18.5;

            Body.setVelocity(bone.body, {
                x: (dx / dist) * throwSpeed,
                y: (dy / dist) * throwSpeed - 6.2
            });

            SoundFX.playBoneClack();
            SoundFX.playThrow();
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            const pos = { x: this.body.position.x, y: this.body.position.y };
            collapsingSkeletons.push(new SkeletonCollapse(pos.x, pos.y, this.facing));
            SoundFX.playBoneClack();
            super.die(sourceBody);
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);

            const dir = this.facing;
            const walk = Math.sin(this.animTimer);

            ctx.strokeStyle = '#0f172a';
            ctx.lineWidth = 4.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.fillStyle = '#ffffff';

            // Head
            ctx.beginPath();
            ctx.arc(dir * 6, -38, 17, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            // Jaw
            ctx.beginPath();
            ctx.roundRect(dir * 2, -26, 12 * dir, 7, 2);
            ctx.fill();
            ctx.stroke();

            // Eyes
            ctx.fillStyle = '#0f172a';
            ctx.beginPath();
            ctx.arc(dir * 10, -40, 3.8, 0, Math.PI * 2);
            ctx.arc(dir * 3, -40, 3.2, 0, Math.PI * 2);
            ctx.fill();

            // Spine & Ribs
            ctx.beginPath();
            ctx.moveTo(0, -21);
            ctx.lineTo(0, 18);
            ctx.stroke();

            for (let r = -12; r <= 8; r += 7) {
                ctx.beginPath();
                ctx.moveTo(-13, r);
                ctx.lineTo(13, r);
                ctx.stroke();
            }

            // Pelvis
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.roundRect(-12, 14, 24, 8, 3);
            ctx.fill();
            ctx.stroke();

            // Legs
            const legSwing = walk * 14;
            ctx.beginPath();
            ctx.moveTo(-6, 22);
            ctx.lineTo(-8 - legSwing, 40);
            ctx.lineTo(-6 - legSwing, 55);
            ctx.moveTo(6, 22);
            ctx.lineTo(8 + legSwing, 40);
            ctx.lineTo(6 + legSwing, 55);
            ctx.stroke();

            // Arms
            ctx.beginPath();
            ctx.moveTo(0, -14);
            ctx.lineTo(-14, 4);
            ctx.lineTo(-10, 20);
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, -14);
            if (this.hasBone) {
                ctx.lineTo(dir * 18, -4);
                ctx.lineTo(dir * 24, -14);
                ctx.stroke();

                ctx.save();
                ctx.translate(dir * 24, -14);
                ctx.rotate(dir * 0.45);
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.roundRect(-4, -14, 8, 28, 4);
                ctx.fill();
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(-5, -13, 3, 0, Math.PI * 2);
                ctx.arc(5, -13, 3, 0, Math.PI * 2);
                ctx.arc(-5, 13, 3, 0, Math.PI * 2);
                ctx.arc(5, 13, 3, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            } else {
                ctx.lineTo(dir * 14, 4);
                ctx.lineTo(dir * 10, 20);
                ctx.stroke();
            }

            ctx.restore();
            this.drawHpBar(ctx, 65);
        }
    }

    // --- RESTRUCTURED 3-STAGE IRON JUGGERNAUT ---
    class SpikeBoss extends Entity {
        constructor(x, y) {
            const body = Bodies.circle(x, y, 88, {
                inertia: Infinity, frictionAir: 0.08, density: 0.01
            });
            super(body, 15, 'spike_boss', 11.0); // Stage 1 takes 15 blows from flail
            this.radius = 88;
            this.canBeGrabbed = false;
            this.isEntering = false;
            this.angle = 0;
            this.rotationSpeed = 0.058; // Faster, aggressive swing
            this.chainLength = 230;
            this.hitCooldown = 0;
            this.bossStage = 1;
            this.activeSpikes = [];
            this.isSloMo = false;
            this.flailReboundTimer = 0; // Cooldown timer until flail can be grabbed again
            
            this.state = 'hover';
            this.stateTimer = 0;
            this.hoverTimer = 0;

            const flailX = x + Math.cos(this.angle) * this.chainLength;
            const flailY = y + Math.sin(this.angle) * this.chainLength;
            // Enlarged flail ball hitbox (radius 58) for reliable psychic grabbing
            const flailBody = Bodies.circle(flailX, flailY, 58, {
                density: 0.012, restitution: 0.45, friction: 0.1
            });
            flailBody.isFlail = true;
            this.flailEntity = new Entity(flailBody, 99999, 'flail', 5.0);
            this.flailEntity.canBeGrabbed = true;
            this.flailEntity.bossParent = this;
        }

        takeDamage(amount, sourceBody = null) {
            if (this.isDying) return;
            
            let isSpikeHit = false;
            if (this.bossStage === 2) {
                if (sourceBody && (sourceBody.isBossSpike || (sourceBody.entity && sourceBody.entity.isBossSpike))) {
                    isSpikeHit = true;
                }
            }

            if (!isSpikeHit && this.hitCooldown > 0) return;
            
            let validHit = false;
            if (this.bossStage === 1) {
                if (sourceBody && sourceBody.isFlail) validHit = true;
            } else if (this.bossStage === 2) {
                if (isSpikeHit) validHit = true;
            } else if (this.bossStage === 3) {
                if (sourceBody && sourceBody.isStatic && this.body.isThrown) validHit = true;
            }

            if (validHit) {
                this.hitCooldown = this.bossStage === 2 ? 4 : 15;
                this.hp -= 1; 
                
                SoundFX.playHit();
                SoundFX.playExplosion(this.bossStage === 3 ? 1.2 : 0.8);
                shakeAmount = Math.max(shakeAmount, 24);
                createExplosion(this.body.position.x, this.body.position.y, '#f59e0b', 30);
                createExplosion(this.body.position.x, this.body.position.y, '#e11d48', 25);

                if (this.hp <= 0) {
                    this.hp = 0;
                    this.advanceStage();
                }
            }
        }

        advanceStage() {
            if (this.bossStage === 1) {
                this.bossStage = 2;
                this.hp = 25; // 25 spikes to defeat stage 2
                this.maxHp = 25;
                this.hitCooldown = 60;
                this.canBeGrabbed = false;
                
                if (this.flailEntity) {
                    createExplosion(this.flailEntity.body.position.x, this.flailEntity.body.position.y, '#94a3b8', 40);
                    this.flailEntity.die();
                    this.flailEntity = null;
                }

                this.state = 'stage2_idle';
                this.stateTimer = 0;

                SoundFX.playExplosion(1.5);
                shakeAmount = 40;
                createExplosion(this.body.position.x, this.body.position.y, '#c084fc', 50);
            }
            else if (this.bossStage === 2) {
                this.bossStage = 3;
                this.hp = 12; // 12 slams to shatter stage 3
                this.maxHp = 12;
                this.hitCooldown = 60;
                this.canBeGrabbed = false;
                this.weight = 5.2; // Manageable baseline weight
                
                this.activeSpikes.forEach(s => { if (!s.isDying) s.die(); });
                this.activeSpikes = [];
                this.isSloMo = false;

                Matter.Body.scale(this.body, 1.25, 1.25);
                this.radius *= 1.25;
                this.state = 'stage3_whirl';
                this.stateTimer = 0;

                SoundFX.playExplosion(2.2);
                shakeAmount = 55;
                createExplosion(this.body.position.x, this.body.position.y, '#f97316', 80);
            }
            else if (this.bossStage === 3) {
                this.die(); 
            }
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            if (this.flailEntity && !this.flailEntity.isDying) this.flailEntity.die();
            if (this.activeSpikes) this.activeSpikes.forEach(s => { if (!s.isDying) s.die(); });
            
            this.isDying = true;
            this.markedForDeletion = true;
            
            SoundFX.playExplosion(3.0);
            shakeAmount = 80;
            
            const shardCount = 80;
            const colors = ['#0f172a', '#1e293b', '#ef4444', '#f8fafc', '#b91c1c'];
            for (let j = 0; j < shardCount; j++) {
                const c = colors[Math.floor(Math.random() * colors.length)];
                particles.push(new Particle(
                    this.body.position.x, this.body.position.y, 
                    c, 35, Math.random() * 12 + 6, 60 + Math.random() * 40, 'shard'
                ));
            }
            
            registerKill(this.body.position.x, this.body.position.y);
        }

        update() {
            if (this.isDying) return;

            const pos = this.body.position;
            if (this.hitCooldown > 0) this.hitCooldown--;

            // ==================
            // STAGE 3: ZIP & SLAM
            // ==================
            if (this.bossStage === 3) {
                this.angle += 0.28; 
                const isHeld = player && player.grabbedEntity === this;
                
                if (isHeld) {
                    this.stateTimer = 0; 
                    this.state = 'stage3_stuck'; 
                } else if (!this.body.isThrown && player && !player.isDying) {
                    this.stateTimer++;
                    
                    if (this.state === 'stage3_whirl') {
                        this.canBeGrabbed = false;
                        this.weight = 5.2;

                        // Fast aerial whizzing with rapid velocity changes
                        if (this.stateTimer % 28 === 0) {
                            let tx, ty;
                            // 50% chance to dive directly towards/past Steve; 50% chance to violently zoom to arena high points
                            if (Math.random() < 0.5) {
                                tx = player.body.position.x + (Math.random() - 0.5) * 220;
                                ty = Math.max(160, player.body.position.y - 40 + (Math.random() - 0.5) * 120);
                            } else {
                                tx = 180 + Math.random() * 1080;
                                ty = 120 + Math.random() * 380;
                            }
                            const dx = tx - pos.x;
                            const dy = ty - pos.y;
                            const dist = Math.hypot(dx, dy) || 1;
                            const whizzSpeed = 32.0; // Fast whizzing speed
                            Matter.Body.setVelocity(this.body, { 
                                x: (dx / dist) * whizzSpeed, 
                                y: (dy / dist) * whizzSpeed 
                            });
                            SoundFX.playThrow();
                            shakeAmount = Math.max(shakeAmount, 8);
                        }

                        // Trail of fiery psychic friction particles while whizzing
                        if (this.stateTimer % 4 === 0) {
                            particles.push(new Particle(pos.x, pos.y, '#f97316', 10, Math.random() * 4 + 3, 20));
                        }

                        if (this.stateTimer > 600) { // 10 seconds of constant aerial whizzing
                            this.state = 'stage3_pause';
                            this.stateTimer = 0;
                            Matter.Body.setVelocity(this.body, { x: 0, y: 0 });
                        }
                    } else if (this.state === 'stage3_pause') {
                        this.canBeGrabbed = false;
                        // Ominous vibration warning before dive
                        if (this.stateTimer > 60) { 
                            this.state = 'stage3_dash';
                            this.stateTimer = 0;
                            const dx = player.body.position.x - pos.x;
                            const dy = player.body.position.y - pos.y;
                            const dist = Math.hypot(dx, dy) || 1;
                            const dashSpeed = 42; // Fast dash straight at player
                            Matter.Body.setVelocity(this.body, { 
                                x: (dx / dist) * dashSpeed, 
                                y: (dy / dist) * dashSpeed 
                            });
                            SoundFX.playExplosion(1.0);
                        }
                    } else if (this.state === 'stage3_dash') {
                        this.canBeGrabbed = false;
                        // Impact ground / buried partially into ground
                        if (pos.y > 780 || Math.hypot(this.body.velocity.x, this.body.velocity.y) < 4) {
                            this.state = 'stage3_stuck';
                            this.stateTimer = 0;
                            this.canBeGrabbed = true; // Grabbable now!
                            this.weight = 4.8; // Far less heavy so player can easily lift and slam
                            Matter.Body.setVelocity(this.body, { x: 0, y: 0 });
                            Matter.Body.setPosition(this.body, { x: pos.x, y: Math.min(pos.y, 825) });
                            SoundFX.playHit();
                            shakeAmount = 35;
                            createExplosion(pos.x, pos.y + this.radius, '#78350f', 35, 'shard');
                        }
                    } else if (this.state === 'stage3_stuck') {
                        this.canBeGrabbed = true;
                        this.weight = 4.8; // Clean, responsive grabbability
                        if (this.stateTimer > 360) { // 6-second window before breaking free
                            this.state = 'stage3_whirl';
                            this.stateTimer = 0;
                            this.canBeGrabbed = false;
                            this.weight = 5.2; 
                            Matter.Body.setVelocity(this.body, { x: 0, y: -26 });
                            SoundFX.playExplosion(0.9);
                            shakeAmount = 25;
                        }
                    }
                }

                let clamped = false;
                let cx = pos.x, cy = pos.y;
                if (pos.x < 50) { cx = 50; clamped = true; }
                if (pos.x > 1390) { cx = 1390; clamped = true; }
                if (pos.y < -100) { cy = 50; clamped = true; }
                if (pos.y > 850) { cy = 830; clamped = true; } 
                
                if (clamped) {
                    Matter.Body.setPosition(this.body, { x: cx, y: cy });
                    if (pos.y > 850) Matter.Body.setVelocity(this.body, { x: this.body.velocity.x * 0.8, y: -8 });
                }
                return; 
            }

            // ==================
            // STAGE 2: TIME WARP
            // ==================
            if (this.bossStage === 2) {
                this.canBeGrabbed = false;
                // Maintains Stage 1 spin rate (which appears slowed down by time dilation during slowmo)
                this.angle += (this.isSloMo ? this.rotationSpeed * 0.20 : this.rotationSpeed); 
                this.stateTimer++;
                
                // Keep the boss in the upper center with a smooth side-to-side hovering sway
                const swayOffset = Math.sin(this.stateTimer * 0.035) * 160;
                const targetX = 720 + swayOffset;
                const targetY = 230 + Math.cos(this.stateTimer * 0.04) * 25;
                const hoverDx = (targetX - pos.x) * 0.04;
                const hoverDy = (targetY - pos.y) * 0.04;
                Matter.Body.setVelocity(this.body, { x: hoverDx, y: hoverDy });
                
                if (this.state === 'stage2_idle') {
                    if (this.stateTimer > 90) {
                        this.state = 'stage2_summon';
                        this.stateTimer = 0;
                    }
                } else if (this.state === 'stage2_summon') {
                    if (this.stateTimer === 30) { 
                        // Exactly 10 spikes per wave
                        for(let i = 0; i < 10; i++) {
                            const ang = (i / 10) * Math.PI * 2;
                            const sx = pos.x + Math.cos(ang) * 125;
                            const sy = pos.y + Math.sin(ang) * 125;
                            const spike = new BossSpike(sx, sy, ang);
                            this.activeSpikes.push(spike);
                        }
                        this.state = 'stage2_timewarp';
                        this.stateTimer = 0;
                        SoundFX.playExplosion(0.5);
                        this.isSloMo = true; 
                    }
                } else if (this.state === 'stage2_timewarp') {
                    // Check if all active unreturned spikes have been psychically returned or destroyed
                    const unreturnedSpikesLeft = this.activeSpikes.some(s => !s.isDying && !s.playerOwned);

                    // 5-second slow-motion duration (300 frames) or instant completion if all spikes are returned
                    if (this.stateTimer > 300 || !unreturnedSpikesLeft) { 
                        this.state = 'stage2_release';
                        this.stateTimer = 0;
                        this.isSloMo = false; // Time returns to normal
                        
                        // All spikes resume normal speed in their travel direction
                        this.activeSpikes.forEach(s => {
                            if (!s.isDying) {
                                s.state = 'release';
                                if (s.playerOwned && s.thrownVelocity) {
                                    const ang = Math.atan2(s.thrownVelocity.y, s.thrownVelocity.x);
                                    Matter.Body.setAngle(s.body, ang + Math.PI / 2);
                                }
                            }
                        });
                        SoundFX.playThrow(); 
                    }
                } else if (this.state === 'stage2_release') {
                    if (this.stateTimer > 180) {
                        this.state = 'stage2_idle';
                        this.stateTimer = 0;
                        this.activeSpikes = this.activeSpikes.filter(s => !s.isDying);
                    }
                }
                return; 
            }

            // ==================
            // STAGE 1: THE FLAIL
            // ==================
            this.stateTimer++;
            if (this.state === 'hover') {
                this.hoverTimer += 0.035;
                let targetX = 720;
                let targetY = 310 + Math.sin(this.hoverTimer) * 75;
                if (player && !player.isDying) targetX = Math.max(260, Math.min(1180, player.body.position.x));

                const hoverDx = (targetX - pos.x) * 0.028;
                const hoverDy = (targetY - pos.y) * 0.028;
                Body.setVelocity(this.body, { x: hoverDx, y: hoverDy });
                
                if (this.stateTimer > 210) { 
                    this.state = 'windup';
                    this.stateTimer = 0;
                }
            } else if (this.state === 'windup') {
                Body.setVelocity(this.body, { x: 0, y: 0 });
                if (this.stateTimer > 50) {
                    this.state = 'charge';
                    this.stateTimer = 0;
                    SoundFX.playThrow(); 
                    if (player && !player.isDying) {
                        const dx = player.body.position.x - pos.x;
                        const dy = player.body.position.y - pos.y;
                        const dist = Math.hypot(dx, dy) || 1;
                        const chargeSpeed = 24.0;
                        Body.setVelocity(this.body, { x: (dx / dist) * chargeSpeed, y: (dy / dist) * chargeSpeed });
                    }
                }
            } else if (this.state === 'charge') {
                const speed = Math.hypot(this.body.velocity.x, this.body.velocity.y);
                if (this.stateTimer > 65 || speed < 3) {
                    this.state = 'hover';
                    this.stateTimer = 0;
                }
                if (this.stateTimer % 5 === 0) createExplosion(pos.x, pos.y + this.radius, '#64748b', 2);
            }

            for (let i = 0; i < breakablePlatforms.length; i++) {
                let plat = breakablePlatforms[i];
                if (!plat.isBroken) {
                    if (Matter.Bounds.overlaps(this.body.bounds, plat.bounds) || 
                       (this.flailEntity && !this.flailEntity.isDying && Matter.Bounds.overlaps(this.flailEntity.body.bounds, plat.bounds))) {
                        
                        plat.isBroken = true;
                        Composite.remove(engine.world, plat); 
                        SoundFX.playHit();
                        shakeAmount = Math.max(shakeAmount, 15);
                        
                        const shardCount = 25;
                        const woodColors = ['#D2B48C', '#8B4513', '#A0522D', '#CD853F', '#DEB887'];
                        for (let j = 0; j < shardCount; j++) {
                            const chosenColor = woodColors[Math.floor(Math.random() * woodColors.length)];
                            particles.push(new Particle(
                                plat.position.x + (Math.random() - 0.5) * plat.origW, 
                                plat.position.y + (Math.random() - 0.5) * plat.origH, 
                                chosenColor, 18, Math.random() * 8 + 4, 40 + Math.random() * 20, 'shard'
                            ));
                        }
                    }
                }
            }

            this.angle += this.rotationSpeed;
            if (this.flailEntity && !this.flailEntity.isDying) {
                const fb = this.flailEntity.body;

                // Handle flail grabbability based on rebound cooldown
                if (this.flailReboundTimer > 0) {
                    this.flailReboundTimer--;
                    this.flailEntity.canBeGrabbed = false;
                } else {
                    this.flailEntity.canBeGrabbed = true;
                }

                const idealFlailX = pos.x + Math.cos(this.angle) * this.chainLength;
                const idealFlailY = pos.y + Math.sin(this.angle) * this.chainLength;
                const isHeld = player && player.grabbedEntity === this.flailEntity;
                
                if (!isHeld) {
                    const toIdealX = idealFlailX - fb.position.x;
                    const toIdealY = idealFlailY - fb.position.y;
                    Body.setVelocity(fb, {
                        x: fb.velocity.x * 0.70 + toIdealX * 0.22,
                        y: fb.velocity.y * 0.70 + toIdealY * 0.22
                    });
                } else {
                    const distToBoss = Math.hypot(fb.position.x - pos.x, fb.position.y - pos.y);
                    if (distToBoss > this.chainLength * 1.5) {
                        const pullAngle = Math.atan2(pos.y - fb.position.y, pos.x - fb.position.x);
                        Body.applyForce(fb, fb.position, {
                            x: Math.cos(pullAngle) * 0.15,
                            y: Math.sin(pullAngle) * 0.15
                        });
                    }
                }

                const distToCore = Math.hypot(fb.position.x - pos.x, fb.position.y - pos.y);
                if (distToCore < this.radius + 58) {
                    const flailSpeed = Math.hypot(fb.velocity.x, fb.velocity.y);
                    if (flailSpeed > 3.5 || isHeld) {
                        this.takeDamage(1, fb);
                        const bounceAngle = Math.atan2(fb.position.y - pos.y, fb.position.x - pos.x);
                        Body.setVelocity(fb, {
                            x: Math.cos(bounceAngle) * 26,
                            y: Math.sin(bounceAngle) * 26
                        });
                        // Drop grip if currently held and start rebound cooldown
                        if (isHeld && player) {
                            player.releaseGrip(false);
                        }
                        this.flailReboundTimer = 45; // Cannot be grabbed until bouncing back fully
                        this.flailEntity.canBeGrabbed = false;
                    }
                }
            }

            for (let i = 0; i < entities.length; i++) {
                const ent = entities[i];
                if (ent && !ent.isDying && !ent.markedForDeletion && (ent.type === 'box' || ent.type === 'bomb')) {
                    const d = Math.hypot(ent.body.position.x - pos.x, ent.body.position.y - pos.y);
                    if (d < this.radius + 36) {
                        ent.markedForDeletion = true;
                        ent.isDying = true;
                        SoundFX.playExplosion(0.7);
                        createExplosion(ent.body.position.x, ent.body.position.y, '#94a3b8', 20);
                    }
                }
            }
        }

        draw(ctx) {
            const pos = this.body.position;

            if (this.flailEntity && !this.flailEntity.isDying) {
                const fpos = this.flailEntity.body.position;
                const linkCount = 10;
                ctx.strokeStyle = '#475569';
                ctx.lineWidth = 6;
                ctx.beginPath();
                ctx.moveTo(pos.x, pos.y);
                ctx.lineTo(fpos.x, fpos.y);
                ctx.stroke();

                for (let i = 1; i < linkCount; i++) {
                    const lx = pos.x + (fpos.x - pos.x) * (i / linkCount);
                    const ly = pos.y + (fpos.y - pos.y) * (i / linkCount);
                    ctx.fillStyle = '#64748b';
                    ctx.beginPath();
                    ctx.arc(lx, ly, 6, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.save();
                ctx.translate(fpos.x, fpos.y);
                const spikeCountFlail = 8;
                const flailDrawRad = 58;
                for (let i = 0; i < spikeCountFlail; i++) {
                    const ang = (i / spikeCountFlail) * Math.PI * 2 + this.angle * 2.5;
                    ctx.fillStyle = '#334155';
                    ctx.beginPath();
                    ctx.moveTo(Math.cos(ang - 0.25) * (flailDrawRad * 0.85), Math.sin(ang - 0.25) * (flailDrawRad * 0.85));
                    ctx.lineTo(Math.cos(ang) * (flailDrawRad * 1.45), Math.sin(ang) * (flailDrawRad * 1.45));
                    ctx.lineTo(Math.cos(ang + 0.25) * (flailDrawRad * 0.85), Math.sin(ang + 0.25) * (flailDrawRad * 0.85));
                    ctx.closePath();
                    ctx.fill();
                }
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#94a3b8';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(0, 0, flailDrawRad, 0, Math.PI * 2);
                ctx.fill();
                ctx.stroke();
                ctx.restore();
            }

            ctx.save();
            ctx.translate(pos.x, pos.y);

            if (this.bossStage === 3) {
                ctx.shadowColor = '#ef4444';
                ctx.shadowBlur = 30 + Math.sin(Date.now() / 50) * 15;
            }

            if (this.state === 'windup' || this.state === 'stage3_pause') {
                ctx.fillStyle = `rgba(239, 68, 68, ${Math.sin(this.stateTimer * 0.4) * 0.4 + 0.1})`;
                ctx.beginPath();
                ctx.arc(0, 0, this.radius + 35, 0, Math.PI * 2);
                ctx.fill();
                ctx.translate((Math.random() - 0.5) * 8, (Math.random() - 0.5) * 8);
            }

            const spikeCount = 14;
            for (let i = 0; i < spikeCount; i++) {
                const ang = (i / spikeCount) * Math.PI * 2 + this.angle;
                ctx.fillStyle = '#1e293b';
                ctx.strokeStyle = '#64748b';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.moveTo(Math.cos(ang - 0.2) * (this.radius - 3), Math.sin(ang - 0.2) * (this.radius - 3));
                ctx.lineTo(Math.cos(ang) * (this.radius + 40), Math.sin(ang) * (this.radius + 40));
                ctx.lineTo(Math.cos(ang + 0.2) * (this.radius - 3), Math.sin(ang + 0.2) * (this.radius - 3));
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = '#cbd5e1';
            ctx.lineWidth = 5;
            ctx.beginPath();
            ctx.arc(0, 0, this.radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = '#ef4444';
            ctx.shadowColor = '#ef4444';
            ctx.shadowBlur = 18;

            ctx.beginPath();
            ctx.moveTo(-44, -24); ctx.lineTo(-16, -14); ctx.lineTo(-38, -2);
            ctx.closePath(); ctx.fill();

            ctx.beginPath();
            ctx.moveTo(44, -24); ctx.lineTo(16, -14); ctx.lineTo(38, -2);
            ctx.closePath(); ctx.fill();

            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-30, -16, 5, 5);
            ctx.fillRect(25, -16, 5, 5);
            ctx.shadowBlur = 0;

            ctx.fillStyle = '#b91c1c';
            ctx.beginPath();
            ctx.arc(0, 22, 36, 0.1, Math.PI - 0.1);
            ctx.closePath();
            ctx.fill();

            ctx.fillStyle = '#f8fafc';
            ctx.beginPath();
            for (let t = -28; t <= 28; t += 14) {
                ctx.moveTo(t, 22); ctx.lineTo(t + 6, 35); ctx.lineTo(t + 12, 22);
            }
            ctx.fill();

            ctx.restore();
            this.drawHpBar(ctx, this.radius + 26);
        }

        drawHpBar(ctx, yOffset) {
            if (this.hp <= 0 || this.isDying) return;
            
            const pos = this.body.position;
            const barW = 480;
            const barH = 24;
            const x = pos.x - barW / 2;
            const y = pos.y - this.radius - 90; 

            ctx.save();
            
            ctx.fillStyle = '#ffffff';
            ctx.font = '900 24px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'bottom';
            ctx.shadowColor = 'rgba(0,0,0,0.85)';
            ctx.shadowBlur = 8;
            
            // Clean title without declaring the stage
            ctx.fillText("IRON JUGGERNAUT", pos.x, y - 10);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(x, y, barW, barH);

            const hpRatio = Math.max(0, Math.min(1.0, this.hp / this.maxHp));
            const hpGrad = ctx.createLinearGradient(x, y, x + barW, y);
            
            if (this.bossStage === 1) {
                hpGrad.addColorStop(0, '#ef4444');
                hpGrad.addColorStop(1, '#b91c1c');
            } else if (this.bossStage === 2) {
                hpGrad.addColorStop(0, '#c084fc'); 
                hpGrad.addColorStop(1, '#7e22ce');
            } else {
                hpGrad.addColorStop(0, '#f97316'); 
                hpGrad.addColorStop(1, '#c2410c');
            }

            ctx.fillStyle = hpGrad;
            ctx.fillRect(x + 2, y + 2, (barW - 4) * hpRatio, barH - 4);

            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 3.0;
            ctx.strokeRect(x, y, barW, barH);
            
            ctx.fillStyle = 'rgba(0,0,0,0.5)';
            for(let i = 1; i < this.maxHp; i++) {
                const tickX = x + (barW / this.maxHp) * i;
                ctx.fillRect(tickX - 1, y, 2, barH);
            }
            
            ctx.restore();
        }
    }

    class Box extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 60, 60, { density: 0.005 });
            super(body, 3, 'box', 2.0); 
        }
        
        die() {
            if (this.isDying) return;
            super.die();
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this.body.angle);
            
            ctx.fillStyle = '#D2B48C';
            ctx.fillRect(-30, -30, 60, 60);
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 4;
            ctx.strokeRect(-30, -30, 60, 60);
            
            ctx.beginPath();
            ctx.moveTo(-30, -30);
            ctx.lineTo(30, 30);
            ctx.moveTo(30, -30);
            ctx.lineTo(-30, 30);
            ctx.stroke();

            ctx.restore();
        }
    }

    class Bomb extends Entity {
        constructor(x, y) {
            const body = Bodies.circle(x, y, 30, { density: 0.005, restitution: 0.5 });
            super(body, 1, 'bomb', 1.2);
            this.timer = 600;
            this.flungByPlayer = false;
        }

        takeDamage(amount, sourceBody = null) {
            if (this.isDying || this.markedForDeletion) return;
            if ((this.flungByPlayer && this.body.isThrown) || amount >= 1000) {
                this.explode();
            }
        }

        update() {
            if (this.isDying || this.markedForDeletion) return;
            this.timer--;
            if (this.timer <= 0) {
                this.explode();
            }
        }

        explode() {
            if (this.isDying || this.markedForDeletion) return;
            this.isDying = true;
            this.markedForDeletion = true;

            const pos = { x: this.body.position.x, y: this.body.position.y };
            createExplosion(pos.x, pos.y, '#FF4500', 60);
            createExplosion(pos.x, pos.y, '#FFD700', 40);
            SoundFX.playExplosion(1.5);
            shakeAmount = 25; 

            const radius = 250;
            entities.forEach(e => {
                if (e !== this && !e.isDying && !e.markedForDeletion) {
                    const dist = Vector.magnitude(Vector.sub(e.body.position, pos));
                    if (dist < radius) {
                        e.takeDamage(50, this.body);
                        const force = Vector.mult(Vector.normalise(Vector.sub(e.body.position, pos)), 0.2);
                        Body.applyForce(e.body, e.body.position, force);
                    }
                }
            });
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            this.isDying = true;
            this.markedForDeletion = true;
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this.body.angle);
            
            ctx.fillStyle = '#222';
            ctx.beginPath();
            ctx.arc(0, 0, 30, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-12, -12, 6, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = '#A9A9A9';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, -30);
            ctx.quadraticCurveTo(15, -45, 30, -37);
            ctx.stroke();

            if (this.timer % 10 < 5) {
                ctx.fillStyle = '#FFA500';
                ctx.beginPath();
                ctx.arc(30, -37, 6, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    class HealingHeart extends Entity {
        constructor(x, y) {
            const body = Bodies.circle(x, y, 22, {
                restitution: 0.4,
                frictionAir: 0.04,
                density: 0.001
            });
            super(body, 999999, 'heart', 0.5);
            this.canBeGrabbed = true;
            this.rotAngle = 0;
            this.floatTimer = Math.random() * 100;
        }

        takeDamage(amount, sourceBody = null) {
            return;
        }

        update() {
            this.rotAngle += 0.05;
            this.floatTimer += 0.04;
            Body.applyForce(this.body, this.body.position, {
                x: 0,
                y: -0.0006 + Math.sin(this.floatTimer) * 0.0003
            });

            const pos = this.body.position;
            if (pos.y > 900) {
                Body.setPosition(this.body, { x: pos.x, y: 880 });
                Body.setVelocity(this.body, { x: 0, y: 0 });
            }
        }

        collect(playerEntity) {
            if (this.markedForDeletion || this.isDying) return;
            this.markedForDeletion = true;
            this.isDying = true;
            
            playerEntity.hp = Math.min(playerEntity.maxHp, playerEntity.hp + 25);
            SoundFX.playHeal();
            
            const pos = this.body.position;
            for (let i = 0; i < 28; i++) {
                particles.push(new Particle(pos.x, pos.y, '#f43f5e', 8, Math.random() * 4 + 2, 35));
                particles.push(new Particle(pos.x, pos.y, '#fda4af', 6, Math.random() * 3 + 1, 30));
            }
        }

        draw(ctx) {
            if (this.markedForDeletion) return;
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);

            const scaleX = Math.cos(this.rotAngle);
            ctx.scale(scaleX, 1);

            ctx.shadowColor = '#ff0000';
            ctx.shadowBlur = 18;

            ctx.beginPath();
            ctx.moveTo(0, 4);
            ctx.bezierCurveTo(0, -8, -23, -20, -23, 0);
            ctx.bezierCurveTo(-23, 14, -12, 21, 0, 24);
            ctx.bezierCurveTo(12, 21, 23, 14, 23, 0);
            ctx.bezierCurveTo(23, -20, 0, -8, 0, 4);
            ctx.closePath();

            ctx.fillStyle = '#ff0000';
            ctx.fill();

            ctx.lineWidth = 2.5;
            ctx.strokeStyle = '#ff3333';
            ctx.stroke();

            if (Math.abs(scaleX) > 0.3) {
                ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(-8, -2, 4, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    }
