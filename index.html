    // --- DUAL-ZONE FLOATING TOUCH CONTROLS ---

    function handleTouchStart(e) {
        e.preventDefault();
        SoundFX.init();
        isMobileDevice = true;

        const halfWidth = canvas.width / 2;

        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const pos = getCanvasCoords(touch.clientX, touch.clientY);

            if (pos.x < halfWidth && moveStick.touchId === null) {
                moveStick.touchId = touch.identifier;
                moveStick.active = true;
                moveStick.baseX = pos.x;
                moveStick.baseY = pos.y;
                moveStick.stickX = pos.x;
                moveStick.stickY = pos.y;
                updateMoveStick(pos.x, pos.y);
            }
            else if (pos.x >= halfWidth && psychicStick.touchId === null) {
                psychicStick.touchId = touch.identifier;
                psychicStick.active = true;
                psychicStick.baseX = pos.x;
                psychicStick.baseY = pos.y;
                psychicStick.stickX = pos.x;
                psychicStick.stickY = pos.y;
                psychicStick.distanceRatio = 0;
                updatePsychicStick(pos.x, pos.y);
            }
        }
    }

    function updateMoveStick(touchX, touchY) {
        const dx = touchX - moveStick.baseX;
        const dy = touchY - moveStick.baseY;
        const dist = Math.hypot(dx, dy);
        const maxDist = moveStick.baseRadius;

        const clampedDist = Math.min(dist, maxDist);
        moveStick.stickX = moveStick.baseX + (dist === 0 ? 0 : (dx / dist) * clampedDist);
        moveStick.stickY = moveStick.baseY + (dist === 0 ? 0 : (dy / dist) * clampedDist);

        if (dist > moveStick.deadzone) {
            const nx = dx / dist;
            const ny = dy / dist;

            keys.a = nx < -0.32;
            keys.d = nx > 0.32;
            keys.w = ny < -0.45;
        } else {
            keys.a = false;
            keys.d = false;
            keys.w = false;
        }
    }

    function updatePsychicStick(touchX, touchY) {
        const dx = touchX - psychicStick.baseX;
        const dy = touchY - psychicStick.baseY;
        const dist = Math.hypot(dx, dy);
        const maxDist = psychicStick.baseRadius;

        psychicStick.angle = Math.atan2(dy, dx);
        psychicStick.distanceRatio = Math.min(1, dist / maxDist);

        const clampedDist = Math.min(dist, maxDist);
        psychicStick.stickX = psychicStick.baseX + (dist === 0 ? 0 : (dx / dist) * clampedDist);
        psychicStick.stickY = psychicStick.baseY + (dist === 0 ? 0 : (dy / dist) * clampedDist);

        if (player && !player.isDying) {
            const maxGrabRadius = 450;
            const targetDistance = psychicStick.distanceRatio * maxGrabRadius;
            mouse.x = player.body.position.x + Math.cos(psychicStick.angle) * targetDistance;
            mouse.y = player.body.position.y + Math.sin(psychicStick.angle) * targetDistance;
            mouse.isDown = psychicStick.distanceRatio > 0.08;
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const pos = getCanvasCoords(touch.clientX, touch.clientY);

            if (touch.identifier === moveStick.touchId) {
                updateMoveStick(pos.x, pos.y);
            } else if (touch.identifier === psychicStick.touchId) {
                updatePsychicStick(pos.x, pos.y);
            }
        }
    }

    function handleTouchEnd(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];

            if (touch.identifier === moveStick.touchId) {
                moveStick.touchId = null;
                moveStick.active = false;
                moveStick.stickX = moveStick.baseX;
                moveStick.stickY = moveStick.baseY;
                keys.a = false;
                keys.d = false;
                keys.w = false;
            } else if (touch.identifier === psychicStick.touchId) {
                psychicStick.touchId = null;
                psychicStick.active = false;
                psychicStick.stickX = psychicStick.baseX;
                psychicStick.stickY = psychicStick.baseY;
                psychicStick.distanceRatio = 0;
                mouse.isDown = false;
                if (player) {
                    player.releaseGrip(true);
                }
            }
        }
    }

    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    // --- COLLISIONS & DAMAGE ---
    
    function applyKnockback(targetBody, sourceBody, forceMultiplier) {
        const dir = Vector.normalise(Vector.sub(targetBody.position, sourceBody.position));
        dir.y = -Math.abs(dir.y || 1) - 0.7;
        const force = Vector.mult(Vector.normalise(dir), forceMultiplier);
        Body.applyForce(targetBody, targetBody.position, force);
    }

    function applyPlayerHurtKnockback(attackerBody) {
        const dirX = player.body.position.x >= attackerBody.position.x ? 1 : -1;
        Body.setVelocity(player.body, {
            x: dirX * 12,
            y: -14
        });
    }

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach((pair) => {
            handleCollision(pair.bodyA, pair.bodyB, pair, true);
        });
    });

    Events.on(engine, 'collisionActive', (event) => {
        event.pairs.forEach((pair) => {
            handleCollision(pair.bodyA, pair.bodyB, pair, false);
        });
    });

    Events.on(engine, 'collisionEnd', (event) => {
        event.pairs.forEach((pair) => {
            if (player && (pair.bodyA === player.body || pair.bodyB === player.body)) {
                const other = pair.bodyA === player.body ? pair.bodyB : pair.bodyA;
                if (player.body.position.y < other.position.y) {
                    player.canJump = false;
                }
            }
        });
    });

    function handleCollision(bodyA, bodyB, pair, isStart) {
        const entA = bodyA.entity;
        const entB = bodyB.entity;

        const checkGroundContact = (playerBody, otherBody) => {
            if (otherBody.isSensor) return false;
            if (playerBody.position.y >= otherBody.position.y - 15) return false;
            if (pair && pair.collision && pair.collision.normal) {
                const ny = Math.abs(pair.collision.normal.y);
                if (ny < 0.5) return false;
            }
            return true;
        };

        if (entA && (bodyB.isGround || bodyB.isStatic)) {
            entA.canBeGrabbed = true;
            if (entA.type === 'bone' && !entA.isFadingOnGround) {
                entA.isFadingOnGround = true;
            }
        }
        if (entB && (bodyA.isGround || bodyA.isStatic)) {
            entB.canBeGrabbed = true;
            if (entB.type === 'bone' && !entB.isFadingOnGround) {
                entB.isFadingOnGround = true;
            }
        }

        if (entA === player && checkGroundContact(bodyA, bodyB)) player.canJump = true;
        if (entB === player && checkGroundContact(bodyB, bodyA)) player.canJump = true;

        checkThrownImpact(bodyA, bodyB, entA, entB, isStart);

        if (entA && entB) {
            if ((entA.type === 'box' && entB.type === 'player') || (entB.type === 'box' && entA.type === 'player')) {
                return;
            }

            if (entA.type === 'slime' && entB.type === 'player' && isStart) {
                if (player.invulnerableTimer <= 0) {
                    const dmg = entA.tier === 0 ? 10 : (entA.isBoss ? 35 : 15 + entA.tier * 5);
                    player.takeDamage(dmg, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                }
                if (entA.tier === 0) entA.explode();
            }
            if (entB.type === 'slime' && entA.type === 'player' && isStart) {
                if (player.invulnerableTimer <= 0) {
                    const dmg = entB.tier === 0 ? 10 : (entB.isBoss ? 35 : 15 + entB.tier * 5);
                    player.takeDamage(dmg, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                }
                if (entB.tier === 0) entB.explode();
            }
            
            const relSpeed = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));
            if (entA.type === 'slime' && entA.tier === 0 && bodyA.isThrown && isStart && relSpeed > 10) entA.explode();
            if (entB.type === 'slime' && entB.tier === 0 && bodyB.isThrown && isStart && relSpeed > 10) entB.explode();

            if (entA && entA.type === 'heart' && entB && entB.type === 'player') {
                entA.collect(entB);
                return;
            }
            if (entB && entB.type === 'heart' && entA && entA.type === 'player') {
                entB.collect(entA);
                return;
            }

            // Boss Spike vs Player
            if (entA && entA.isBossSpike && entB && entB.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(20, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                    entA.die();
                }
            }
            if (entB && entB.isBossSpike && entA && entA.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(20, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                    entB.die();
                }
            }

            if (entA.type === 'zombie' && entB.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(20, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                }
            }
            if (entB.type === 'zombie' && entA.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(20, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                }
            }

            if (entA.type === 'golem' && entB.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(30, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                }
            }
            if (entB.type === 'golem' && entA.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(30, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                }
            }

            if ((entA.type === 'spike_boss' || entA.type === 'flail') && entB.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(20, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                }
            }
            if ((entB.type === 'spike_boss' || entB.type === 'flail') && entA.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(20, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                }
            }

            if (entA.type === 'maw' && entB.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(25, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                    SoundFX.playChomp();
                }
            }
            if (entB.type === 'maw' && entA.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(25, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                    SoundFX.playChomp();
                }
            }

            if (entA.type === 'skeleton' && entB.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(7, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                }
            }
            if (entB.type === 'skeleton' && entA.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(7, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                }
            }

            if (entA.type === 'bone' && entB.type === 'player') {
                const isFlying = Math.hypot(bodyA.velocity.x, bodyA.velocity.y) > 6 || bodyA.isThrown;
                if (player.invulnerableTimer <= 0 && isFlying) {
                    player.takeDamage(10, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                    entA.breakBone();
                }
            }
            if (entB.type === 'bone' && entA === player) {
                const isFlying = Math.hypot(bodyB.velocity.x, bodyB.velocity.y) > 6 || bodyB.isThrown;
                if (player.invulnerableTimer <= 0 && isFlying) {
                    player.takeDamage(10, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                    entB.breakBone();
                }
            }

            if (entA.type === 'bone' && entB.type === 'skeleton') {
                const isFlying = Math.hypot(bodyA.velocity.x, bodyA.velocity.y) > 6 || bodyA.isThrown;
                const isOwnerImmune = entA.owner === entB && entA.ownerGraceTicks > 0 && !bodyA.isThrown;
                if (isFlying && !isOwnerImmune && (bodyA.isThrown || entA.owner !== entB || entA.ownerGraceTicks <= 0)) {
                    entB.takeDamage(10, bodyA);
                    entA.breakBone();
                }
            }
            if (entB.type === 'bone' && entA.type === 'skeleton') {
                const isFlying = Math.hypot(bodyB.velocity.x, bodyB.velocity.y) > 6 || bodyB.isThrown;
                const isOwnerImmune = entB.owner === entA && entB.ownerGraceTicks > 0 && !bodyB.isThrown;
                if (isFlying && !isOwnerImmune && (bodyB.isThrown || entB.owner !== entA || entB.ownerGraceTicks <= 0)) {
                    entA.takeDamage(10, bodyB);
                    entB.breakBone();
                }
            }

            if (isStart) {
                if ((entA.type === 'bomb' && bodyA.isThrown) ||
                    (entB.type === 'bomb' && bodyB.isThrown)) {
                    if (entA.type === 'bomb') entA.explode();
                    if (entB.type === 'bomb') entB.explode();
                }
            }
        }
    }

    function checkThrownImpact(bodyA, bodyB, entA, entB, isStart) {
        if (!isStart) return;

        // Kinetic dampening: Thrown objects shed 15% velocity on impact
        if (entA && bodyA.isThrown && entA.type !== 'slime') {
            Matter.Body.setVelocity(bodyA, { x: bodyA.velocity.x * 0.85, y: bodyA.velocity.y * 0.85 });
        }
        if (entB && bodyB.isThrown && entB.type !== 'slime') {
            Matter.Body.setVelocity(bodyB, { x: bodyB.velocity.x * 0.85, y: bodyB.velocity.y * 0.85 });
        }
        
        if ((entA && entA.type === 'heart') || (entB && entB.type === 'heart')) return;

        const relVel = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));
        const MINOR_VELOCITY_THRESHOLD = 6;
        const HIGH_VELOCITY_THRESHOLD = 15;

        // STAGE 2 BOSS SPIKES (Flung by player into Boss)
        if (entA && entA.isBossSpike && (bodyA.isThrown || entA.playerOwned) && entB && entB.type === 'spike_boss' && entB.bossStage === 2) {
            entB.hitCooldown = 0;
            entB.takeDamage(1, bodyA);
            entA.die();
            return;
        }
        if (entB && entB.isBossSpike && (bodyB.isThrown || entB.playerOwned) && entA && entA.type === 'spike_boss' && entA.bossStage === 2) {
            entA.hitCooldown = 0;
            entA.takeDamage(1, bodyB);
            entB.die();
            return;
        }

        // STAGE 3 BOSS GROUND SLAMS (Damage Boss strictly when slammed into static environment)
        if (entA && entA.type === 'spike_boss' && entA.bossStage === 3 && entA.state === 'stage3_stuck') {
            if (bodyB.isStatic && bodyA.isThrown && relVel > 5.0) {
                entA.hitCooldown = 0;
                entA.takeDamage(1, bodyB);
                return;
            }
        }
        if (entB && entB.type === 'spike_boss' && entB.bossStage === 3 && entB.state === 'stage3_stuck') {
            if (bodyA.isStatic && bodyB.isThrown && relVel > 5.0) {
                entB.hitCooldown = 0;
                entB.takeDamage(1, bodyA);
                return;
            }
        }

        if (entA && entA.type === 'bone' && (bodyA.isThrown || Math.hypot(bodyA.velocity.x, bodyA.velocity.y) > 7)) {
            if (entB && entB.type !== 'bone') {
                if (entB.type === 'skeleton' && entA.owner === entB && entA.ownerGraceTicks > 0 && !bodyA.isThrown) return;
                entB.takeDamage(10, bodyA);
                entA.breakBone();
                return;
            }
        }
        if (entB && entB.type === 'bone' && (bodyB.isThrown || Math.hypot(bodyB.velocity.x, bodyB.velocity.y) > 7)) {
            if (entA && entA.type !== 'bone') {
                if (entA.type === 'skeleton' && entB.owner === entA && entB.ownerGraceTicks > 0 && !bodyB.isThrown) return;
                entA.takeDamage(10, bodyB);
                entB.breakBone();
                return;
            }
        }

        if (entA && entA.type === 'bomb') {
            if (entA.flungByPlayer && bodyA.isThrown && relVel > HIGH_VELOCITY_THRESHOLD) {
                entA.explode();
                return;
            }
        }
        if (entB && entB.type === 'bomb') {
            if (entB.flungByPlayer && bodyB.isThrown && relVel > HIGH_VELOCITY_THRESHOLD) {
                entB.explode();
                return;
            }
        }

        if (relVel <= MINOR_VELOCITY_THRESHOLD) return;

        let baseDmg = 0;
        if (relVel < HIGH_VELOCITY_THRESHOLD) {
            baseDmg = (relVel - MINOR_VELOCITY_THRESHOLD) * 0.7 + 2;
        } else {
            baseDmg = 8 + (relVel - HIGH_VELOCITY_THRESHOLD) * 1.8;
        }

        if (entA && entB) {
            const hasPlayer = entA.type === 'player' || entB.type === 'player';
            const hasBox = entA.type === 'box' || entB.type === 'box';
            if (hasPlayer && hasBox) {
                if (relVel > 9) {
                    if (entA.type === 'box') entA.takeDamage(1, bodyB);
                    if (entB.type === 'box') entB.takeDamage(1, bodyA);
                }
                return;
            }

            if (bodyA.isThrown || bodyB.isThrown) {
                const weightA = entA.weight || 1.0;
                const weightB = entB.weight || 1.0;
                
                entA.takeDamage(baseDmg * Math.sqrt(weightB), bodyB);
                entB.takeDamage(baseDmg * Math.sqrt(weightA), bodyA);
                
                applyKnockback(entA.body, entB.body, 0.04 * weightB);
                applyKnockback(entB.body, entA.body, 0.04 * weightA);
            }
        } else {
            if (entA) {
                if (entA.type === 'box') {
                    if (relVel > HIGH_VELOCITY_THRESHOLD) entA.takeDamage(1, bodyB);
                } else if (entA.type === 'bone' && (bodyA.isThrown || entA.isBoomerang) && relVel > 16) {
                    entA.breakBone();
                } else if (bodyA.isThrown) {
                    entA.takeDamage(baseDmg, bodyB);
                }
            }
            if (entB) {
                if (entB.type === 'box') {
                    if (relVel > HIGH_VELOCITY_THRESHOLD) entB.takeDamage(1, bodyA);
                } else if (entB.type === 'bone' && (bodyB.isThrown || entB.isBoomerang) && relVel > 16) {
                    entB.breakBone();
                } else if (bodyB.isThrown) {
                    entB.takeDamage(baseDmg, bodyA);
                }
            }
        }
    }

    Events.on(engine, 'beforeUpdate', () => {
        entities.forEach(e => {
            if (e.body.isThrown) {
                if (Math.abs(e.body.velocity.y) < 2.0 && e.type !== 'slime') {
                    Matter.Body.setVelocity(e.body, { x: e.body.velocity.x * 0.85, y: e.body.velocity.y });
                }
                if (e.body.speed < 2.5) {
                    e.body.isThrown = false;
                }
            } else if (e.type === 'zombie' || e.type === 'golem' || e.type === 'skeleton' || e.type === 'maw') {
                if (Math.abs(e.body.velocity.x) > 3.0 && Math.abs(e.body.velocity.y) < 1.5) {
                    Matter.Body.setVelocity(e.body, { x: e.body.velocity.x * 0.85, y: e.body.velocity.y });
                }
            }
        });
    });

    // --- DRAWING & RENDER LOOP ---

    function drawStatic() {
        ctx.fillStyle = '#32CD32'; 
        ctx.fillRect(0, 900, 1440, 60); 

        for (let i = 0; i < breakablePlatforms.length; i++) {
            let plat = breakablePlatforms[i];
            if (!plat.isBroken) {
                ctx.save();
                if (plat.isRestoring) {
                    plat.restoreAlpha += 0.02;
                    if (plat.restoreAlpha >= 1) {
                        plat.restoreAlpha = 1;
                        plat.isRestoring = false;
                    }
                    ctx.globalAlpha = plat.restoreAlpha;
                }
                ctx.fillStyle = '#8B4513'; 
                ctx.fillRect(plat.position.x - plat.origW / 2, plat.position.y - plat.origH / 2, plat.origW, plat.origH);
                ctx.restore();
            }
        }
    }

    function drawOnScreenControls() {
        if (!isMobileDevice) return;

        ctx.save();

        const ms = moveStick;
        const mAlpha = ms.active ? 0.75 : 0.28;

        ctx.beginPath();
        ctx.arc(ms.baseX, ms.baseY, ms.baseRadius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(17, 24, 39, ${mAlpha * 0.5})`;
        ctx.fill();
        ctx.lineWidth = 3.5;
        ctx.strokeStyle = ms.active ? 'rgba(168, 85, 247, 0.9)' : 'rgba(168, 85, 247, 0.4)';
        ctx.stroke();

        ctx.strokeStyle = 'rgba(216, 180, 254, 0.2)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(ms.baseX - ms.baseRadius * 0.6, ms.baseY);
        ctx.lineTo(ms.baseX + ms.baseRadius * 0.6, ms.baseY);
        ctx.moveTo(ms.baseX, ms.baseY - ms.baseRadius * 0.6);
        ctx.lineTo(ms.baseX, ms.baseY + ms.baseRadius * 0.6);
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ms.stickX, ms.stickY, ms.handleRadius, 0, Math.PI * 2);
        ctx.fillStyle = ms.active ? 'rgba(147, 51, 234, 0.75)' : 'rgba(147, 51, 234, 0.35)';
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = ms.active ? '#ffffff' : 'rgba(216, 180, 254, 0.6)';
        ctx.stroke();

        ctx.font = 'bold 18px Inter';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('MOVE', ms.stickX, ms.stickY);

        const ps = psychicStick;
        const pAlpha = ps.active ? 0.85 : 0.3;

        ctx.beginPath();
        ctx.arc(ps.baseX, ps.baseY, ps.baseRadius, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(17, 24, 39, ${pAlpha * 0.5})`;
        ctx.fill();
        ctx.lineWidth = 4;
        ctx.strokeStyle = ps.active ? 'rgba(217, 70, 239, 0.95)' : 'rgba(217, 70, 239, 0.45)';
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ps.baseX, ps.baseY, ps.baseRadius * 0.55, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(240, 171, 252, 0.25)';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(ps.stickX, ps.stickY, ps.handleRadius, 0, Math.PI * 2);
        ctx.fillStyle = ps.active ? 'rgba(192, 38, 211, 0.85)' : 'rgba(192, 38, 211, 0.4)';
        ctx.fill();
        ctx.lineWidth = 4.5;
        ctx.strokeStyle = ps.active ? '#ffffff' : 'rgba(245, 208, 254, 0.75)';
        ctx.stroke();

        ctx.font = 'bold 19px Inter';
        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText('PSI', ps.stickX, ps.stickY);

        ctx.restore();
    }

    function drawUI() {
        drawOnScreenControls();

        // Top-Right Wave Information Box
        ctx.save();
        const infoBoxW = 240;
        const infoBoxH = 88;
        const infoBoxX = 1440 - infoBoxW - 20;
        const infoBoxY = 20;

        ctx.fillStyle = 'rgba(15, 23, 42, 0.82)';
        ctx.beginPath();
        ctx.roundRect(infoBoxX, infoBoxY, infoBoxW, infoBoxH, 16);
        ctx.fill();

        ctx.strokeStyle = 'rgba(168, 85, 247, 0.75)';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.textAlign = 'center';

        ctx.font = '900 36px Inter';
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = 'rgba(168, 85, 247, 0.8)';
        ctx.shadowBlur = 12;
        ctx.fillText(`WAVE ${wave}`, infoBoxX + infoBoxW / 2, infoBoxY + 40);

        ctx.shadowBlur = 0;
        ctx.font = 'bold 22px Inter';
        ctx.fillStyle = livingEnemiesCount > 0 ? '#f87171' : '#4ade80';
        ctx.fillText(`Enemies: ${livingEnemiesCount}`, infoBoxX + infoBoxW / 2, infoBoxY + 72);

        ctx.restore();

        if (waveBannerTimer > 0) {
            waveBannerTimer--;
            const progress = (WAVE_BANNER_DURATION - waveBannerTimer) / WAVE_BANNER_DURATION;
            let alpha = 0;

            if (progress < 0.2) {
                alpha = progress / 0.2;
            } else if (progress < 0.7) {
                alpha = 1.0;
            } else {
                alpha = Math.max(0, (1.0 - progress) / 0.3);
            }

            if (waveBannerTimer === 0 && isWavePendingSpawn) {
                spawnWave();
            }

            const scale = 1.0 + (1.0 - progress) * 0.15;
            const currentCfg = WAVE_CONFIGS[wave] || { title: "ENDLESS HORDE" };

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2 - 40);
            ctx.scale(scale, scale);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.globalAlpha = alpha;

            ctx.shadowColor = '#a020f0';
            ctx.shadowBlur = 35;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.65)';
            ctx.beginPath();
            ctx.roundRect(-290, -65, 580, 130, 24);
            ctx.fill();

            ctx.strokeStyle = '#b946ff';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.font = '900 64px Inter';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`WAVE ${wave}`, 0, -8);

            ctx.font = '700 22px Inter';
            ctx.fillStyle = '#e9d5ff';
            ctx.shadowBlur = 10;
            ctx.fillText(currentCfg.title || 'SURVIVE THE HORDE', 0, 36);

            ctx.restore();
        }
    }

    function gameLoop() {
        if (!isLooping) return;
        requestAnimationFrame(gameLoop);
        
        if (isPaused) return;

        if (gameStarted) {
            // Check if Time Warp slow motion is active
            let isTimeWarpActive = false;
            for (let i = 0; i < entities.length; i++) {
                if (entities[i].type === 'spike_boss' && entities[i].isSloMo) {
                    isTimeWarpActive = true;
                    break;
                }
            }

            // TRUE SLOW MOTION: Slow down the physics engine integration to 20% speed
            const timeScale = isTimeWarpActive ? 0.20 : 1.0;
            Engine.update(engine, (1000 / 60) * timeScale);

            // Steve is immune to the time-warp: we update player separately if time is dilated
            if (isTimeWarpActive && player && !player.isDying) {
                // Compensate player movement velocity so Steve moves at full normal speed
                player.update();
            }

            if (!player || !player.isDying) {
                let enemyCount = 0;

                for (let i = entities.length - 1; i >= 0; i--) {
                    const e = entities[i];
                    if (e.markedForDeletion) {
                        Composite.remove(engine.world, e.body);
                        entities.splice(i, 1);
                        continue;
                    }

                    if (!e.isDying) {
                        // Skip updating player twice in time-warp
                        if (!(isTimeWarpActive && e === player)) {
                            e.update();
                        }

                        const hasGrace = (e.spawnGraceTimer && e.spawnGraceTimer > 0) || e.isEntering;
                        if (e.body && (!hasGrace && e.body.position.y > 1050) || isNaN(e.body.position.x)) {
                            e.die();
                            continue;
                        }

                        if ((e.type === 'slime' || e.type === 'zombie' || e.type === 'golem' || e.type === 'maw' || e.type === 'spike_boss' || e.type === 'skeleton') && e.hp > 0) {
                            enemyCount++;
                        }
                    }
                }

                livingEnemiesCount = enemyCount;

                if (livingEnemiesCount === 0 && !isWavePendingSpawn) {
                    waveTimer++;
                    if (waveTimer === 1) {
                        if (wave % 3 === 0) {
                            const heartX = 720 + (Math.random() - 0.5) * 160;
                            new HealingHeart(heartX, 360);
                        }
                        if (wave === 15) {
                            restoreBrokenPlatforms();
                        }
                    }
                    if (waveTimer > 90) {
                        wave++;
                        prepareWave();
                    }
                } else if (livingEnemiesCount > 0) {
                    waveTimer = 0;
                }
            }
        }

        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            if (p.life <= 0) particles.splice(i, 1);
        }

        for (let i = collapsingSkeletons.length - 1; i >= 0; i--) {
            const cs = collapsingSkeletons[i];
            cs.update();
            if (cs.life <= 0) collapsingSkeletons.splice(i, 1);
        }

        ctx.save();
        
        if (shakeAmount > 0) {
            const dx = (Math.random() - 0.5) * shakeAmount;
            const dy = (Math.random() - 0.5) * shakeAmount;
            ctx.translate(dx, dy);
            shakeAmount *= 0.9;
            if (shakeAmount < 0.5) shakeAmount = 0;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawStatic();
        
        let playerRef = null;
        let isTimeWarp = false;
        
        for (let i = 0; i < entities.length; i++) {
            const e = entities[i];
            if (e.type === 'spike_boss' && e.isSloMo) {
                isTimeWarp = true;
            }
        }

        // Draw Ultra-Cool Layered Slow-Motion Psychic Aura around every surrounding object/entity
        if (isTimeWarp && player && !player.isDying) {
            ctx.save();
            const now = Date.now();
            const t = now / 200;

            entities.forEach(ent => {
                if (ent === player || ent.isDying || ent.markedForDeletion) return;
                const epos = ent.body.position;
                const r = ent.radius || ent.body.circleRadius || (ent.weight * 16) || 28;
                
                ctx.save();
                ctx.translate(epos.x, epos.y);

                // Deep glowing chromatic backdrop
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 24 + Math.sin(t * 1.5) * 8;

                // Outer pulsing psychic halo
                const pulseR1 = r + 10 + Math.sin(t * 2) * 5;
                ctx.strokeStyle = 'rgba(168, 85, 247, 0.6)';
                ctx.lineWidth = 2.5;
                ctx.beginPath();
                ctx.arc(0, 0, pulseR1, 0, Math.PI * 2);
                ctx.stroke();

                // Inner rotating psychic runes/orbit points
                ctx.strokeStyle = 'rgba(216, 180, 254, 0.4)';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(0, 0, r + 5, 0, Math.PI * 2);
                ctx.stroke();

                const orbitCount = 3;
                for (let k = 0; k < orbitCount; k++) {
                    const ang = t + (k * (Math.PI * 2 / orbitCount));
                    const ox = Math.cos(ang) * (r + 8);
                    const oy = Math.sin(ang) * (r + 8);
                    ctx.fillStyle = '#f0abfc';
                    ctx.beginPath();
                    ctx.arc(ox, oy, 2.5, 0, Math.PI * 2);
                    ctx.fill();
                }

                ctx.restore();
            });
            ctx.restore();
        }

        for (let i = 0; i < entities.length; i++) {
            const e = entities[i];
            if (e.type === 'player') {
                playerRef = e;
            } else {
                e.draw(ctx);
            }
        }

        if (playerRef) {
            playerRef.draw(ctx);
        }

        for (let i = 0; i < collapsingSkeletons.length; i++) {
            collapsingSkeletons[i].draw(ctx);
        }
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].draw(ctx);
        }

        // Stage 2 Time Warp: Pure wavy border lines with glowing purple light
        if (isTimeWarp && player && !player.isDying) {
            ctx.save();
            const now = Date.now();
            const waveTime = now / 140;
            const w = canvas.width;
            const h = canvas.height;
            const borderInset = 20;

            ctx.shadowColor = '#c084fc';
            ctx.shadowBlur = 18 + Math.sin(now / 150) * 8;
            ctx.strokeStyle = `rgba(192, 132, 252, ${0.75 + Math.sin(now / 120) * 0.25})`;
            ctx.lineWidth = 4.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            // Top wavy border
            ctx.beginPath();
            for (let x = borderInset; x <= w - borderInset; x += 15) {
                const waveY = borderInset + Math.sin(x * 0.02 + waveTime) * 9;
                if (x === borderInset) ctx.moveTo(x, waveY);
                else ctx.lineTo(x, waveY);
            }
            ctx.stroke();

            // Bottom wavy border
            ctx.beginPath();
            for (let x = borderInset; x <= w - borderInset; x += 15) {
                const waveY = (h - borderInset) + Math.sin(x * 0.02 + waveTime + 1.5) * 9;
                if (x === borderInset) ctx.moveTo(x, waveY);
                else ctx.lineTo(x, waveY);
            }
            ctx.stroke();

            // Left wavy border
            ctx.beginPath();
            for (let y = borderInset; y <= h - borderInset; y += 15) {
                const waveX = borderInset + Math.cos(y * 0.02 + waveTime) * 9;
                if (y === borderInset) ctx.moveTo(waveX, y);
                else ctx.lineTo(waveX, y);
            }
            ctx.stroke();

            // Right wavy border
            ctx.beginPath();
            for (let y = borderInset; y <= h - borderInset; y += 15) {
                const waveX = (w - borderInset) + Math.cos(y * 0.02 + waveTime + 1.5) * 9;
                if (y === borderInset) ctx.moveTo(waveX, y);
                else ctx.lineTo(waveX, y);
            }
            ctx.stroke();

            // Secondary subtle outer glow wave
            ctx.strokeStyle = 'rgba(217, 70, 239, 0.45)';
            ctx.lineWidth = 2.5;
            ctx.beginPath();
            for (let x = borderInset + 8; x <= w - borderInset - 8; x += 15) {
                const waveY = borderInset + 8 + Math.cos(x * 0.025 - waveTime) * 6;
                if (x === borderInset + 8) ctx.moveTo(x, waveY);
                else ctx.lineTo(x, waveY);
            }
            ctx.stroke();

            ctx.beginPath();
            for (let x = borderInset + 8; x <= w - borderInset - 8; x += 15) {
                const waveY = (h - borderInset - 8) + Math.cos(x * 0.025 - waveTime + 2) * 6;
                if (x === borderInset + 8) ctx.moveTo(x, waveY);
                else ctx.lineTo(x, waveY);
            }
            ctx.stroke();

            ctx.restore();
        }

        if (player && player.isDying) {
            playerDeathFade = Math.min(0.65, playerDeathFade + 0.015);
            ctx.fillStyle = `rgba(0, 0, 0, ${playerDeathFade})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (playerDeathFade >= 0.65) {
                document.getElementById('game-over-box').style.display = 'block';
                document.getElementById('wave-reached').innerText = `You reached Wave ${finalWaveReached}`;
            }
        }

        ctx.restore();

        if (gameStarted) {
            drawUI();
        }
    }

    initGame();
    gameLoop();

</script>
