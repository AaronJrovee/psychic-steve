                activeTouches.set(touch.identifier, { type: 'direct_psychic' });
            }
        }
    }

    function updatePsychicJoystick(touchX, touchY) {
        const dx = touchX - psychicJoystick.baseX;
        const dy = touchY - psychicJoystick.baseY;
        const dist = Math.hypot(dx, dy);
        const maxDist = psychicJoystick.baseRadius;

        psychicJoystick.angle = Math.atan2(dy, dx);
        psychicJoystick.distanceRatio = Math.min(1, dist / maxDist);

        const clampedDist = Math.min(dist, maxDist);
        psychicJoystick.stickX = psychicJoystick.baseX + (dist === 0 ? 0 : (dx / dist) * clampedDist);
        psychicJoystick.stickY = psychicJoystick.baseY + (dist === 0 ? 0 : (dy / dist) * clampedDist);

        if (player && !player.isDying) {
            const maxGrabRadius = 450;
            const targetDistance = psychicJoystick.distanceRatio * maxGrabRadius;
            mouse.x = player.body.position.x + Math.cos(psychicJoystick.angle) * targetDistance;
            mouse.y = player.body.position.y + Math.sin(psychicJoystick.angle) * targetDistance;
            mouse.isDown = psychicJoystick.distanceRatio > 0.05;
        }
    }

    function handleTouchMove(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const pos = getCanvasCoords(touch.clientX, touch.clientY);
            const binding = activeTouches.get(touch.identifier);

            if (!binding) continue;

            if (binding.type === 'joystick') {
                updatePsychicJoystick(pos.x, pos.y);
            } else if (binding.type === 'button') {
                // If dragged out of button radius, release
                const btn = onScreenButtons.find(b => b.id === binding.id);
                if (btn) {
                    const dist = Math.hypot(pos.x - btn.x, pos.y - btn.y);
                    if (dist > btn.r + 30) {
                        btn.active = false;
                        keys[btn.key] = false;
                    } else {
                        btn.active = true;
                        keys[btn.key] = true;
                    }
                }
            } else if (binding.type === 'direct_psychic') {
                mouse.x = pos.x;
                mouse.y = pos.y;
            }
        }
    }

    function handleTouchEnd(e) {
        e.preventDefault();
        for (let i = 0; i < e.changedTouches.length; i++) {
            const touch = e.changedTouches[i];
            const binding = activeTouches.get(touch.identifier);

            if (binding) {
                if (binding.type === 'button') {
                    const btn = onScreenButtons.find(b => b.id === binding.id);
                    if (btn) {
                        btn.active = false;
                        keys[btn.key] = false;
                    }
                } else if (binding.type === 'joystick') {
                    psychicJoystick.touchId = null;
                    psychicJoystick.active = false;
                    psychicJoystick.stickX = psychicJoystick.baseX;
                    psychicJoystick.stickY = psychicJoystick.baseY;
                    psychicJoystick.distanceRatio = 0;
                    mouse.isDown = false;
                    SoundFX.stopPsychicHum();
                    if (player) {
                        player.releaseGrip(true);
                    }
                } else if (binding.type === 'direct_psychic') {
                    activePsychicTouchId = null;
                    mouse.isDown = false;
                    SoundFX.stopPsychicHum();
                    if (player) {
                        player.releaseGrip(true);
                    }
                }
                activeTouches.delete(touch.identifier);
            }
        }
    }

    let activePsychicTouchId = null;

    canvas.addEventListener('touchstart', handleTouchStart, { passive: false });
    canvas.addEventListener('touchmove', handleTouchMove, { passive: false });
    canvas.addEventListener('touchend', handleTouchEnd, { passive: false });
    canvas.addEventListener('touchcancel', handleTouchEnd, { passive: false });

    // --- COLLISIONS & DAMAGE ---
    
    function applyKnockback(targetBody, sourceBody, forceMultiplier) {
        const dir = Vector.normalise(Vector.sub(targetBody.position, sourceBody.position));
        dir.y = -Math.abs(dir.y || 1) - 0.7;
        const force = Vector.mult(Vector.normalise(dir), forceMultiplier);
        Body.applyForce(targetBody, targetBody.position, force);
    }

    function applyPlayerHurtKnockback(attackerBody) {
        const dirX = player.body.position.x >= attackerBody.position.x ? 1 : -1;
        Body.setVelocity(player.body, {
            x: dirX * 12,
            y: -14
        });
    }

    Events.on(engine, 'collisionStart', (event) => {
        event.pairs.forEach((pair) => {
            handleCollision(pair.bodyA, pair.bodyB, pair, true);
        });
    });

    Events.on(engine, 'collisionActive', (event) => {
        event.pairs.forEach((pair) => {
            handleCollision(pair.bodyA, pair.bodyB, pair, false);
        });
    });

    function handleCollision(bodyA, bodyB, pair, isStart) {
        const entA = bodyA.entity;
        const entB = bodyB.entity;

        const checkGroundContact = (playerBody, otherBody) => {
            if (!otherBody.isStatic || !otherBody.isGround) return false;
            if (playerBody.position.y >= otherBody.position.y) return false;
            if (pair && pair.collision && pair.collision.normal) {
                const ny = Math.abs(pair.collision.normal.y);
                if (ny < 0.6) return false;
            }
            return true;
        };

        // Reset grabbable status when dropped entities touch static ground/platforms
        if (entA && (bodyB.isGround || bodyB.isStatic)) {
            entA.canBeGrabbed = true;
        }
        if (entB && (bodyA.isGround || bodyA.isStatic)) {
            entB.canBeGrabbed = true;
        }

        if (entA === player && checkGroundContact(bodyA, bodyB)) player.canJump = true;
        if (entB === player && checkGroundContact(bodyB, bodyA)) player.canJump = true;

        checkThrownImpact(bodyA, bodyB, entA, entB, isStart);

        if (entA && entB) {
            // Boxes never hurt the player
            if ((entA.type === 'box' && entB.type === 'player') || (entB.type === 'box' && entA.type === 'player')) {
                return;
            }

            // Slime touch player
            if (entA.type === 'slime' && entB.type === 'player' && isStart) {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(10, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                }
                entA.explode();
            }
            if (entB.type === 'slime' && entA.type === 'player' && isStart) {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(10, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                }
                entB.explode();
            }
            
            // Slimes explode if thrusted into another entity at speed
        const relSpeed = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));
        if (entA.type === 'slime' && bodyA.isThrown && isStart && relSpeed > 10) entA.explode();
        if (entB.type === 'slime' && bodyB.isThrown && isStart && relSpeed > 10) entB.explode();

        // Healing heart collection on touch with player
        if (entA && entA.type === 'heart' && entB && entB.type === 'player') {
            entA.collect(entB);
            return;
        }
        if (entB && entB.type === 'heart' && entA && entA.type === 'player') {
            entB.collect(entA);
            return;
        }

        // Zombie damage
        if (entA.type === 'zombie' && entB.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(20, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                }
            }
            if (entB.type === 'zombie' && entA.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(20, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                }
            }

            // Golem contact damage
            if (entA.type === 'golem' && entB.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(30, entA.body);
                    applyPlayerHurtKnockback(entA.body);
                }
            }
            if (entB.type === 'golem' && entA.type === 'player') {
                if (player.invulnerableTimer <= 0) {
                    player.takeDamage(30, entB.body);
                    applyPlayerHurtKnockback(entB.body);
                }
            }

            // Bomb collision with any entity when thrown or hit
            if (isStart) {
                if ((entA.type === 'bomb' && bodyA.isThrown) ||
                    (entB.type === 'bomb' && bodyB.isThrown)) {
                    if (entA.type === 'bomb') entA.explode();
                    if (entB.type === 'bomb') entB.explode();
                }
            }
        }
    }

    function checkThrownImpact(bodyA, bodyB, entA, entB, isStart) {
        if (!isStart) return;
        
        // Bombs detonating on surface/entity impacts ONLY when thrusted by player
        if (entA && entA.type === 'bomb' && bodyA.isThrown) {
            entA.explode();
            return;
        }
        if (entB && entB.type === 'bomb' && bodyB.isThrown) {
            entB.explode();
            return;
        }

        const relVel = Vector.magnitude(Vector.sub(bodyA.velocity, bodyB.velocity));
        const HIGH_VELOCITY_THRESHOLD = 11;
        if (relVel <= HIGH_VELOCITY_THRESHOLD) return;

        if (entA && entB) {
            const hasPlayer = entA.type === 'player' || entB.type === 'player';
            const hasBox = entA.type === 'box' || entB.type === 'box';
            if (hasPlayer && hasBox) {
                if (entA.type === 'box') entA.takeDamage(1, bodyB);
                if (entB.type === 'box') entB.takeDamage(1, bodyA);
                return;
            }

            // High speed collision between thrown objects/enemies - damage scales with weight!
            if (bodyA.isThrown || bodyB.isThrown) {
                const weightA = entA.weight || 1.0;
                const weightB = entB.weight || 1.0;
                const baseDmg = (relVel - HIGH_VELOCITY_THRESHOLD) * 2.2;
                
                // Damage dealt to B is boosted by A's weight, and vice versa
                entA.takeDamage(baseDmg * Math.sqrt(weightB), bodyB);
                entB.takeDamage(baseDmg * Math.sqrt(weightA), bodyA);
                
                applyKnockback(entA.body, entB.body, 0.05 * weightB);
                applyKnockback(entB.body, entA.body, 0.05 * weightA);
            }
        } else {
            // High speed collision with walls or floors
            const damage = (relVel - HIGH_VELOCITY_THRESHOLD) * 2.5;
            if (entA) {
                if (entA.type === 'box') entA.takeDamage(1, bodyB);
                else if (bodyA.isThrown) entA.takeDamage(damage, bodyB);
            }
            if (entB) {
                if (entB.type === 'box') entB.takeDamage(1, bodyA);
                else if (bodyB.isThrown) entB.takeDamage(damage, bodyA);
            }
        }
    }

    Events.on(engine, 'beforeUpdate', () => {
        entities.forEach(e => {
            if (e.body.isThrown && e.body.speed < 2) {
                e.body.isThrown = false;
            }
        });
    });

    // --- DRAWING & RENDER LOOP ---

    function drawStatic() {
        ctx.fillStyle = '#32CD32'; 
        ctx.fillRect(0, 900, 1440, 60); 

        // Extended 1st (left) and 3rd (right) panels stretching off past the side borders
        ctx.fillStyle = '#8B4513'; 
        ctx.fillRect(-240, 635, 660, 30); // Panel 1 (extended off-screen left to x=420)
        ctx.fillRect(520, 435, 400, 30);  // Panel 2 (center platform)
        ctx.fillRect(1020, 635, 660, 30); // Panel 3 (extended off-screen right from x=1020)
    }

    function drawOnScreenControls() {
        ctx.save();

        // 1. Draw Translucent Movement D-Pad (Enlarged)
        for (let btn of onScreenButtons) {
            ctx.beginPath();
            ctx.arc(btn.x, btn.y, btn.r, 0, Math.PI * 2);

            // Translucent glowing button fill
            ctx.fillStyle = btn.active ? 'rgba(168, 85, 247, 0.55)' : 'rgba(17, 24, 39, 0.4)';
            ctx.fill();

            ctx.lineWidth = 4;
            ctx.strokeStyle = btn.active ? 'rgba(240, 171, 252, 0.95)' : 'rgba(168, 85, 247, 0.55)';
            ctx.stroke();

            // Directional text/icon with larger font
            ctx.font = 'bold 36px Inter';
            ctx.fillStyle = btn.active ? '#ffffff' : 'rgba(255, 255, 255, 0.85)';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(btn.label, btn.x, btn.y + (btn.label === '▲' ? -2 : (btn.label === '▼' ? 3 : 0)));
        }

        // 2. Draw Translucent Mobile Psychic Joystick (Mobile only - Enlarged)
        if (isMobileDevice) {
            const j = psychicJoystick;

            // Outer Base Ring
            ctx.beginPath();
            ctx.arc(j.baseX, j.baseY, j.baseRadius, 0, Math.PI * 2);
            ctx.fillStyle = 'rgba(17, 24, 39, 0.38)';
            ctx.fill();
            ctx.lineWidth = 4.5;
            ctx.strokeStyle = j.active ? 'rgba(192, 38, 211, 0.9)' : 'rgba(168, 85, 247, 0.5)';
            ctx.stroke();

            // Concentric Range Guide Ring
            ctx.beginPath();
            ctx.arc(j.baseX, j.baseY, j.baseRadius * 0.5, 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(216, 180, 254, 0.25)';
            ctx.lineWidth = 2;
            ctx.stroke();

            // Joystick Handle Knob
            ctx.beginPath();
            ctx.arc(j.stickX, j.stickY, j.handleRadius, 0, Math.PI * 2);
            ctx.fillStyle = j.active ? 'rgba(168, 85, 247, 0.8)' : 'rgba(147, 51, 234, 0.5)';
            ctx.fill();
            ctx.lineWidth = 4;
            ctx.strokeStyle = j.active ? '#ffffff' : 'rgba(240, 171, 252, 0.85)';
            ctx.stroke();

            // Psychic spiral icon on stick handle
            ctx.font = 'bold 22px Inter';
            ctx.fillStyle = '#ffffff';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText('PSI', j.stickX, j.stickY);

            // Joystick Label
            ctx.font = '700 16px Inter';
            ctx.fillStyle = 'rgba(233, 213, 255, 0.8)';
            ctx.fillText('PSYCHIC JOYSTICK', j.baseX, j.baseY + j.baseRadius + 28);
        }

        ctx.restore();
    }

    function drawUI() {
        // Draw On-Screen Movement Controls and Psychic Joystick
        drawOnScreenControls();

        ctx.fillStyle = 'white';
        ctx.font = 'bold 32px Inter';
        ctx.textAlign = 'right';
        ctx.fillText(`WAVE ${wave}`, 1400, 40);
        
        ctx.font = '24px Inter';
        ctx.fillText(`Enemies: ${livingEnemiesCount}`, 1400, 75);
        ctx.textAlign = 'left';

        // Wave Announcement Banner
        if (waveBannerTimer > 0) {
            waveBannerTimer--;
            const progress = (WAVE_BANNER_DURATION - waveBannerTimer) / WAVE_BANNER_DURATION;
            let alpha = 0;

            if (progress < 0.2) {
                alpha = progress / 0.2;
            } else if (progress < 0.7) {
                alpha = 1.0;
            } else {
                alpha = Math.max(0, (1.0 - progress) / 0.3);
            }

            const scale = 1.0 + (1.0 - progress) * 0.15;

            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2 - 40);
            ctx.scale(scale, scale);
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.globalAlpha = alpha;

            ctx.shadowColor = '#a020f0';
            ctx.shadowBlur = 35;
            ctx.fillStyle = 'rgba(0, 0, 0, 0.55)';
            ctx.beginPath();
            ctx.roundRect(-260, -60, 520, 120, 24);
            ctx.fill();

            ctx.strokeStyle = '#b946ff';
            ctx.lineWidth = 4;
            ctx.stroke();

            ctx.font = '900 68px Inter';
            ctx.fillStyle = '#ffffff';
            ctx.fillText(`WAVE ${wave}`, 0, 0);

            ctx.font = '600 20px Inter';
            ctx.fillStyle = '#e9d5ff';
            ctx.shadowBlur = 10;
            ctx.fillText('SURVIVE THE HORDE', 0, 42);

            ctx.restore();
        }
    }

    function gameLoop() {
        if (!isLooping) return;
        requestAnimationFrame(gameLoop);

        if (gameStarted) {
            Engine.update(engine, 1000 / 60);

            let enemyCount = 0;

            // Single zero-allocation pass: update entities, prune dead ones, and count active enemies
            for (let i = entities.length - 1; i >= 0; i--) {
                const e = entities[i];
                if (e.markedForDeletion) {
                    Composite.remove(engine.world, e.body);
                    entities.splice(i, 1);
                    continue;
                }

                if (!e.isDying) {
                    e.update();

                    // Floor boundary check: auto-purge enemies that fell below the world floor
                    if (e.body && (e.body.position.y > 980 || isNaN(e.body.position.x))) {
                        e.die();
                        continue;
                    }

                    if ((e.type === 'slime' || e.type === 'zombie' || e.type === 'golem') && e.hp > 0) {
                        enemyCount++;
                    }
                }
            }

            livingEnemiesCount = enemyCount;

            if (livingEnemiesCount === 0) {
                waveTimer++;
                if (waveTimer === 1) {
                    // Spawn Healing Heart reward after clearing Wave 3, 6, or 9
                    if (wave === 3 || wave === 6 || wave === 9) {
                        const heartX = 720 + (Math.random() - 0.5) * 160;
                        new HealingHeart(heartX, 360);
                    }
                }
                if (waveTimer > 90) { // Transition to next wave within 1.5 seconds of clearing
                    wave++;
                    spawnWave();
                }
            } else {
                waveTimer = 0;
            }
        }

        // In-place particle updates without recreating the array each frame
        for (let i = particles.length - 1; i >= 0; i--) {
            const p = particles[i];
            p.update();
            if (p.life <= 0) {
                particles.splice(i, 1);
            }
        }

        ctx.save();
        
        if (shakeAmount > 0) {
            const dx = (Math.random() - 0.5) * shakeAmount;
            const dy = (Math.random() - 0.5) * shakeAmount;
            ctx.translate(dx, dy);
            shakeAmount *= 0.9;
            if (shakeAmount < 0.5) shakeAmount = 0;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        drawStatic();
        
        // Draw non-player entities first, then player on top (without per-frame array sorting)
        let playerRef = null;
        for (let i = 0; i < entities.length; i++) {
            const e = entities[i];
            if (e.type === 'player') {
                playerRef = e;
            } else {
                e.draw(ctx);
            }
        }
        if (playerRef) {
            playerRef.draw(ctx);
        }
        
        for (let i = 0; i < particles.length; i++) {
            particles[i].draw(ctx);
        }
        
        if (player && player.isDying) {
            playerDeathFade = Math.min(0.65, playerDeathFade + 0.015);
            ctx.fillStyle = `rgba(0, 0, 0, ${playerDeathFade})`;
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            
            if (playerDeathFade >= 0.65) {
                document.getElementById('game-over-box').style.display = 'block';
                document.getElementById('wave-reached').innerText = `You reached Wave ${wave}`;
            }
        }

        ctx.restore();

        if (gameStarted) {
            drawUI();
        }
    }

    // Launch game
    initGame();
    gameLoop();

</script>
