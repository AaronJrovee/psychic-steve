<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Psychic Steve</title>
    <!-- Tailwind for overlay styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js for 2D Physics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0b0f19;
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            touch-action: none;
        }
        #game-wrapper {
            position: relative;
            aspect-ratio: 1440 / 960;
            max-width: 100%;
            max-height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            background-color: #87CEEB; /* Sky blue */
            box-shadow: 0 0 35px rgba(0,0,0,0.7);
            width: 100%;
            height: 100%;
            display: block;
            cursor: crosshair;
            touch-action: none;
        }
        #ui-layer {
            position: absolute;
            inset: 0;
            pointer-events: none;
        }
        .message-box {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(17, 24, 39, 0.92);
            color: white;
            padding: 2.75rem 3.75rem;
            border-radius: 1.5rem;
            text-align: center;
            pointer-events: auto;
            border: 2px solid #a855f7;
            box-shadow: 0 0 35px rgba(168, 85, 247, 0.5);
            display: none;
        }
        #title-screen {
            position: absolute;
            inset: 0;
            background: rgba(10, 15, 29, 0.72);
            backdrop-filter: blur(6px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            pointer-events: auto;
            z-index: 50;
        }
        @keyframes pulseGlow {
            0%, 100% {
                transform: scale(1);
                box-shadow: 0 0 25px rgba(168, 85, 247, 0.65), 0 0 55px rgba(192, 38, 211, 0.4);
            }
            50% {
                transform: scale(1.06);
                box-shadow: 0 0 45px rgba(168, 85, 247, 0.95), 0 0 85px rgba(192, 38, 211, 0.65);
            }
        }
        .play-btn {
            background: linear-gradient(135deg, #9333ea, #c026d3);
            color: white;
            border: 3px solid rgba(243, 232, 255, 0.9);
            padding: 1.1rem 4.2rem;
            font-size: 2.2rem;
            font-weight: 900;
            letter-spacing: 0.15em;
            border-radius: 9999px;
            cursor: pointer;
            margin-top: 1.25rem;
            transition: transform 0.2s ease, filter 0.2s ease;
            animation: pulseGlow 2.2s infinite ease-in-out;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
        }
        .play-btn:hover {
            transform: scale(1.1) !important;
            filter: brightness(1.2);
            animation-play-state: paused;
            box-shadow: 0 0 60px rgba(216, 180, 254, 1), 0 0 95px rgba(192, 38, 211, 0.9);
        }
        .play-btn:active {
            transform: scale(1.02) !important;
        }
        .restart-btn {
            background: linear-gradient(135deg, #7c3aed, #9333ea);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.8);
            padding: 0.85rem 2.5rem;
            font-size: 1.25rem;
            font-weight: 700;
            border-radius: 9999px;
            cursor: pointer;
            margin-top: 1rem;
            transition: transform 0.15s ease, filter 0.15s ease;
        }
        .restart-btn:hover {
            transform: scale(1.05);
            filter: brightness(1.15);
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="game-wrapper">
        <canvas id="gameCanvas" width="1440" height="960"></canvas>
        
        <div id="ui-layer">
            <!-- Title Screen -->
            <div id="title-screen">
                <h1 class="text-7xl font-extrabold tracking-wider text-purple-400 drop-shadow-[0_0_30px_rgba(160,32,240,0.9)] mb-3">PSYCHIC STEVE</h1>
                <p class="text-lg text-purple-200 mb-1 font-medium">A / D or Arrows to Move • W or Up to Jump</p>
                <p class="text-xs text-purple-300 mb-4 tracking-wide">HOLD Left Mouse to channel psychic waves • Release to throw • Press [N] to Skip Wave</p>
                
                <!-- Difficulty Selector -->
                <div class="flex gap-4 mb-3" id="difficulty-selector">
                    <button id="btn-diff-easy" class="px-6 py-2 rounded-full font-bold text-white border-2 border-gray-500 bg-gray-800 opacity-60 hover:opacity-100 transition-all" onclick="setDifficulty('easy')">EASY</button>
                    <button id="btn-diff-normal" class="px-6 py-2 rounded-full font-bold text-white border-2 border-purple-400 bg-purple-600 transform scale-110 shadow-[0_0_15px_rgba(168,85,247,0.6)] transition-all" onclick="setDifficulty('normal')">NORMAL</button>
                    <button id="btn-diff-hard" class="px-6 py-2 rounded-full font-bold text-white border-2 border-gray-500 bg-gray-800 opacity-60 hover:opacity-100 transition-all" onclick="setDifficulty('hard')">HARD</button>
                </div>

                <button class="play-btn" onclick="startGame()">PLAY</button>
            </div>

            <!-- HUD Layer (Active Gameplay) -->
            <div id="hud-layer" style="display: none; position: absolute; top: 14px; right: 14px; pointer-events: auto;">
                <button id="pause-btn" class="bg-gray-900/80 border-2 border-purple-400 text-purple-200 rounded-full w-8 h-8 flex items-center justify-center text-sm font-bold hover:bg-purple-600 hover:text-white transition-all shadow-[0_0_10px_rgba(168,85,247,0.5)]" onclick="togglePause()">
                    ⏸
                </button>
            </div>

            <!-- Pause Screen -->
            <div id="pause-screen" class="message-box" style="z-index: 60;">
                <h1 class="text-5xl font-extrabold text-purple-400 mb-6 drop-shadow-md tracking-widest">PAUSED</h1>
                <button class="play-btn !text-xl !px-8 !py-3 !mt-0" onclick="togglePause()">RESUME</button>
            </div>

            <!-- Game Over Screen -->
            <div id="game-over-box" class="message-box">
                <h1 class="text-4xl font-extrabold text-red-500 mb-2 drop-shadow-md">YOU DIED</h1>
                <p id="wave-reached" class="text-xl mb-4 text-purple-200"></p>
                
                <!-- Difficulty Selector (Post-Death) -->
                <div class="flex gap-4 mb-6 justify-center" id="go-difficulty-selector">
                    <button id="go-btn-diff-easy" class="px-6 py-2 rounded-full font-bold text-white border-2 border-gray-500 bg-gray-800 opacity-60 hover:opacity-100 transition-all" onclick="setDifficulty('easy')">EASY</button>
                    <button id="go-btn-diff-normal" class="px-6 py-2 rounded-full font-bold text-white border-2 border-purple-400 bg-purple-600 transform scale-110 shadow-[0_0_15px_rgba(168,85,247,0.6)] transition-all" onclick="setDifficulty('normal')">NORMAL</button>
                    <button id="go-btn-diff-hard" class="px-6 py-2 rounded-full font-bold text-white border-2 border-gray-500 bg-gray-800 opacity-60 hover:opacity-100 transition-all" onclick="setDifficulty('hard')">HARD</button>
                </div>

                <button class="restart-btn" onclick="resetGame()">Play Again</button>
            </div>
        </div>
    </div>
</div>

<script>
    // --- SYNTHESIZED SOUND EFFECTS & BGM (Web Audio API) ---
    const SoundFX = {
        ctx: null,
        bgmInterval: null,
        bgmStep: 0,
        isBgmPlaying: false,
        noiseBuf: null,

        init() {
            if (!this.ctx) {
                const AudioCtx = window.AudioContext || window.webkitAudioContext;
                this.ctx = new AudioCtx();
            }
            if (this.ctx && this.ctx.state === 'suspended') {
                this.ctx.resume();
            }
            if (this.ctx && !this.noiseBuf) {
                const sampleRate = this.ctx.sampleRate;
                const length = Math.floor(sampleRate * 0.15);
                this.noiseBuf = this.ctx.createBuffer(1, length, sampleRate);
                const data = this.noiseBuf.getChannelData(0);
                for (let i = 0; i < length; i++) {
                    data[i] = (Math.random() * 2 - 1) * Math.exp(-4 * (i / length));
                }
            }
        },

        startMusic() {
            if (!this.ctx || this.isBgmPlaying) return;
            this.isBgmPlaying = true;
            this.bgmStep = 0;

            const stepDuration = 60 / 138 / 4; 

            const bassline64 = [
                73.42, 73.42, 146.83, 73.42,  82.41, 73.42, 146.83, 73.42,
                73.42, 73.42, 146.83, 73.42,  87.31, 73.42, 110.00, 73.42,
                58.27, 58.27, 116.54, 58.27,  65.41, 58.27, 116.54, 58.27,
                58.27, 58.27, 116.54, 58.27,  77.78, 58.27, 116.54, 65.41,
                49.00, 49.00, 98.00,  49.00,  58.27, 49.00, 98.00,  49.00,
                49.00, 49.00, 98.00,  49.00,  65.41, 49.00, 87.31, 110.00,
                55.00, 55.00, 110.00, 55.00,  69.30, 55.00, 110.00, 55.00,
                55.00, 55.00, 110.00, 73.42,  82.41, 87.31, 110.00, 130.81
            ];

            const leadNotes64 = [
                293.66, 0, 293.66, 349.23, 0, 440.00, 0, 392.00,
                349.23, 0, 293.66, 0,      261.63, 0, 293.66, 0,
                466.16, 0, 466.16, 523.25, 0, 587.33, 0, 523.25,
                466.16, 0, 440.00, 0,      392.00, 0, 440.00, 0,
                392.00, 0, 349.23, 392.00, 0, 440.00, 0, 466.16,
                523.25, 0, 466.16, 440.00, 0, 392.00, 349.23, 0,
                440.00, 0, 440.00, 523.25, 0, 554.37, 0, 587.33,
                659.25, 0, 587.33, 554.37, 0, 440.00, 523.25, 0
            ];

            const chordPadProgression = [220.00, 174.61, 196.00, 220.00];

            this.bgmInterval = setInterval(() => {
                if (!this.ctx || !this.isBgmPlaying || this.ctx.state === 'suspended') return;
                const now = this.ctx.currentTime;
                const step = this.bgmStep % 64;
                const bar = Math.floor(step / 16);

                const isKick = (step % 4 === 0) || (step % 16 === 14 && bar % 2 === 1);
                if (isKick) {
                    const kickOsc = this.ctx.createOscillator();
                    const kickGain = this.ctx.createGain();
                    kickOsc.type = 'sine';
                    kickOsc.frequency.setValueAtTime(145, now);
                    kickOsc.frequency.exponentialRampToValueAtTime(30, now + 0.12);
                    kickGain.gain.setValueAtTime(0.16, now);
                    kickGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
                    kickOsc.connect(kickGain);
                    kickGain.connect(this.ctx.destination);
                    kickOsc.start(now);
                    kickOsc.stop(now + 0.15);
                }

                if (this.noiseBuf) {
                    const hatNoise = this.ctx.createBufferSource();
                    hatNoise.buffer = this.noiseBuf;

                    const isSnare = (step % 8 === 4);
                    const hatFilter = this.ctx.createBiquadFilter();
                    hatFilter.type = isSnare ? 'bandpass' : 'highpass';
                    hatFilter.frequency.setValueAtTime(isSnare ? 1600 : 7500, now);

                    const hatGain = this.ctx.createGain();
                    const hatVol = isSnare ? 0.09 : (step % 2 === 0 ? 0.035 : 0.015);
                    hatGain.gain.setValueAtTime(hatVol, now);
                    hatGain.gain.exponentialRampToValueAtTime(0.001, now + (isSnare ? 0.08 : 0.04));

                    hatNoise.connect(hatFilter);
                    hatFilter.connect(hatGain);
                    hatGain.connect(this.ctx.destination);
                    hatNoise.start(now);
                }

                const bassFreq = bassline64[step];
                if (bassFreq) {
                    const bassOsc = this.ctx.createOscillator();
                    const bassGain = this.ctx.createGain();
                    const bassFilter = this.ctx.createBiquadFilter();

                    bassOsc.type = 'sawtooth';
                    bassOsc.frequency.setValueAtTime(bassFreq, now);

                    bassFilter.type = 'lowpass';
                    bassFilter.frequency.setValueAtTime(320, now);
                    bassFilter.frequency.exponentialRampToValueAtTime(100, now + 0.10);

                    bassGain.gain.setValueAtTime(0.08, now);
                    bassGain.gain.exponentialRampToValueAtTime(0.001, now + 0.11);

                    bassOsc.connect(bassFilter);
                    bassFilter.connect(bassGain);
                    bassGain.connect(this.ctx.destination);

                    bassOsc.start(now);
                    bassOsc.stop(now + 0.11);
                }

                if (step % 8 === 0) {
                    const padFreq = chordPadProgression[bar];
                    const padOsc = this.ctx.createOscillator();
                    const padGain = this.ctx.createGain();
                    const padFilter = this.ctx.createBiquadFilter();

                    padOsc.type = 'triangle';
                    padOsc.frequency.setValueAtTime(padFreq, now);

                    padFilter.type = 'lowpass';
                    padFilter.frequency.setValueAtTime(450, now);

                    padGain.gain.setValueAtTime(0.03, now);
                    padGain.gain.linearRampToValueAtTime(0.02, now + 0.35);
                    padGain.gain.exponentialRampToValueAtTime(0.001, now + 0.7);

                    padOsc.connect(padFilter);
                    padFilter.connect(padGain);
                    padGain.connect(this.ctx.destination);

                    padOsc.start(now);
                    padOsc.stop(now + 0.7);
                }

                const leadFreq = leadNotes64[step];
                if (leadFreq > 0) {
                    const leadOsc = this.ctx.createOscillator();
                    const leadGain = this.ctx.createGain();
                    const leadFilter = this.ctx.createBiquadFilter();

                    leadOsc.type = 'square';
                    leadOsc.frequency.setValueAtTime(leadFreq, now);

                    leadFilter.type = 'lowpass';
                    leadFilter.frequency.setValueAtTime(2200, now);
                    leadFilter.frequency.exponentialRampToValueAtTime(750, now + 0.14);

                    leadGain.gain.setValueAtTime(0.04, now);
                    leadGain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);

                    leadOsc.connect(leadFilter);
                    leadFilter.connect(leadGain);
                    leadGain.connect(this.ctx.destination);

                    leadOsc.start(now);
                    leadOsc.stop(now + 0.15);
                }

                this.bgmStep++;
            }, stepDuration * 1000);
        },

        stopMusic() {
            if (this.bgmInterval) {
                clearInterval(this.bgmInterval);
                this.bgmInterval = null;
            }
            this.isBgmPlaying = false;
        },

        playJump() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(160, now);
            osc.frequency.exponentialRampToValueAtTime(380, now + 0.12);
            gain.gain.setValueAtTime(0.2, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        },

        playHeal() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(freq, now + idx * 0.05);
                gain.gain.setValueAtTime(0.18, now + idx * 0.05);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.05 + 0.22);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + idx * 0.05);
                osc.stop(now + idx * 0.05 + 0.22);
            });
        },

        playChomp() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(140, now);
            osc.frequency.exponentialRampToValueAtTime(30, now + 0.14);
            gain.gain.setValueAtTime(0.42, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.15);
        },

        playExplosion(intensity = 1.0) {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const dur = 0.45 * intensity;
            const bufSize = this.ctx.sampleRate * dur;
            const buffer = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
            const data = buffer.getChannelData(0);
            for (let i = 0; i < bufSize; i++) {
                data[i] = (Math.random() * 2 - 1) * Math.exp(-3 * (i / bufSize));
            }
            const noise = this.ctx.createBufferSource();
            noise.buffer = buffer;

            const filter = this.ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(450, now);
            filter.frequency.exponentialRampToValueAtTime(80, now + dur);

            const gain = this.ctx.createGain();
            gain.gain.setValueAtTime(0.4 * intensity, now);
            gain.gain.exponentialRampToValueAtTime(0.01, now + dur);

            noise.connect(filter);
            filter.connect(gain);
            gain.connect(this.ctx.destination);
            noise.start(now);
        },

        playPlayerHurt() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            
            const subOsc = this.ctx.createOscillator();
            const subGain = this.ctx.createGain();
            subOsc.type = 'sine';
            subOsc.frequency.setValueAtTime(130, now);
            subOsc.frequency.exponentialRampToValueAtTime(30, now + 0.22);
            subGain.gain.setValueAtTime(0.55, now);
            subGain.gain.exponentialRampToValueAtTime(0.001, now + 0.24);
            subOsc.connect(subGain);
            subGain.connect(this.ctx.destination);
            subOsc.start(now);
            subOsc.stop(now + 0.24);

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(25, now + 0.16);
            gain.gain.setValueAtTime(0.4, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.18);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.18);
        },

        playHit() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;

            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(110, now);
            osc.frequency.exponentialRampToValueAtTime(28, now + 0.13);
            gain.gain.setValueAtTime(0.48, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);

            const crunch = this.ctx.createOscillator();
            const crunchGain = this.ctx.createGain();
            crunch.type = 'sawtooth';
            crunch.frequency.setValueAtTime(75, now);
            crunch.frequency.exponentialRampToValueAtTime(20, now + 0.08);
            crunchGain.gain.setValueAtTime(0.35, now);
            crunchGain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);

            osc.connect(gain);
            gain.connect(this.ctx.destination);
            crunch.connect(crunchGain);
            crunchGain.connect(this.ctx.destination);

            osc.start(now);
            crunch.start(now);
            osc.stop(now + 0.14);
            crunch.stop(now + 0.09);
        },

        playThrow() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(240, now);
            osc.frequency.exponentialRampToValueAtTime(620, now + 0.12);
            gain.gain.setValueAtTime(0.28, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.14);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.14);
        },

        playLevelUp() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const chords = [392.00, 523.25, 659.25, 783.99, 1046.50];
            chords.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(freq, now + idx * 0.06);
                gain.gain.setValueAtTime(0.22, now + idx * 0.06);
                gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.06 + 0.35);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now + idx * 0.06);
                osc.stop(now + idx * 0.06 + 0.35);
            });
        },

        playWaveStart() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            
            const lowFreqs = [58.27, 82.41, 116.54];
            lowFreqs.forEach((freq, idx) => {
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                const filter = this.ctx.createBiquadFilter();

                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(freq, now);
                osc.frequency.exponentialRampToValueAtTime(freq * 0.92, now + 0.7);

                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(320, now);
                filter.frequency.exponentialRampToValueAtTime(90, now + 0.7);

                gain.gain.setValueAtTime(0.32 / (idx + 1), now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.75);

                osc.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);

                osc.start(now);
                osc.stop(now + 0.75);
            });

            const impactOsc = this.ctx.createOscillator();
            const impactGain = this.ctx.createGain();
            impactOsc.type = 'triangle';
            impactOsc.frequency.setValueAtTime(95, now);
            impactOsc.frequency.exponentialRampToValueAtTime(24, now + 0.45);
            impactGain.gain.setValueAtTime(0.45, now);
            impactGain.gain.exponentialRampToValueAtTime(0.001, now + 0.5);
            impactOsc.connect(impactGain);
            impactGain.connect(this.ctx.destination);
            impactOsc.start(now);
            impactOsc.stop(now + 0.5);
        },

        playBoneClack() {
            if (!this.ctx) return;
            const now = this.ctx.currentTime;
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(420, now);
            osc.frequency.exponentialRampToValueAtTime(140, now + 0.08);
            gain.gain.setValueAtTime(0.35, now);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
            osc.connect(gain);
            gain.connect(this.ctx.destination);
            osc.start(now);
            osc.stop(now + 0.09);
        },

        startPsychicHum() {},
        stopPsychicHum() {}
    };

    // --- MATTER.JS ALIASES ---

    // --- HELPER CLASSES ---

    class Particle {
        constructor(x, y, color, speed, size, life, shape = 'circle') {
            this.x = x; this.y = y;
            this.vx = (Math.random() - 0.5) * speed;
            this.vy = (Math.random() - 0.5) * speed;
            this.color = color;
            this.size = size;
            this.life = life;
            this.maxLife = life;
            this.shape = shape; 
            this.angle = Math.random() * Math.PI * 2;
            this.vAngle = (Math.random() - 0.5) * 0.35;

            if (this.shape === 'shard') {
                const pointCount = 4 + Math.floor(Math.random() * 3);
                this.vertices = [];
                for (let i = 0; i < pointCount; i++) {
                    const ptAngle = (i / pointCount) * Math.PI * 2 + (Math.random() - 0.5) * (Math.PI / pointCount);
                    const radRatio = 0.45 + Math.random() * 0.75;
                    this.vertices.push({
                        x: Math.cos(ptAngle) * this.size * radRatio,
                        y: Math.sin(ptAngle) * this.size * radRatio
                    });
                }
            }
        }
        update() {
            this.x += this.vx;
            this.y += this.vy;
            if (this.shape === 'shard') {
                this.vy += 0.38;
                this.angle += this.vAngle;
            }
            this.life--;
        }
        draw(ctx) {
            ctx.save();
            ctx.globalAlpha = Math.max(0, this.life / this.maxLife);
            ctx.fillStyle = this.color;

            if (this.shape === 'shard' && this.vertices) {
                ctx.translate(this.x, this.y);
                ctx.rotate(this.angle);
                ctx.beginPath();
                ctx.moveTo(this.vertices[0].x, this.vertices[0].y);
                for (let i = 1; i < this.vertices.length; i++) {
                    ctx.lineTo(this.vertices[i].x, this.vertices[i].y);
                }
                ctx.closePath();
                ctx.fill(); 
            } else {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            }

            ctx.restore();
        }
    }

    function createExplosion(x, y, color, count, shape = 'circle') {
        for (let i = 0; i < count; i++) {
            particles.push(new Particle(x, y, color, 16, Math.random() * 5 + 2, 25 + Math.random() * 25, shape));
        }
    }

    class Entity {
        constructor(body, hp, type, weight = 1.0) {
            this.body = body;
            this.hp = hp;
            this.maxHp = hp;
            this.type = type;
            this.weight = weight;
            this.body.entity = this; 
            this.markedForDeletion = false;
            this.isDying = false;
            this.canBeGrabbed = true;
            this.isEntering = false;
            this.spawnGraceTimer = 0;
            Composite.add(engine.world, this.body);
            entities.push(this);
        }

        takeDamage(amount, sourceBody = null) {
            if (this.hp <= 0 || this.isDying) return;
            this.spawnGraceTimer = 0;
            this.isEntering = false;
            this.hp -= amount;

            if (this.type === 'slime' || this.type === 'zombie' || this.type === 'golem' || this.type === 'maw' || this.type === 'skeleton') {
                SoundFX.playHit();
                shakeAmount = Math.max(shakeAmount, Math.min(18, 6 + amount * 0.35));

                if (sourceBody) {
                    const sourcePos = sourceBody.position || sourceBody;
                    let dx = this.body.position.x - sourcePos.x;
                    let dy = this.body.position.y - sourcePos.y;
                    const len = Math.hypot(dx, dy) || 1;
                    
                    const nx = dx / len;
                    const impulseX = nx * (7 + Math.min(amount * 0.4, 12));
                    const impulseY = -Math.max(6, Math.min(16, 5 + amount * 0.5));
                    
                    Matter.Body.setVelocity(this.body, { x: impulseX, y: impulseY });
                }
            }

            if (this.hp <= 0) {
                this.hp = 0;
                this.die(sourceBody);
            }
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            this.isDying = true;
            this.markedForDeletion = true;
            
            shakeAmount = 16;
            
            if (this.type === 'slime' || this.type === 'zombie' || this.type === 'golem' || this.type === 'maw' || this.type === 'skeleton' || this.type === 'spike_boss') {
                registerKill(this.body.position.x, this.body.position.y);
            }

            if (this.type === 'skeleton') return;

            if (this.type === 'box') {
                const shardCount = 26;
                const woodColors = ['#D2B48C', '#8B4513', '#A0522D', '#CD853F', '#DEB887'];
                for (let i = 0; i < shardCount; i++) {
                    const chosenColor = woodColors[Math.floor(Math.random() * woodColors.length)];
                    const shardSize = Math.random() * 10 + 6;
                    particles.push(new Particle(
                        this.body.position.x, this.body.position.y, 
                        chosenColor, 20, shardSize, 30 + Math.random() * 30, 'shard'
                    ));
                }
                return;
            }

            let expColor = '#ffffff';
            if (this.type === 'slime') expColor = '#32cd32';
            else if (this.type === 'zombie') expColor = '#2E8B57';
            else if (this.type === 'golem') expColor = '#708090';
            else if (this.type === 'maw') expColor = '#6b21a8';
            else if (this.type === 'bone') expColor = '#f1f5f9';
            else if (this.type === 'player') expColor = '#ff2222';
            else if (this.type === 'bomb') expColor = '#FF4500';
            
            createExplosion(this.body.position.x, this.body.position.y, expColor, 40);
        }

        update() {}
        draw(ctx) {}

        drawHpBar(ctx, yOffset) {
            if (this.hp >= this.maxHp || this.hp <= 0 || this.isDying) return;
            const width = 60;
            const height = 8;
            const x = this.body.position.x - width / 2;
            const y = this.body.position.y - yOffset;
            
            ctx.fillStyle = 'red';
            ctx.fillRect(x, y, width, height);
            ctx.fillStyle = '#00ff00';
            ctx.fillRect(x, y, width * (this.hp / this.maxHp), height);
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(x, y, width, height);
        }
    }

    // --- BOSS SPIKE WEAPONS (STAGE 2) ---
    class BossSpike extends Entity {
        constructor(x, y, angle) {
            // Completely sensor body with zero gravity, friction, and restitution
            const body = Bodies.polygon(x, y, 3, 18, {
                angle: angle,
                density: 0.0001,
                restitution: 0,
                friction: 0,
                frictionAir: 0,
                isSensor: true // ABSOLUTELY NO PHYSICS COLLISIONS
            });
            body.isBossSpike = true;
            body.ignoreGravity = true; // Matter.js native gravity bypass
            super(body, 1, 'boss_spike', 0.2);
            this.isBossSpike = true;
            this.state = 'slowmo';
            this.playerOwned = false;
            this.thrownVelocity = null;
            // Variable curvature offsets for graceful sweeping spiral paths
            this.curveSpeed = (Math.random() - 0.5) * 0.02;
            this.currentCurveAngle = angle;
        }

        checkBossCollision() {
            if (!this.playerOwned || this.isDying || this.markedForDeletion) return false;
            const pos = this.body.position;
            for (let i = 0; i < entities.length; i++) {
                const ent = entities[i];
                if (ent && ent.type === 'spike_boss' && ent.bossStage === 2 && !ent.isDying) {
                    const distToBoss = Math.hypot(ent.body.position.x - pos.x, ent.body.position.y - pos.y);
                    if (distToBoss < ent.radius + 65) {
                        ent.hitCooldown = 0; // Bypass cooldown
                        ent.takeDamage(1, this.body);
                        createExplosion(pos.x, pos.y, '#f59e0b', 30);
                        this.die();
                        return true;
                    }
                }
            }
            return false;
        }

        update() {
            if (this.isDying || this.markedForDeletion) return;
            
            // Constantly cancel any residual physics engine velocity
            Matter.Body.setVelocity(this.body, { x: 0, y: 0 });

            const pos = this.body.position;
            const isHeld = player && player.grabbedEntity === this;

            if (isHeld) {
                this.playerOwned = true;
                this.state = 'held';
                return;
            }

            // Check Boss damage immediately if player has taken ownership
            if (this.checkBossCollision()) return;

            // Once thrown by Steve: flies straight with ZERO gravity, ZERO drag, ZERO physics
            if (this.playerOwned && this.state === 'thrown') {
                if (this.thrownVelocity) {
                    Matter.Body.setPosition(this.body, {
                        x: pos.x + this.thrownVelocity.x,
                        y: pos.y + this.thrownVelocity.y
                    });
                }

                if (this.checkBossCollision()) return;

                // Delete on contact with ground or platforms
                if (pos.y >= 885) {
                    createExplosion(pos.x, pos.y, '#cbd5e1', 6);
                    this.die();
                    return;
                }
                for (let i = 0; i < breakablePlatforms.length; i++) {
                    const plat = breakablePlatforms[i];
                    if (!plat.isBroken && Matter.Bounds.contains(plat.bounds, pos)) {
                        createExplosion(pos.x, pos.y, '#cbd5e1', 6);
                        this.die();
                        return;
                    }
                }
            } else if (this.state === 'slowmo') {
                // Pure 360-degree homing: moves up, down, left, right strictly toward Steve
                if (player && !player.isDying) {
                    const dx = player.body.position.x - pos.x;
                    const dy = player.body.position.y - pos.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const directAngle = Math.atan2(dy, dx);
                    
                    // Always point tip directly towards the player
                    Matter.Body.setAngle(this.body, directAngle + Math.PI / 2);

                    const ultraSlowSpeed = 0.35; // Crawling slow-mo speed
                    const vx = (dx / dist) * ultraSlowSpeed;
                    const vy = (dy / dist) * ultraSlowSpeed;

                    Matter.Body.setPosition(this.body, {
                        x: pos.x + vx,
                        y: pos.y + vy
                    });

                    // Check contact with Steve
                    const distToSteve = Math.hypot(player.body.position.x - pos.x, player.body.position.y - pos.y);
                    if (distToSteve < 40) {
                        if (player.invulnerableTimer <= 0) {
                            player.takeDamage(20, this.body);
                            applyPlayerHurtKnockback(this.body);
                        }
                        this.die();
                        return;
                    }
                }

                if (pos.y >= 885) {
                    createExplosion(pos.x, pos.y, '#cbd5e1', 6);
                    this.die();
                    return;
                }
            } else if (this.state === 'release') {
                // Continuous 360-degree homing tracking at normal flight speed (can move UP or DOWN)
                if (player && !player.isDying && !this.playerOwned) {
                    const dx = player.body.position.x - pos.x;
                    const dy = player.body.position.y - pos.y;
                    const dist = Math.hypot(dx, dy) || 1;
                    const directAngle = Math.atan2(dy, dx);
                    
                    Matter.Body.setAngle(this.body, directAngle + Math.PI / 2);

                    const releaseSpeed = 16;
                    Matter.Body.setPosition(this.body, {
                        x: pos.x + (dx / dist) * releaseSpeed,
                        y: pos.y + (dy / dist) * releaseSpeed
                    });

                    const distToSteve = Math.hypot(player.body.position.x - pos.x, player.body.position.y - pos.y);
                    if (distToSteve < 40) {
                        if (player.invulnerableTimer <= 0) {
                            player.takeDamage(20, this.body);
                            applyPlayerHurtKnockback(this.body);
                        }
                        this.die();
                        return;
                    }
                } else {
                    // Thrown/player-owned fallback straight line
                    const ang = this.body.angle - Math.PI / 2;
                    const speed = 22;
                    Matter.Body.setPosition(this.body, {
                        x: pos.x + Math.cos(ang) * speed,
                        y: pos.y + Math.sin(ang) * speed
                    });

                    if (this.checkBossCollision()) return;
                }

                if (pos.y >= 885) {
                    createExplosion(pos.x, pos.y, '#cbd5e1', 6);
                    this.die();
                    return;
                }
            }

            // Screen boundary cleanup
            if (pos.y > 1020 || pos.y < -300 || pos.x < -150 || pos.x > 1590) {
                this.die();
            }
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            ctx.rotate(this.body.angle);
            
            ctx.shadowColor = this.playerOwned ? '#a855f7' : '#c084fc';
            ctx.shadowBlur = this.playerOwned ? 22 : 16;

            ctx.fillStyle = '#0f172a';
            ctx.strokeStyle = this.playerOwned ? '#f0abfc' : '#c084fc';
            ctx.lineWidth = 3.5;

            ctx.beginPath();
            ctx.moveTo(0, -22);
            ctx.lineTo(-12, 12);
            ctx.lineTo(12, 12);
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Inner glowing psychic core
            ctx.fillStyle = this.playerOwned ? '#f0abfc' : '#d8b4fe';
            ctx.beginPath();
            ctx.arc(0, 0, 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }
    }

    class Player extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 45, 120, { 
                inertia: Infinity, friction: 0.1, restitution: 0, density: 0.002
            });
            super(body, 100, 'player');
            this.animTimer = 0;
            this.canJump = false;
            this.grabbedEntity = null;
            this.invulnerableTimer = 0;
            this.grabTimer = 0;
            this.maxGrabDuration = 120;
        }

        takeDamage(amount, sourceBody = null) {
            if (this.invulnerableTimer > 0 && amount < 1000) return;
            
            // Cap maximum damage taken in a single hit at 50 HP (unless an intentional wipe like 1000+)
            const actualDamage = amount >= 1000 ? amount : Math.min(50, amount);

            super.takeDamage(actualDamage, sourceBody);
            if (!this.isDying) {
                SoundFX.playPlayerHurt();
                this.invulnerableTimer = 55;
                shakeAmount = Math.max(shakeAmount, Math.min(28, 12 + actualDamage * 0.5));
            }
        }

        releaseGrip(impartBoost = false) {
            if (this.grabbedEntity && !this.grabbedEntity.markedForDeletion) {
                const b = this.grabbedEntity.body;
                if (impartBoost) {
                    const effectiveLevel = currentDifficulty === 'easy' ? 5 : playerLevel;
                    const cfg = LEVEL_CONFIGS[effectiveLevel] || LEVEL_CONFIGS[1];
                    const maxThrowSpeed = cfg.maxThrowSpeed;
                    let vx = b.velocity.x * cfg.throwBoost;
                    let vy = b.velocity.y * cfg.throwBoost;
                    const spd = Math.hypot(vx, vy);
                    if (spd > maxThrowSpeed) {
                        vx = (vx / spd) * maxThrowSpeed;
                        vy = (vy / spd) * maxThrowSpeed;
                    }
                    Body.setVelocity(b, { x: vx, y: vy });

                    // Stage 2 Spike throw: if still in slow-mo, spike travels at a slow pace
                    if (this.grabbedEntity.isBossSpike) {
                        let isSlowMoNow = false;
                        for (let i = 0; i < entities.length; i++) {
                            if (entities[i].type === 'spike_boss' && entities[i].isSloMo) {
                                isSlowMoNow = true;
                                break;
                            }
                        }
                        // Slow returned spikes while in slow-motion, standard speed once unpaused
                        const throwSpeed = isSlowMoNow ? 5.5 : Math.max(22, (spd || 15) * 1.3);
                        const throwAng = Math.atan2(vy, vx);
                        this.grabbedEntity.thrownVelocity = {
                            x: Math.cos(throwAng) * throwSpeed,
                            y: Math.sin(throwAng) * throwSpeed
                        };
                        this.grabbedEntity.state = 'thrown';
                        this.grabbedEntity.playerOwned = true;
                        Matter.Body.setAngle(b, throwAng + Math.PI / 2);
                    }

                    SoundFX.playThrow();
                }
            }
            this.grabbedEntity = null;
            this.grabTimer = 0;
            SoundFX.stopPsychicHum();
        }

        update() {
            if (this.invulnerableTimer > 0) this.invulnerableTimer--;
            if (this.isDying) return;

            this.healTimer = (this.healTimer || 0) + 1;
            if (this.healTimer >= 90) {
                this.healTimer = 0;
                if (this.hp < this.maxHp) this.hp = Math.min(this.maxHp, this.hp + 1);
            }

            const moveSpeed = 8;
            const jumpVelocityY = -23; 
            
            let vx = this.body.velocity.x;
            let vy = this.body.velocity.y;

            if (keys.a || keys.ArrowLeft) {
                vx = -moveSpeed;
                this.animTimer += 0.2;
            } else if (keys.d || keys.ArrowRight) {
                vx = moveSpeed;
                this.animTimer += 0.2;
            } else {
                vx *= 0.5; 
                this.animTimer = 0;
            }

            if ((keys.w || keys.ArrowUp) && this.canJump) {
                vy = jumpVelocityY;
                this.canJump = false;
                SoundFX.playJump();
            }

            if (vy > 1.0) this.canJump = false;
            if (!this.canJump && vy > 0) vy += 0.65;
            if (mouse.isDown && vy > 1.8) vy = 1.8;
            if (vy < -26) vy = -26;

            Body.setVelocity(this.body, { x: vx, y: vy });

            // Ground sensor ray check - Jump off any solid or object
            if (this.canJump) {
                const footY = this.body.position.y + 60;
                const footX = this.body.position.x;
                const hits = Query.point(engine.world.bodies, { x: footX, y: footY + 4 });
                const isSupported = hits.some(b => b !== this.body && !b.isSensor);
                if (!isSupported) this.canJump = false;
            }

            const minX = 25;
            const maxX = 1415;
            let currentX = this.body.position.x;
            let currentY = this.body.position.y;
            let clamped = false;

            if (currentX < minX) {
                currentX = minX;
                if (this.body.velocity.x < 0) Body.setVelocity(this.body, { x: 0, y: this.body.velocity.y });
                clamped = true;
            } else if (currentX > maxX) {
                currentX = maxX;
                if (this.body.velocity.x > 0) Body.setVelocity(this.body, { x: 0, y: this.body.velocity.y });
                clamped = true;
            }

            if (currentY > 840) {
                currentY = 840;
                if (this.body.velocity.y > 0) Body.setVelocity(this.body, { x: this.body.velocity.x, y: 0 });
                clamped = true;
            }

            if (clamped) Body.setPosition(this.body, { x: currentX, y: currentY });

            const maxGrabRadius = 450;
            if (mouse.isDown) {
                if (!this.grabbedEntity) {
                    let bestCandidate = null;
                    let bestScore = -Infinity;

                    const aimVec = { x: mouse.x - this.body.position.x, y: mouse.y - this.body.position.y };
                    const aimDist = Math.hypot(aimVec.x, aimVec.y) || 1;
                    const aimNorm = { x: aimVec.x / aimDist, y: aimVec.y / aimDist };

                    for (let i = 0; i < entities.length; i++) {
                        const ent = entities[i];
                        if (ent === this || ent.isDying || ent.markedForDeletion || ent.canBeGrabbed === false) continue;
                        // Prevent targeting the boss directly in Stages 1 and 2
                        if (ent.type === 'spike_boss' && ent.bossStage < 3) continue;

                        const b = ent.body;
                        const toEnt = { x: b.position.x - this.body.position.x, y: b.position.y - this.body.position.y };
                        const distToSteve = Math.hypot(toEnt.x, toEnt.y);

                        if (distToSteve > maxGrabRadius) continue;

                        const distToCursor = Math.hypot(b.position.x - mouse.x, b.position.y - mouse.y);

                        if (currentDifficulty === 'hard') {
                            if (distToCursor < 60) {
                                let score = 1000 - distToCursor;
                                if (score > bestScore) {
                                    bestScore = score;
                                    bestCandidate = ent;
                                }
                            }
                        } else {
                            const projAlongAim = toEnt.x * aimNorm.x + toEnt.y * aimNorm.y;
                            const perpDist = Math.abs(toEnt.x * (-aimNorm.y) + toEnt.y * aimNorm.x);

                            let score = 0;
                            if (projAlongAim > 10 && perpDist < 140) {
                                score = 1000 - perpDist * 3.5 - Math.abs(distToSteve - Math.min(aimDist, maxGrabRadius)) * 0.8;
                            } else if (distToCursor < 120) {
                                score = 800 - distToCursor * 3.5;
                            }

                            if (score > bestScore && score > 200) {
                                bestScore = score;
                                bestCandidate = ent;
                            }
                        }
                    }

                    if (bestCandidate) {
                        this.grabbedEntity = bestCandidate;
                        this.grabbedEntity.body.isThrown = true;
                        this.grabbedEntity.isEntering = false;
                        this.grabbedEntity.spawnGraceTimer = 0;
                        if (this.grabbedEntity.type === 'bomb') {
                            this.grabbedEntity.flungByPlayer = true;
                        }
                        const w = this.grabbedEntity.weight || 1.0;
                        this.grabTimer = Math.max(30, Math.round(this.maxGrabDuration / Math.sqrt(w)));
                    }
                }

                if (this.grabbedEntity) {
                    if (this.grabbedEntity.isDying || this.grabbedEntity.markedForDeletion) {
                        this.grabbedEntity = null;
                        this.grabTimer = 0;
                    } else if (this.grabbedEntity.type === 'spike_boss' && this.grabbedEntity.bossStage < 3) {
                        // Strict fail-safe: immediately drop boss if in stages 1 or 2
                        this.releaseGrip(false);
                        return;
                    } else {
                        const b = this.grabbedEntity.body;
                        const distFromSteve = Vector.magnitude(Vector.sub(b.position, this.body.position));

                        if (distFromSteve > maxGrabRadius) {
                            this.releaseGrip(true);
                            return;
                        }

                        this.grabTimer--;
                        if (this.grabTimer <= 0) {
                            // Flail remains eternally grabbable even if grab duration expires
                            if (this.grabbedEntity.type !== 'flail') {
                                this.grabbedEntity.canBeGrabbed = false;
                            }
                            this.releaseGrip(false);
                            return;
                        }

                        const target = { x: mouse.x, y: mouse.y };
                        const mouseDistFromSteve = Vector.magnitude(Vector.sub(target, this.body.position));

                        if (mouseDistFromSteve > maxGrabRadius) {
                            const angle = Math.atan2(target.y - this.body.position.y, target.x - this.body.position.x);
                            target.x = this.body.position.x + Math.cos(angle) * maxGrabRadius;
                            target.y = this.body.position.y + Math.sin(angle) * maxGrabRadius;
                        }

                        const force = Vector.sub(target, b.position);
                        const weightFactor = Math.max(0.25, 1.25 / Math.sqrt(this.grabbedEntity.weight || 1));
                        
                        const effectiveLevel = currentDifficulty === 'easy' ? 5 : playerLevel;
                        const cfg = LEVEL_CONFIGS[effectiveLevel] || LEVEL_CONFIGS[1];
                        const psychicDrag = cfg.psychicDrag;
                        const maxHeldSpeed = cfg.maxHeldSpeed;

                        let targetVx = (b.velocity.x * psychicDrag) + (force.x * cfg.pullForce * weightFactor);
                        let targetVy = (b.velocity.y * psychicDrag) + (force.y * cfg.pullForce * weightFactor);

                        const currentSpeed = Math.hypot(targetVx, targetVy);
                        if (currentSpeed > maxHeldSpeed) {
                            targetVx = (targetVx / currentSpeed) * maxHeldSpeed;
                            targetVy = (targetVy / currentSpeed) * maxHeldSpeed;
                        }

                        Body.setVelocity(b, { x: targetVx, y: targetVy });
                        b.isThrown = true;
                    }
                }
            } else if (this.grabbedEntity) {
                this.releaseGrip(true);
            }
        }

        die(sourceBody = null) {
            if (this.isDying) return;
            this.isDying = true;
            this.markedForDeletion = true;
            finalWaveReached = wave;
            
            document.getElementById('hud-layer').style.display = 'none';
            
            shakeAmount = 30;
            SoundFX.stopMusic();
            SoundFX.playExplosion(1.4);
            createExplosion(this.body.position.x, this.body.position.y, '#ff2222', 45);
            createExplosion(this.body.position.x, this.body.position.y, '#ffa500', 35);
            createExplosion(this.body.position.x, this.body.position.y, '#111111', 25);
            createExplosion(this.body.position.x, this.body.position.y, '#a020f0', 20);

            this.releaseGrip(false);
        }

        draw(ctx) {
            if (this.markedForDeletion) return;
            
            if (this.invulnerableTimer > 0 && Math.floor(this.invulnerableTimer / 4) % 2 === 0) {
                this.drawHpBarUI();
                return;
            }

            const pos = this.body.position;
            const maxGrabRadius = 450;

            if (mouse.isDown) {
                ctx.save();

                let targetX, targetY;
                let isConnected = false;

                if (this.grabbedEntity && !this.grabbedEntity.markedForDeletion) {
                    targetX = this.grabbedEntity.body.position.x;
                    targetY = this.grabbedEntity.body.position.y;
                    isConnected = true;
                } else {
                    const dx = mouse.x - pos.x;
                    const dy = mouse.y - pos.y;
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist > maxGrabRadius) {
                        const angle = Math.atan2(dy, dx);
                        targetX = pos.x + Math.cos(angle) * maxGrabRadius;
                        targetY = pos.y + Math.sin(angle) * maxGrabRadius;
                    } else {
                        targetX = mouse.x;
                        targetY = mouse.y;
                    }
                }

                ctx.shadowColor = '#d946ef';
                ctx.shadowBlur = isConnected ? 24 : 14;

                const beamCount = isConnected ? 4 : 3;
                for (let w = 0; w < beamCount; w++) {
                    ctx.strokeStyle = w === 0 ? 'rgba(255, 255, 255, 0.9)' : (isConnected ? '#a020f0' : 'rgba(160, 32, 240, 0.7)');
                    ctx.lineWidth = w === 0 ? 2.5 : (isConnected ? 4 : 3);
                    ctx.beginPath();
                    ctx.moveTo(pos.x, pos.y - 15);

                    const jitter = isConnected ? 60 : 35;
                    const cp1x = pos.x + (targetX - pos.x) / 3 + (Math.random() - 0.5) * jitter;
                    const cp1y = (pos.y - 15) + (targetY - (pos.y - 15)) / 3 + (Math.random() - 0.5) * jitter;
                    const cp2x = pos.x + 2 * (targetX - pos.x) / 3 + (Math.random() - 0.5) * jitter;
                    const cp2y = (pos.y - 15) + 2 * (targetY - (pos.y - 15)) / 3 + (Math.random() - 0.5) * jitter;

                    ctx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, targetX, targetY);
                    ctx.stroke();
                }

                if (isConnected) {
                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2.5;
                    ctx.strokeRect(targetX - 32, targetY - 32, 64, 64);

                    const pulse = (Date.now() % 1000) / 1000 * 20;
                    ctx.strokeStyle = 'rgba(217, 70, 239, 0.65)';
                    ctx.strokeRect(targetX - 32 - pulse, targetY - 32 - pulse, 64 + pulse * 2, 64 + pulse * 2);

                    ctx.save();
                    ctx.translate(targetX, targetY);
                    ctx.rotate((Date.now() % 2400) / 2400 * Math.PI * 2);
                    ctx.strokeStyle = '#f0abfc';
                    ctx.lineWidth = 2;
                    ctx.strokeRect(-24, -24, 48, 48);
                    ctx.restore();
                } else {
                    ctx.fillStyle = '#a020f0';
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 6 + Math.sin(Date.now() / 80) * 2, 0, Math.PI * 2);
                    ctx.fill();

                    ctx.strokeStyle = '#ffffff';
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(targetX, targetY, 14, 0, Math.PI * 2);
                    ctx.stroke();
                }

                ctx.restore();
            }

            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.strokeStyle = 'black';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            ctx.beginPath();
            ctx.arc(0, -45, 18, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.stroke();

            let eyeLookX = 0;
            let eyeLookY = 0;
            if (mouse.isDown) {
                const angle = Math.atan2(mouse.y - pos.y, mouse.x - pos.x);
                eyeLookX = Math.cos(angle) * 3;
                eyeLookY = Math.sin(angle) * 3;
            } else if (Math.abs(this.body.velocity.x) > 0.5) {
                eyeLookX = (this.body.velocity.x > 0 ? 1 : -1) * 3;
            }

            ctx.fillStyle = '#000000';
            ctx.beginPath();
            ctx.arc(-6 + eyeLookX, -46 + eyeLookY, 2.8, 0, Math.PI * 2);
            ctx.fill();
            ctx.beginPath();
            ctx.arc(6 + eyeLookX, -46 + eyeLookY, 2.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.beginPath();
            ctx.moveTo(0, -27);
            ctx.lineTo(0, 22);
            ctx.stroke();

            let armSwing = Math.sin(this.animTimer) * 22;
            let legSwing = Math.cos(this.animTimer) * 22;

            ctx.beginPath();
            ctx.moveTo(0, -15); 
            if (mouse.isDown) {
                const angle = Math.atan2(mouse.y - pos.y, mouse.x - pos.x);
                ctx.lineTo(Math.cos(angle) * 37, Math.sin(angle) * 37);
            } else {
                ctx.lineTo(-22 + armSwing, 7);
                ctx.moveTo(0, -15);
                ctx.lineTo(22 - armSwing, 7);
            }
            ctx.stroke();

            ctx.beginPath();
            ctx.moveTo(0, 22); 
            if (!this.canJump) { 
                ctx.lineTo(-15, 45);
                ctx.lineTo(-7, 60);
                ctx.moveTo(0, 22);
                ctx.lineTo(22, 37);
            } else {
                ctx.lineTo(-15 + legSwing, 60);
                ctx.moveTo(0, 22);
                ctx.lineTo(15 - legSwing, 60);
            }
            ctx.stroke();

            ctx.restore();

            this.drawHpBarUI();
        }

        drawHpBarUI() {
            const barW = 304;
            const barH = 38;
            const hpBarX = 20;
            const hpBarY = 20;
            const xpBarX = 20;
            const xpBarY = hpBarY + barH + 10; 

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(hpBarX, hpBarY, barW, barH);

            const hpRatio = Math.max(0, Math.min(1.0, this.hp / this.maxHp));
            const hpGrad = ctx.createLinearGradient(hpBarX, hpBarY, hpBarX + barW, hpBarY);
            hpGrad.addColorStop(0, '#22c55e');
            hpGrad.addColorStop(1, '#4ade80');
            ctx.fillStyle = hpGrad;
            ctx.fillRect(hpBarX + 2, hpBarY + 2, (barW - 4) * hpRatio, barH - 4);

            ctx.strokeStyle = '#22c55e';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(hpBarX, hpBarY, barW, barH);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Inter';
            ctx.textAlign = 'left';
            ctx.fillText(`HP: ${Math.ceil(this.hp)} / ${this.maxHp}`, hpBarX + 14, hpBarY + 25);

            ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
            ctx.fillRect(xpBarX, xpBarY, barW, barH);

            const isMaxLevel = playerLevel >= 5;
            const neededKills = isMaxLevel ? 1 : LEVEL_REQUIREMENTS[playerLevel];
            const currentKills = isMaxLevel ? 1 : currentLevelKills;
            const xpRatio = Math.min(1.0, Math.max(0, currentKills / neededKills));

            const xpGrad = ctx.createLinearGradient(xpBarX, xpBarY, xpBarX + barW, xpBarY);
            xpGrad.addColorStop(0, '#9333ea');
            xpGrad.addColorStop(1, '#06b6d4');
            ctx.fillStyle = xpGrad;
            ctx.fillRect(xpBarX + 2, xpBarY + 2, (barW - 4) * xpRatio, barH - 4);

            ctx.strokeStyle = '#c084fc';
            ctx.lineWidth = 2.5;
            ctx.strokeRect(xpBarX, xpBarY, barW, barH);

            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 18px Inter';
            ctx.textAlign = 'left';
            if (isMaxLevel) {
                ctx.fillText(`LV 5 [MAX]`, xpBarX + 14, xpBarY + 25);
            } else {
                ctx.fillText(`LV ${playerLevel}`, xpBarX + 14, xpBarY + 25);
            }

            if (levelUpPopupTimer > 0) {
                levelUpPopupTimer--;
                ctx.save();
                const popupAlpha = Math.min(1.0, levelUpPopupTimer / 30);
                ctx.globalAlpha = popupAlpha;
                ctx.textAlign = 'center';
                ctx.font = '900 28px Inter';
                ctx.fillStyle = '#facc15';
                ctx.shadowColor = '#a855f7';
                ctx.shadowBlur = 18;
                const popY = xpBarY + barH + 34 - (110 - levelUpPopupTimer) * 0.25;
                ctx.fillText(`★ LEVEL UP! LV ${playerLevel} ★`, 172, popY);
                ctx.restore();
            }
        }
    }

    class Slime extends Entity {
        constructor(x, y, tier = 0) {
            const configs = [
                { r: 25, hp: 20, weight: 0.8 },
                { r: 40, hp: 50, weight: 1.4 },
                { r: 60, hp: 100, weight: 2.4 },
                { r: 90, hp: 200, weight: 3.6 }
            ];
            const cfg = configs[tier] || configs[0];
            const body = Bodies.circle(x, y, cfg.r, {
                restitution: 0.75, friction: 0.1, density: 0.001 * cfg.weight
            });
            super(body, cfg.hp, 'slime', cfg.weight);
            this.tier = tier;
            this.radius = cfg.r;
            this.moveTimer = 0;
            this.dir = Math.random() > 0.5 ? 1 : -1;
            this.hasSplit = false;
            this.isBoss = tier === 3;
            this.enteringTimer = 0;
        }

        update() {
            const pos = this.body.position;
            if (this.spawnGraceTimer > 0) this.spawnGraceTimer--;

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 60 && pos.x <= 1380) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 60) Matter.Body.setPosition(this.body, { x: 80, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1380) Matter.Body.setPosition(this.body, { x: 1360, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -150 || pos.x > 1590))) {
                    this.die();
                    return;
                }
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.5 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;

            if (pos.x < 60) this.dir = 1;
            else if (pos.x > 1380) this.dir = -1;

            this.moveTimer++;
            if (this.moveTimer > 60 && pos.x >= 60 && pos.x <= 1380) {
                this.dir = Math.random() > 0.5 ? 1 : -1;
                this.moveTimer = 0;
            }
            
            if (Math.random() < 0.03) Body.applyForce(this.body, this.body.position, { x: 0, y: -0.06 * this.weight });
            
            const speed = Math.max(1.8, 3.2 - this.tier * 0.4);
            Body.setVelocity(this.body, { x: this.dir * speed, y: this.body.velocity.y });
        }

        die() {
            if (!this.isDying) this.explode();
        }

        explode() {
            if (this.isDying || this.hasSplit) return;
            this.hasSplit = true;
            const pos = this.body.position;
            SoundFX.playExplosion(0.6 + this.tier * 0.3);
            createExplosion(pos.x, pos.y, '#32cd32', 30 + this.tier * 15);

            if (this.tier > 0) {
                const nextTier = this.tier - 1;
                for (let i = 0; i < 2; i++) {
                    const offset = (i === 0 ? -1 : 1) * (this.radius * 0.5);
                    const spawnX = Math.max(80, Math.min(1360, pos.x + offset));
                    const child = new Slime(spawnX, Math.min(pos.y - 10, 800), nextTier);
                    child.isEntering = false;
                    Matter.Body.setVelocity(child.body, { x: (i === 0 ? -4 : 4), y: -8 });
                }
            }
            super.die();
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.fillStyle = this.isBoss ? 'rgba(74, 222, 128, 0.95)' : 'rgba(50, 205, 50, 0.85)'; 
            ctx.beginPath();
            const wobble = Math.sin(Date.now() / 100) * (2 + this.tier * 1.5);
            ctx.ellipse(0, 0, this.radius + wobble, this.radius * 0.8 - wobble, 0, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = this.isBoss ? '#15803d' : '#228B22';
            ctx.lineWidth = 3 + this.tier;
            ctx.stroke();

            const eyeSize = Math.max(3, 3 + this.tier * 2.5);
            const eyeSpacing = Math.max(8, 8 + this.tier * 6);
            ctx.fillStyle = 'black';
            ctx.beginPath();
            ctx.arc(-eyeSpacing, -5, eyeSize, 0, Math.PI * 2);
            ctx.arc(eyeSpacing, -5, eyeSize, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = 'white';
            ctx.beginPath();
            ctx.arc(-eyeSpacing - 3, -7, Math.max(2, eyeSize * 0.5), 0, Math.PI * 2);
            ctx.fill();

            if (this.isBoss) {
                ctx.fillStyle = '#facc15';
                ctx.strokeStyle = '#ca8a04';
                ctx.lineWidth = 2;
                ctx.beginPath();
                const cy = -this.radius * 0.85;
                ctx.moveTo(-25, cy);
                ctx.lineTo(-32, cy - 25);
                ctx.lineTo(-12, cy - 12);
                ctx.lineTo(0, cy - 30);
                ctx.lineTo(12, cy - 12);
                ctx.lineTo(32, cy - 25);
                ctx.lineTo(25, cy);
                ctx.closePath();
                ctx.fill();
                ctx.stroke();
            }

            ctx.restore();
            this.drawHpBar(ctx, this.radius + 15);
        }
    }

    class Zombie extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 40, 112, {
                inertia: Infinity, restitution: 0.15, friction: 0.1, density: 0.002
            });
            super(body, 50, 'zombie', 1.5);
            this.animTimer = 0;
            this.facing = 1;
            this.enteringTimer = 0;
        }

        update() {
            const pos = this.body.position;
            if (this.spawnGraceTimer > 0) this.spawnGraceTimer--;

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 60 && pos.x <= 1380) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 60) Matter.Body.setPosition(this.body, { x: 80, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1380) Matter.Body.setPosition(this.body, { x: 1360, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -150 || pos.x > 1590))) {
                    this.die();
                    return;
                }
            }

            const isMidAir = Math.abs(this.body.velocity.y) > 1.5 || this.body.isThrown || (player && player.grabbedEntity === this);
            if (isMidAir) return;
            if (!player || player.isDying) return;

            const px = player.body.position.x;
            const dir = px > pos.x ? 1 : -1;
            this.facing = dir;
            
            Body.setVelocity(this.body, { x: dir * 2.2, y: this.body.velocity.y });
            this.animTimer += 0.1;
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);
            
            ctx.strokeStyle = '#2E8B57'; 
            ctx.fillStyle = '#8FBC8F';
            ctx.lineWidth = 6;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';

            if (Math.abs(this.body.velocity.x) > 0.3) {
                this.facing = this.body.velocity.x > 0 ? 1 : -1;
            }
            const eyeDir = this.facing;

            ctx.beginPath();
            ctx.arc(15 * eyeDir, -37, 18, 0, Math.PI * 2);
            ctx.fill();
            ctx.stroke();

            ctx.fillStyle = 'red';
            ctx.fillRect(eyeDir * 18, -42, 4, 4);
            ctx.fillRect(eyeDir * 9, -42, 4, 4);

            ctx.beginPath();
            ctx.moveTo(15 * eyeDir, -19);
            ctx.lineTo(0, 22);
            ctx.stroke();

            let armSwing = Math.sin(this.animTimer) * 15;
            ctx.beginPath();
            ctx.moveTo(7 * eyeDir, -7);
            ctx.lineTo(22 * eyeDir + armSwing, 15);
            ctx.stroke();

            let legSwing = Math.sin(this.animTimer * 0.5) * 15; 
            ctx.beginPath();
            ctx.moveTo(0, 22);
            ctx.lineTo(-15 + legSwing, 52);
            ctx.moveTo(0, 22);
            ctx.lineTo(15 - legSwing, 55);
            ctx.stroke();

            ctx.restore();
            this.drawHpBar(ctx, 65);
        }
    }

    class Golem extends Entity {
        constructor(x, y) {
            const body = Bodies.rectangle(x, y, 105, 150, {
                inertia: Infinity, restitution: 0.2, friction: 0.3, density: 0.008
            });
            super(body, 180, 'golem', 6.8);
            this.animTimer = 0;
            this.facing = 1;
            this.enteringTimer = 0;
            this.heldMob = null;
            this.throwCooldown = 80;
            this.windupTimer = 0;
            this.searchTimer = 0;
        }

        update() {
            const pos = this.body.position;

            if (this.spawnGraceTimer > 0) this.spawnGraceTimer--;

            if (this.isEntering) {
                this.enteringTimer++;
                if (pos.x >= 70 && pos.x <= 1370) {
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                } else if (this.enteringTimer > 300) {
                    if (pos.x < 70) Matter.Body.setPosition(this.body, { x: 90, y: Math.min(pos.y, 820) });
                    else if (pos.x > 1370) Matter.Body.setPosition(this.body, { x: 1350, y: Math.min(pos.y, 820) });
                    this.isEntering = false;
                    this.spawnGraceTimer = 0;
                }
            }

            if (this.spawnGraceTimer <= 0) {
                if (pos.y > 1050 || pos.y < -400 || (!this.isEntering && (pos.x < -180 || pos.x > 1620))) {
                    if (this.heldMob) this.heldMob = null;
                    this.die();
                    return;
                }
            }

            const isAirborne = Math.abs(this.body.velocity.y) > 1.8 || (player && player.grabbedEntity === this);
            if (isAirborne) {
                if (this.heldMob) {
                    this.heldMob = null;
                    this.windupTimer = 0;
                }
                return;
            }

            if (!player || player.isDying) return;

            const px = player.body.position.x;
            const dir = px > pos.x ? 1 : -1;
            this.facing = dir;

            if (this.throwCooldown > 0) this.throwCooldown--;

            if (this.heldMob) {
                if (this.heldMob.isDying || this.heldMob.markedForDeletion || (player && player.grabbedEntity === this.heldMob)) {
                    this.heldMob = null;
                    this.windupTimer = 0;
                } else {
                    Body.setPosition(this.heldMob.body, { x: pos.x + this.facing * 20, y: pos.y - 100 });
                    Body.setVelocity(this.heldMob.body, { x: 0, y: 0 });

                    this.windupTimer++;
                    if (this.windupTimer >= 24) {
                        const targetPos = player.body.position;
                        const throwAngle = Math.atan2(targetPos.y - (pos.y - 100), targetPos.x - pos.x);
                        const throwSpeed = 34;

                        Body.setVelocity(this.heldMob.body, {
                            x: Math.cos(throwAngle) * throwSpeed,
                            y: Math.sin(throwAngle) * throwSpeed - 4
                        });
                        this.heldMob.body.isThrown = true;
                        if (this.heldMob.type === 'player') {
                            this.heldMob.takeDamage(20, this.body);
                        }
                        this.heldMob = null;
                        this.windupTimer = 0;
                        this.throwCooldown = 90;
                        SoundFX.playThrow();
                        shakeAmount = Math.max(shakeAmount, 14);
                    }
                }
            } else if (this.throwCooldown <= 0 && !this.isEntering) {
                this.searchTimer = (this.searchTimer || 0) + 1;
                if (this.searchTimer % 8 === 0) {
                    for (let i = 0; i < entities.length; i++) {
                        const e = entities[i];
                        if (e !== this && 
                            !e.isDying && 
                            !e.markedForDeletion && 
                            e.type !== 'golem' &&
                            e.type !== 'spike_boss' &&
                            e.type !== 'flail' &&
                            !e.isBoss &&
                            (!player || player.grabbedEntity !== e) &&
                            Math.hypot(e.body.position.x - pos.x, e.body.position.y - pos.y) < 160) {
                            this.heldMob = e;
                            this.windupTimer = 0;
                            break;
                        }
                    }
                }
            }

            const speed = this.heldMob ? 1.2 : 1.8;
            Body.setVelocity(this.body, { x: dir * speed, y: this.body.velocity.y });
            this.animTimer += 0.08;
        }

        die(sourceBody = null) {
            if (this.heldMob) this.heldMob = null;
            super.die(sourceBody);
        }

        draw(ctx) {
            const pos = this.body.position;
            ctx.save();
            ctx.translate(pos.x, pos.y);

            const dir = this.facing;
            const walkCycle = Math.sin(this.animTimer);

            const rockDark = '#475569';
            const rockMid = '#64748b';
            const rockHighlight = '#94a3b8';

            ctx.fillStyle = rockDark;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 5;

            ctx.beginPath();
            ctx.roundRect(-34 + walkCycle * 8, 48, 26, 28, [6, 6, 10, 10]);
            ctx.fill(); ctx.stroke();

            ctx.beginPath();
            ctx.roundRect(10 - walkCycle * 8, 48, 26, 28, [6, 6, 10, 10]);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = rockMid;
            ctx.beginPath();
            ctx.moveTo(-50, 48); ctx.lineTo(-62, -22); ctx.lineTo(-44, -50);
            ctx.lineTo(44, -50); ctx.lineTo(62, -22); ctx.lineTo(50, 48);
            ctx.closePath(); ctx.fill(); ctx.stroke();

            ctx.strokeStyle = rockHighlight;
            ctx.lineWidth = 3.5;
            ctx.beginPath();
            ctx.moveTo(-22, -14); ctx.lineTo(0, -26);
            ctx.lineTo(18, -12); ctx.lineTo(12, 16);
            ctx.stroke();

            ctx.fillStyle = rockDark;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.roundRect(-28 + dir * 6, -68, 54, 36, [10, 10, 6, 6]);
            ctx.fill(); ctx.stroke();

            ctx.fillStyle = '#f59e0b';
            ctx.shadowColor = '#f59e0b';
            ctx.shadowBlur = 12;
            ctx.fillRect(-14 + dir * 14, -58, 8, 6);
            ctx.fillRect(4 + dir * 14, -58, 8, 6);
            ctx.shadowBlur = 0;

            ctx.fillStyle = rockMid;
            ctx.strokeStyle = '#1e293b';
            ctx.lineWidth = 5;

            if (this.heldMob) {
                ctx.beginPath(); ctx.roundRect(-58, -90, 28, 68, 10); ctx.fill(); ctx.stroke();
                ctx.beginPath(); ctx.roundRect(30, -90, 28, 68, 10); ctx.fill(); ctx.stroke();

                if (this.windupTimer > 12) {
                    ctx.fillStyle = 'rgba(239, 68, 68, 0.45)';
                    ctx.beginPath();
                    ctx.arc(dir * 20, -100, 52 + Math.sin(Date.now() / 40) * 10, 0, Math.PI * 2);
                    ctx.fill();
                }
            } else {
                const armOffset = walkCycle * 14;

                ctx.beginPath(); ctx.roundRect(-64, -26 - armOffset, 28, 72, 14); ctx.fill(); ctx.stroke();
                ctx.fillStyle = rockDark; ctx.beginPath(); ctx.arc(-50, 48 - armOffset, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

                ctx.fillStyle = rockMid; ctx.beginPath(); ctx.roundRect(36, -26 + armOffset, 28, 72, 14); ctx.fill(); ctx.stroke();
                ctx.fillStyle = rockDark; ctx.beginPath(); ctx.arc(50, 48 + armOffset, 18, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
            }

            ctx.restore();
            this.drawHpBar(ctx, 88);
        }
    }

    class Maw extends Entity {
        constructor(x, y) {
            const body = Bodies.circle(x, y, 42, {
                restitution: 0.35,
                friction: 0.05,
                density: 0.003
            });
            super(body, 80, 'maw', 2.0);
            this.radius = 42;
            this.jawTimer = Math.random() * Math.PI * 2;
